<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 28" role="img" aria-labelledby="nexus-logo-title nexus-logo-desc" fill="none">
  <title id="nexus-logo-title">Nexus</title>
  <desc id="nexus-logo-desc">Nexus timeline mark — five-node axis with solid center (light-gray to black gradient, matches logo-mono.png)</desc>
  <defs>
    <!-- Stops sampled from logo-mono.png node centers (left → right) -->
    <linearGradient id="nexus-timeline-mono" x1="0" y1="14" x2="284" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9C8C8"/>
      <stop offset="25%" stop-color="#7B7A7A"/>
      <stop offset="50%" stop-color="#4E4D4E"/>
      <stop offset="75%" stop-color="#131212"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <g stroke="url(#nexus-timeline-mono)" stroke-linecap="butt">
    <!-- Axis segments between node outer edges -->
    <path stroke-width="3.5" d="M28 14 H64 M92 14 H128 M156 14 H192 M220 14 H256"/>
    <!-- Ring nodes (left pair + right pair) -->
    <circle cx="14" cy="14" r="12.125" stroke-width="3.75"/>
    <circle cx="78" cy="14" r="12.125" stroke-width="3.75"/>
    <circle cx="206" cy="14" r="12.125" stroke-width="3.75"/>
    <circle cx="270" cy="14" r="12.125" stroke-width="3.75"/>
  </g>
  <!-- Solid center node -->
  <circle cx="142" cy="14" r="14" fill="url(#nexus-timeline-mono)"/>
</svg>
