[package]
name = "nexus-fixture-escape-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# A path dependency satisfies the consumer from a source copy that really
# exists next to this manifest (see `subject/`), never from a selected archive.
# The checker must reject the declaration itself.
nexus-fixture-escape = { path = "subject" }

# Standalone workspace root: the consumer inherits no product Cargo config.
[workspace]
