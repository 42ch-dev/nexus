[package]
name = "authoring-cohorts"
version = "0.0.0"
edition = "2021"
publish = false

# Checker-owned consumer, NOT a product and NOT a core test target: its own
# workspace keeps it out of the repository workspace, so `cargo run` here
# builds exactly the dependency set a consumer selects. `default = ["execution"]`
# is the execution-only consumer; `authoring` adds core's `strategy-authoring`
# surface on top. `tooling/check-graph-pins.sh --cohort authoring` asserts both
# resolved core feature sets, and `src/main.rs` asserts the runtime behaviour
# each one must produce.
[workspace]

[features]
default = ["execution"]
execution = ["nexus-core/execution"]
authoring = ["execution", "nexus-core/strategy-authoring"]

[dependencies]
# `default-features = false`: the domain default is empty, so the selection
# under test is exactly what the features above forward.
nexus-core = { path = "../../../crates/nexus-core", default-features = false }
nexus-contracts = { path = "../../../crates/nexus-contracts" }
nexus-home-layout = { path = "../../../crates/nexus-home-layout" }
nexus-local-db = { path = "../../../crates/nexus-local-db" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
