name: Served UI Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/nexus42/**'
      - 'crates/**'
      - 'modules/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/served-ui-smoke.sh'
      - '.github/workflows/desktop-build.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/nexus42/**'
      - 'crates/**'
      - 'modules/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/served-ui-smoke.sh'
      - '.github/workflows/desktop-build.yml'
      - '.github/actions/**'

concurrency:
  group: served-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SQLX_OFFLINE: "true"

jobs:

  served-ui-smoke:
    name: Served UI smoke test
    runs-on: macos-14
    # The job builds its own daemon + SPA and is self-contained.
    # Keeping it independent avoids coupling smoke coverage to another
    # packaging workflow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png)
          lfs: true

      - uses: ./.github/actions/setup-monorepo
        with:
          rust-targets: aarch64-apple-darwin, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: served-ui-smoke-macos-aarch64
          workspaces: |
            .
            modules/basic-combat

      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build

      - name: Run served-UI smoke test
        # The script's own SKIP_WEB_BUILD guard is left at its default so this
        # job builds the SPA locally and keeps the smoke test self-contained.
        run: ./scripts/served-ui-smoke.sh
