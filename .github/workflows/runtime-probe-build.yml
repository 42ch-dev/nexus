name: Runtime Probe Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nexus-runtime
          workspaces: .

      - name: Build runtime and official reference probe
        run: cargo build --release --target x86_64-pc-windows-msvc -p nexus42 --bin nexus-runtime --example runtime_smoke_probe --no-default-features --features connect-host

      - name: Smoke test binaries
        shell: pwsh
        run: |
          $runtime = & "target/x86_64-pc-windows-msvc/release/nexus-runtime.exe" --version
          $peer = & "target/x86_64-pc-windows-msvc/release/examples/runtime_smoke_probe.exe" --print-peer-only
          Write-Output $runtime
          Write-Output $peer
          if ($runtime -notmatch '^nexus-runtime ') { throw "unexpected runtime version: $runtime" }
          if ($peer -notmatch '^PROBE_PEER_ID=12D3KooW') { throw "unexpected probe identity: $peer" }

      - name: Run real runtime-to-reference-peer probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nexusDir = Join-Path $env:USERPROFILE '.nexus42'
          $connectDir = Join-Path $nexusDir 'connect'
          New-Item -ItemType Directory -Force -Path $connectDir | Out-Null

          @'
          active_creator_id = "ctr_smoke"

          [active_workspace_slug_by_creator]
          ctr_smoke = "default"
          '@ | Set-Content -Encoding utf8NoBOM (Join-Path $nexusDir 'config.toml')

          @'
          {
            "peer_ids": [
              "12D3KooWRawPbxPtP1eZaJpumGnyWX2DcUyd3RQnydr3eAto4Az7"
            ]
          }
          '@ | Set-Content -Encoding utf8NoBOM (Join-Path $connectDir 'allowlist.json')

          $runtime = Resolve-Path 'target/x86_64-pc-windows-msvc/release/nexus-runtime.exe'
          $probe = Resolve-Path 'target/x86_64-pc-windows-msvc/release/examples/runtime_smoke_probe.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'nexus-runtime.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'nexus-runtime.stderr.log'
          $process = $null
          try {
            $process = Start-Process -FilePath $runtime -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $deadline = (Get-Date).AddSeconds(45)
            $ready = ''
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if (Test-Path $stdout) {
                $runtimeOut = Get-Content -Raw -Encoding UTF8 $stdout
                $ready = if ($null -eq $runtimeOut) { '' } else { [string]$runtimeOut }
              }
              if ($process.HasExited -or $ready -match 'press Ctrl-C to stop') { break }
            }

            $runtimeErr = if (Test-Path $stderr) { Get-Content -Raw -Encoding UTF8 $stderr } else { '' }
            Write-Output $ready
            if ($runtimeErr) { Write-Output "runtime stderr:`n$runtimeErr" }
            if ($process.HasExited) { throw "runtime exited early with code $($process.ExitCode)" }
            if ([string]::IsNullOrWhiteSpace($ready)) { throw 'runtime readiness output was empty' }
            if ($ready -notmatch 'upsert/promote/relate/check/assemble/compute served') { throw 'runtime readiness surface missing' }

            $listenMatch = [regex]::Match($ready, '(?m)^\s*listen:\s*(\S+)\s*$')
            $peerMatch = [regex]::Match($ready, '(?m)^\s*peer_id:\s*(\S+)\s*$')
            if (-not $listenMatch.Success) { throw 'runtime readiness omitted listen address' }
            if (-not $peerMatch.Success) { throw 'runtime readiness omitted peer id' }
            $listen = $listenMatch.Groups[1].Value
            $hostPeer = $peerMatch.Groups[1].Value
            $probeOutput = & $probe --addr $listen --host-peer $hostPeer
            Write-Output $probeOutput
            if ($LASTEXITCODE -ne 0) { throw "reference probe exited $LASTEXITCODE" }
            $probeText = $probeOutput -join "`n"
            if ($probeText -notmatch 'DIAL_OK') { throw 'reference probe did not establish a session' }
            if ($probeText -notmatch 'SERVED_OPS=upsert,promote,relate,check,assemble,compute') { throw 'served-op manifest mismatch' }
            if ($probeText -notmatch 'SESSION_OK') { throw 'session did not remain usable' }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
          }

      - name: Package binaries and hashes
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Path runtime-probe-windows-x64
          Copy-Item "target/x86_64-pc-windows-msvc/release/nexus-runtime.exe" $out
          Copy-Item "target/x86_64-pc-windows-msvc/release/examples/runtime_smoke_probe.exe" $out
          Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), $_.Path.Substring($out.FullName.Length + 1) } |
            Set-Content -Encoding ascii -NoNewline:$false (Join-Path $out 'SHA256SUMS')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-probe-windows-x64
          path: runtime-probe-windows-x64/
          if-no-files-found: error
