          if ! out=$(cargo test -p nexus-core --features execution --test work_artifact_production_shape a_failed_simulated_scaffold_leaves_the_work_tree_alone -- --exact 2>&1); then
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq 'test result: ok\. 1 passed'
          if ! out=$(cargo test -p nexus-core --features execution --lib owner::capabilities::tests::simulated_fs_write_records_and_preserves_an_existing_chapter -- --exact 2>&1); then
            printf '%s\n' "$out"
            exit 1
