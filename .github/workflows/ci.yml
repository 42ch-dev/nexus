name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      codegen: ${{ steps.filter.outputs.codegen }}
      module-dx: ${{ steps.filter.outputs['module-dx'] }}
      service-native: ${{ steps.filter.outputs['service-native'] }}
      cohort-fixture: ${{ steps.filter.outputs['cohort-fixture'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            typescript:
              - '**/*.{ts,mts,cts}'
              - '**/*.tsx'
              - '**/*.{js,mjs,cjs}'
              - '**/*.jsx'
              - '**/*.css'
              - '**/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'schemas/**'
              - 'packages/nexus-ui/assets/**'
              - 'apps/web/**'
              - 'apps/design-studio/**'
              - 'apps/desktop-electron/**'
              - 'apps/nexus-service/**'
              - 'packages/**'
              - 'tooling/codegen/**'
              - 'tooling/design-tokens/**'
              - 'tooling/validation/**'
              - 'strategy-samples/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.oxlintrc.json'
              - '**/tsconfig.json'
              - '**/tsconfig.*.json'
              - '!**/*.md'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - '.rustfmt.toml'
              - 'rust-toolchain*'
              - 'schemas/**'
              - 'modules/**'
              - 'crates/**'
              - 'apps/nexus42/**'
              - '.sqlx/**'
              - 'strategy-samples/**'
              - 'tooling/check-*.sh'
              # The guard's fixture regression runs in schema-consistency-check
              # (gated by this filter), so a test-only edit must trigger it.
              - 'tooling/check-graph-pins.test.mjs'
              - 'tooling/release/**'
              - 'tooling/work-artifact-write-allowlist.tsv'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '!**/*.md'
            codegen:
              - 'schemas/**'
              - 'tooling/codegen/**'
              - 'packages/nexus-contracts/src/generated/**'
              - 'crates/nexus-contracts/src/generated/**'
              - 'tooling/check-codegen-callsite-coverage.sh'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            # The authoring cohort's own manifest: a PR that changes it must ship
            # the matching fixture lock (see the bounded lock guard below). This
            # is an event-range filter, not a worktree diff, because the checkout
            # already contains the committed manifest.
            cohort-fixture:
              - 'tooling/fixtures/authoring-cohorts/Cargo.toml'
            module-dx:
              - 'modules/**'
              - 'schemas/daemon-api/compute/**'
              - 'crates/nexus-wasm-host/**'
              - 'tooling/check-module-sdk-drift.sh'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            service-native:
              # The set that can change what a service boot loads: the service
              # itself, the native loader facade, the addon crate, and the
              # workspace crates the addon links.
              - 'apps/nexus-service/**'
              - 'packages/nexus-native/**'
              - 'packages/nexus-native-*/**'
              - 'packages/nexus-contracts/**'
              - 'packages/nexus-provider-acp/**'
              - 'crates/nexus-core-node/**'
              - 'crates/nexus-core/**'
              - 'crates/nexus-wasm-host/**'
              - 'modules/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '!**/*.md'

  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Validate schemas
        run: pnpm run validate-schemas

  verify-codegen:
    name: Verify Codegen Output
    runs-on: ubuntu-latest
    needs: [changes, validate-schemas]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.codegen == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      # Free disk before the Rust toolchain + cargo cache: this job now
      # compiles the full workspace, so it needs the same ENOSPC headroom
      # policy as rust-checks / rust-tests (CARGO_INCREMENTAL: "0" above).
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-monorepo
        with:
          # V1.182 P0 (R-V1163P2QC1-002): rust is required so this job can
          # compile typify consumers immediately after regen.
          rust-toolchain: stable
          # nexus-wasm-host's build.rs compiles embedded modules from source
          # (same reason as rust-checks).
          rust-targets: wasm32-unknown-unknown
      - name: Run codegen
        run: pnpm run codegen
      - name: Run codegen tests
        run: pnpm --filter nexus-codegen test
      - name: Check generated code is up-to-date
        run: |
          # After running codegen, check if generated files match committed versions
          if ! git diff --exit-code packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/; then
            echo "❌ Generated code is outdated or not committed!"
            echo "Please run 'pnpm run codegen' locally and commit the changes."
            echo ""
            echo "Changed files:"
            git diff --name-only packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/
            exit 1
          fi
          echo "✅ Generated code is up-to-date"
      - name: Verify TypeScript generated
        run: test -d packages/nexus-contracts/src/generated && test -f packages/nexus-contracts/src/generated/index.ts
      - name: Verify Rust generated
        run: test -d crates/nexus-contracts/src/generated && test -f crates/nexus-contracts/src/generated/mod.rs
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          # Distinct suffix avoids concurrent cache writers racing with the
          # sqlx, connect-host, and test jobs.
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-codegen-callsite
          workspaces: .
          # ENOSPC headroom policy (same as rust-checks): never cache every
          # crate, never persist a partial cache from a failed run.
          cache-all-crates: false
          cache-on-failure: false
      - name: Codegen callsite coverage
        run: bash tooling/check-codegen-callsite-coverage.sh

  rust-checks:
    name: Rust fmt & clippy
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      # Disable incremental to cap target/debug/incremental growth on ephemeral
      # runners (see rust-tests / ENOSPC mitigation in plan 2026-07-15).
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Pin the fmt nightly so CI matches local rustfmt exactly. rustfmt
      # formatting rules drift across nightly versions, so an unpinned
      # `nightly` makes CI's `fmt --check` fail on code formatted by a
      # different local nightly. Bump this (and AGENTS.md) when updating.
      FMT_NIGHTLY: "nightly-2026-06-26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy
          # nexus-wasm-host's build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly rustfmt (for workspace .rustfmt.toml `ignore` on codegen output)
        run: rustup toolchain install "${FMT_NIGHTLY}" --component rustfmt --no-self-update
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Check formatting
        run: cargo +"${FMT_NIGHTLY}" fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Check contract crates are packageable offline
        timeout-minutes: 15
        run: |
          # `cargo package --offline` resolves against the registry cache, and
          # the three standalone module crates are not root-workspace members,
          # so clippy above never fetches their graphs (e.g. `dlmalloc`).
          node -e 'for (const { manifest } of require("./tooling/release/version-brackets.json").contract) console.log(manifest)' \
            | while read -r manifest; do cargo fetch --manifest-path "$manifest"; done
          # `--require-clean` makes the run refuse (exit 1, no report) unless
          # the staged tree carries the checked-out revision's blobs, which is
          # the `source.clean` a release plan requires. This step submits no
          # JSON: it is a gate, not a receipt producer. It does not compare
          # executable modes, and it does not prove LFS hydration.
          node tooling/release/check-contract-packageability.mjs --require-clean
      # The release scripts decide what a governed release writes, so their
      # fixtures (both version brackets, every carrier rejection, the
      # packageability loop) must be green on the PR that changes them, not only
      # in the manually dispatched new-release preflight. Runs after the step
      # above so the registry cache already holds every contract crate graph.
      - name: Run release tooling tests (version brackets and lockstep rules)
        timeout-minutes: 10
        run: node --test 'tooling/release/*.test.mjs'

  verify-sqlx-offline:
    name: Verify sqlx offline metadata
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-sqlx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Verify sqlx offline metadata is up-to-date
        run: |
          # SQLX_OFFLINE=true makes cargo check use committed .sqlx/ metadata
          # If any query macro's metadata is missing or stale, this will fail
          cargo check --all --all-targets
          # This proves the cache is *sufficient*, not *current*: an entry for a
          # query the source no longer has stays invisible here. `cargo sqlx
          # prepare --check` is the freshness check, but it cannot run in this
          # job (and does not help): it still needs a live DATABASE_URL that can
          # describe every query, and a plain migrated DB cannot — the
          # writer-protocol triggers call connection-local `nexus_writer_*`
          # UDFs. Run prepare only through the documented escape path
          # (pr-fix2-report.md F4), never as a CI gate.

  # V1.177 P0 (AR-99, PL-1): connect-host lint gate. Runs after Task-1 cleanup
  # (plan 2026-08-27-v1.177-p0-connect-host-clippy-gate) so connect-host clippy
  # debt cannot silently regrow: the default-graph clippy never sees this
  # opt-in graph. Separate leg instead of a rust-checks step: a second,
  # differently-feature-unified dep graph (spoke-connect/libp2p/sqlx variants)
  # in the shared target/ would double that job's peak disk against the
  # ENOSPC headroom policy above; the distinct shared-key suffix mirrors the
  # -sqlx / -module-dx precedents (same-key concurrent writers would race).
  rust-clippy-connect-host:
    name: Rust clippy connect-host
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
          # nexus-wasm-host is a nexus42 dev-dependency (--all-targets pulls
          # it in); its build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-connect-host
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run clippy (connect-host)
        run: cargo clippy -p nexus42 --features connect-host --all-targets -- -D warnings
  # v1.180 P0 (RN-OGA-1): provider stream conformance gate. Runs the neutral
  # runner + scripted fixtures against the REAL native adapters (claude-codes /
  # codex-codes / dsh-native) — a PR that drifts normalized stream lifecycle
  # fails here without credentials. Separate leg from rust-tests: the fixture
  # tests spawn python3 speakers (ubuntu-latest ships python3) and the crate
  # is a CI/test-only gate, not part of the product test matrix.
  provider-conformance:
    name: Provider stream conformance
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-provider-conformance
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run provider conformance tests
        run: cargo test -p nexus-provider-conformance

  typescript-checks:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build
      - name: Typecheck
        run: pnpm run typecheck
      # oxlint's type-aware pass (options.typeAware) resolves the linted apps'
      # workspace imports through each package's `types` field
      # (dist/index.d.ts). Without those declarations @42ch/nexus-service
      # imports resolve to error types and
      # apps/desktop-electron/src/utility-host.ts:41 collapses its union into
      # `typescript/no-redundant-type-constituents`. Build the dependency
      # chain in order — native and provider-acp are nexus-service's
      # prerequisites (`tsc` fails on TS2307 without either) — so the linted
      # program sees real declarations. Root-cause repair: no rule and no file
      # is disabled for it.
      - name: Build workspace type dependencies
        run: |
          pnpm --filter @42ch/nexus-native run build
          pnpm --filter @42ch/nexus-provider-acp run build
          pnpm --filter @42ch/nexus-service run build
      - name: Lint
        run: pnpm run lint

  # v1.222 review (6v6rFh): the boot/bootstrap and bind-gate regressions spawn a
  # real `dist/main.js`, which loads the gitignored native addon staged by
  # `packages/nexus-native/scripts/build.mjs`. This job used to run them with no
  # Rust toolchain, so the boots could never resolve the addon; they get their
  # own leg that builds exactly the artifact they load.
  nexus-service-regressions:
    name: nexus-service boot & bind-gate regressions
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['service-native'] == 'true'
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-monorepo
        with:
          # nexus-core-node's graph pulls nexus-wasm-host, whose build.rs
          # compiles the embedded modules from source.
          rust-targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-service-native
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Build workspace type dependencies
        # The service's `tsc` resolves these through each package's built `dist`
        # declarations (same order as the TypeScript leg).
        run: |
          pnpm --filter @42ch/nexus-contracts run build
          pnpm --filter @42ch/nexus-native run build
          pnpm --filter @42ch/nexus-provider-acp run build
      - name: Stage the native addon
        # The loader reads exactly `packages/nexus-native-<platform>/native/
        # nexus_core_node.node`; the artifact is gitignored, so a checkout alone
        # can never satisfy a boot. Assert the staged pair so a silent build
        # no-op fails here instead of skipping the real boot.
        run: |
          node packages/nexus-native/scripts/build.mjs
          test -s packages/nexus-native-linux-x64-gnu/native/nexus_core_node.node
          test -s packages/nexus-native-linux-x64-gnu/native/compatibility.json
      - name: Build the CLI used by the one-kernel test
        # The native addon and CLI select different feature graphs. Building
        # the addon does not prebuild `cargo run -p nexus42 --bin nexus42`;
        # keep that cold compile/link outside Node's per-file test timeout.
        run: cargo build --locked -p nexus42 --bin nexus42
      - name: Test nexus-service boot and bind gate
        run: pnpm --filter @42ch/nexus-service run test
      - name: Check nexus-service test discovery and naming contract
        run: |
          node apps/nexus-service/tooling/check-service-test-discovery.mjs --self-test
          node apps/nexus-service/tooling/check-service-test-discovery.mjs
      - name: Test native config publication
        # `readonly-config.test.mjs` is deliberately NOT wired here: it seeds its
        # homes through `cargo run -q -p nexus-core-node --bin
        # native-wire-fixture-seed`, an uncached debug build of the whole core, so
        # it stays a local check. Its Rust half
        # (`crates/nexus-core/tests/readonly_config_open.rs`) runs in the
        # rust-tests job; the native prerequisite half runs only locally.
        run: node --test packages/nexus-native/tests/config-publication.test.mjs

  web-build:
    name: Web app build & typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build and typecheck web
        run: pnpm run build:web
      - name: Verify shared outputs remain stable during the root build
        run: node --test scripts/workspace-build.test.mjs
      - name: Test web
        run: pnpm --filter web test

  nexus-ui:
    name: Build & typecheck @42ch/nexus-ui
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run build
      - name: Typecheck nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run typecheck

  schema-consistency-check:
    name: Schema Consistency Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      # check-wire-drift.sh runs `cargo test -p nexus-contracts --test schema_drift_detection`
      # plus node-based spoke pin checks; setup-monorepo provides Rust + Node (no deps needed).
      - uses: ./.github/actions/setup-monorepo
        with:
          install-deps: "false"
      - name: Run schema consistency checks
        run: bash tooling/check-schema-drift.sh
      - name: Check wire schema drift
        run: bash tooling/check-wire-drift.sh
      # I-000590: the knowledge-entry seam's structural guard used to walk the
      # checkout from `cargo test`, where a `pub(crate) fn` copy slipped past
      # its `pub fn` needle. It is a tracked-source scan now, run here so the
      # gate is visible and the test file stays behavioural.
      - name: Check knowledge-entry seam surface
        run: bash tooling/check-kb-stub-surface.sh
      # The scanner's fixtures are the only thing keeping its matching honest;
      # an unrun fixture suite is documentation.
      - name: Self-test the knowledge-entry seam scanner
        run: bash tooling/check-kb-stub-surface.sh --selftest
      # V1.174 P0 T6 (AR-74), retargeted for the v1.193 P2 product cohorts:
      # dependency graph pins — structure only (absence, single resolved
      # version, resolved feature set), never a version value: the ordinary
      # `cli` graph stays free of spoke-connect/libp2p/rmcp and the removed
      # Model A selectors are gone; the Connect graphs resolve a single
      # spoke-operations / libp2p / spoke-connect each; rmcp survives only in
      # the core connect-client/embedded-mcp library cohorts; the shipped CLI
      # graphs resolve a single agent-client-protocol and one featureless
      # graph-flow. `cargo tree` needs a Rust toolchain; setup-monorepo above
      # provides it.
      - name: Check graph pins
        run: bash tooling/check-graph-pins.sh
      # The arg-less matrix above does not assert the v1.249 domain invariants
      # (session storage / Connect absent from the core closure, the provider's
      # exact-one default-featured edge), and the fixture suite proves them only
      # on synthetic workspaces. Run the cohort against the real workspace so a
      # domain regression fails CI instead of waiting for a manual run.
      - name: Check graph pins (domain cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort domain
      # V1.249 compute-policy QC fix (QC3-S002): the policy leaf cohort runs
      # against the real workspace too — the no-argument matrix above stays the
      # sole full-matrix invocation.
      - name: Check graph pins (policy cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort policy
      # V1.249 S4 / QC3-F001: the catalog cohort's unique rows (`nexus-core ""`
      # exact default feature set and the featureless spoke adapter) had no CI
      # invocation. Every shipped cohort now runs against the real workspace;
      # the no-argument matrix above stays the sole full-matrix invocation.
      - name: Check graph pins (catalog cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort catalog
      # V1.249 C4: the capability extraction's integration proof against the
      # real workspace — the enabled Connect library resolves capability +
      # transport and none of the five engine planes, the default capability
      # crate carries no WASM edge, an explicit `wasm` selection binds the real
      # host, and the native host keeps its factory dependencies. The no-arg
      # matrix above remains the sole full-matrix invocation.
      - name: Check graph pins (capability cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort capability
      # V1.249 S6: the Connect product/library split against the real workspace
      # — the shipped Connect-only runtime keeps core domain/storage and the
      # explicit spoke compute (the real WASM host) while linking no
      # engine/store/graph/authoring/Host/rmcp plane, and the enabled Connect
      # library still depends back on none of core or those planes. This is
      # also the row that pins `connect-host` does not imply `cli`; the larger
      # CLI/native union stays in the source-owned no-argument matrix.
      - name: Check graph pins (connect cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort connect
      # V1.249 A3: the strategy-authoring surface as a SELECTION. The no-arg
      # matrix and the synthetic suite below pin the shipped graphs, but neither
      # runs the real cohort or the checker-owned consumer — a later CLI/native
      # forwarding regression would keep them green. The cohort resolves the
      # checked-in consumer manifest (both selections) and the two `cargo run`
      # steps execute its runtime assertions.
      #
      # The consumer is its own workspace with its own 327-package lock, so the
      # two `--offline` runs need ITS closure in the local registry cache. This
      # job restores no Rust cache, and `check-wire-drift.sh` only builds
      # `nexus-contracts`, so the closure is fetched explicitly here first: the
      # download is bounded by this step's budget and warms the same CARGO_HOME
      # the offline runs read. This is also the only CI compile of
      # `nexus-core[execution]` WITHOUT `strategy-authoring`, so skipping the
      # consumer would hide a cfg regression.
      # The cohort owns an independent lockfile that Dependabot never refreshes,
      # so a workspace transitive bump must not fail this gate: the unlocked
      # fetch reconciles that lock against the current graph, and the two
      # `cargo run --locked --offline` steps then prove the resolved set is used
      # reproducibly. A change to the cohort's OWN manifest still has to carry
      # its lock; the cleanliness check below enforces exactly that, and
      # nothing else.
      - name: Fetch the authoring consumer closure
        timeout-minutes: 15
        run: cargo fetch --manifest-path tooling/fixtures/authoring-cohorts/Cargo.toml
      # Bounded guard: only a PR that changes the cohort's OWN manifest must
      # ship the matching lock. The check runs over the fetch result, which is
      # the only place the resolved graph is visible — comparing the event range
      # (the `changes` filter) rather than the worktree, because the checkout
      # already contains the committed manifest. A workspace transitive bump
      # rewrites the lock here by design and does not fail this job.
      - name: Authoring cohort lock follows its own manifest
        if: ${{ needs.changes.outputs['cohort-fixture'] == 'true' }}
        timeout-minutes: 2
        run: git diff --exit-code -- tooling/fixtures/authoring-cohorts/Cargo.lock
      - name: Check graph pins (authoring cohort)
        timeout-minutes: 10
        run: bash tooling/check-graph-pins.sh --cohort authoring
      - name: Authoring consumer (execution-only)
        timeout-minutes: 15
        run: cargo run --locked --offline --manifest-path tooling/fixtures/authoring-cohorts/Cargo.toml
      - name: Authoring consumer (authoring)
        timeout-minutes: 15
        run: cargo run --locked --offline --manifest-path tooling/fixtures/authoring-cohorts/Cargo.toml --features authoring
      # v1.249 R3 + compute-policy QC: the scoped cohort selectors and the
      # `--manifest-path` override are proven on disposable real-Cargo
      # workspaces — positive fixtures, one rejection per forbidden edge, the
      # empty-graph positive control, invalid inputs and Cargo failure
      # propagation. No fixture edits the shared checkout's manifests or
      # lockfile.
      - name: Graph pin guard regression
        timeout-minutes: 10
        run: node --test tooling/check-graph-pins.test.mjs
      # V1.236 P5-T2 (ADR #485 §6.1 P5): the Work artifact byte-write guard.
      # Prove the gate bites on synthetic fixtures (synthetic direct write,
      # mixed function, and an exempt symbol with a second write), then run it
      # against the globbed inventory with exact path+symbol+count exemptions.
      - name: Work artifact write guard — synthetic direct write must fail
        run: |
          tmpdir="$(mktemp -d)"
          fixture="$tmpdir/synthetic.rs"
          printf 'fn sneaky() {\n    std::fs::write("Works/wrk_x/ch1.md", b"x").unwrap();\n}\n' > "$fixture"
          if bash tooling/check-work-artifact-writes.sh "$fixture"; then
            echo "::error::work artifact write guard accepted a synthetic direct Work write"
            exit 1
          fi
          # A mixed function (port commit then a direct write) must also fail:
          # the non-Work fallback is an exact (path, symbol) pair, not a
          # function-wide property.
          mixed="$tmpdir/mixed.rs"
          printf 'fn mixed(executor: &dyn WorkspaceExecutor) {\n    let _ = WorkPath::Artifact; let _ = FsWorkArtifactPort;\n    std::fs::write("Works/wrk_x/ch2.md", b"x").unwrap();\n}\n' > "$mixed"
          if bash tooling/check-work-artifact-writes.sh "$mixed"; then
            echo "::error::work artifact write guard waived a mixed-function direct Work write"
            exit 1
          fi
          # An exempt symbol that gains a second direct write must fail the
          # expected-count check (exemption keys carry an exact hit count).
          count_dir="$tmpdir/count"
          mkdir -p "$count_dir/crates/nexus-capability/src/builtins"
          printf 'struct ScaffoldTransaction;\nimpl Drop for ScaffoldTransaction {\n    fn drop(&mut self) {\n        std::fs::write(path, original);\n        std::fs::write(path, other);\n    }\n}\n' > "$count_dir/crates/nexus-capability/src/builtins/essay_scaffold.rs"
          if bash tooling/check-work-artifact-writes.sh "$count_dir"; then
            echo "::error::work artifact write guard ignored a second direct write in an exempt symbol"
            exit 1
          fi
          # Two direct writes on one line must count as two occurrences.
          same_line="$tmpdir/same-line"
          mkdir -p "$same_line/crates/nexus-capability/src/builtins"
          printf 'struct ScaffoldTransaction;\nimpl Drop for ScaffoldTransaction {\n    fn drop(&mut self) {\n        std::fs::write(path, original); std::fs::write(path, other);\n    }\n}\n' > "$same_line/crates/nexus-capability/src/builtins/essay_scaffold.rs"
          if bash tooling/check-work-artifact-writes.sh "$same_line"; then
            echo "::error::work artifact write guard counted one line as one write"
            exit 1
          fi
      - name: Work artifact write guard
        run: bash tooling/check-work-artifact-writes.sh

  # Compute module DX — SDK + modules (V1.170 P0, AR-12). Runs only when
  # module-affecting paths change (or on manual workflow_dispatch). The leg is
  # fully offline: crates.io deps come via the registry cache; the wasm build
  # and all tests run against committed sources. GitHub Actions has no native
  # job-level `paths` filter, so path gating uses dorny/paths-filter
  # (SHA-pinned per repo convention); every module step ORs its own gate with
  # `workflow_dispatch` so a manual run always executes.
  module-dx:
    name: Compute module DX — SDK + modules
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['module-dx'] == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-module-dx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            module-dx:
              - 'modules/**'
              - 'schemas/daemon-api/compute/**'
              - 'crates/nexus-wasm-host/**'
              - 'tooling/check-module-sdk-drift.sh'
      - name: Test nexus-module-sdk (golden-fixture round-trip)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-sdk/Cargo.toml
      - name: Test nexus-module-test (mini-host + fixture conformance)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-test/Cargo.toml
      - name: Check module SDK drift (mirror-gap + fixture-parity)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: bash tooling/check-module-sdk-drift.sh
      - name: Build basic-combat for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/basic-combat/Cargo.toml
      - name: Validate basic-combat manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/basic-combat
          # The mini-host conformance test parses the source manifest as
          # `ModuleManifest` (the extracted validator's contract) and runs the
          # full 4-part ABI round-trip against the freshly built artifact —
          # the `nexus42 compute validate` equivalent without a full CLI build.
          # qc3 F-003: the env-gated conformance test skips (fail-open) when
          # the env pair is unset — that path is for LOCAL DEV only. CI must
          # run it for real: assert the artifact pair exists so a future step
          # refactor cannot silently turn the gate into a visible SKIP.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/basic_combat.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — real-artifact conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — real-artifact conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_basic_combat_artifact_conformance
      - name: Build _template for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/_template/Cargo.toml
      - name: Validate _template manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/_template
          # qc3 F-002: the template scaffold (the author-copying starting
          # point) must be CI-compiled and its manifest validated through the
          # extracted validator (mini-host conformance) — a scaffold break
          # must fail the PR, not ship silently. Same fail-open SKIP contract
          # as the basic-combat conformance (qc3 F-003): assert the artifact
          # pair exists here so CI always runs the real gate.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/template_dice.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — template conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — template conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_template_artifact_conformance
      - name: Real-host byte-compat gate (basic_combat fixtures)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test -p nexus-wasm-host --test basic_combat

  ui-guardrails:
    name: UI guardrails — wrapper drift & Studio boundaries
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - name: Check promoted-wrapper forbidden imports & Studio boundaries
        run: bash tooling/check-ui-guardrails.sh

  # Heavy Rust jobs: free-disk before toolchain/cache restore, CARGO_INCREMENTAL=0,
  # scoped rust-cache (workspace crates only), and split orchestration legs so
  # peak target/ fits ubuntu-latest (~14 GiB free after preinstalled software).
  rust-tests:
    name: Rust tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: >-
              -p nexus-contracts
              -p nexus-home-layout
              -p nexus-local-db
              -p nexus-cloud-domain
              -p nexus-config-metadata
              -p nexus-memory-conformance
              -p nexus-spoke-adapter
          - group: orchestration-core
            packages: >-
              -p nexus-orchestration
              -p nexus-creator
              -p nexus-creator-memory
              -p nexus-cloud-sync
          - group: orchestration-knowledge
            packages: >-
              -p nexus-knowledge
              -p nexus-knowledge
              -p nexus-narrative
              -p nexus-moment-context-assembly
              -p nexus-wasm-host
          # Split out of one cli-hosts group: the group's warm Run tests step
          # measured 8m06s and nexus42's own test targets dominate it, so the
          # combined row cannot fit the 5 min budget. Each row keeps its exact
          # package set; both run the peer setup below.
          - group: cli
            packages: >-
              -p nexus42
          - group: hosts
            packages: >-
              -p nexus-acp-host
              -p nexus-agent-host
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-${{ matrix.group }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Setup monorepo for provider-acp tests
        if: matrix.group == 'hosts' || matrix.group == 'cli'
        uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build nexus-provider-acp test peer
        if: matrix.group == 'hosts' || matrix.group == 'cli'
        # The peer imports `@42ch/nexus-contracts` from its built `dist`, so the
        # contracts package is built first (same order as the web job).
        run: |
          pnpm --filter @42ch/nexus-contracts run build
          pnpm --filter @42ch/nexus-provider-acp build
      # Named gate, not a duplicate of `Run tests` below: it reds on its own step when a
      # committed `preset.yaml` stops matching the `workflow.json` it is exported from, and
      # `--test sample_self_check` fails loudly if the target is ever deleted (a plain
      # `cargo test` would silently run nothing). The target needs no features — it reads
      # `nexus-preset`, not the feature-gated IR walk.
      - name: Run sample self-check (preset.yaml equals its workflow.json export)
        if: matrix.group == 'orchestration-core'
        run: cargo test -p nexus-orchestration --test sample_self_check
      # I-000475: the preset round trips, the private pure walk, the IR/YAML projection
      # parity proofs and both embedded-preset trajectories never ran in CI, so their green
      # was local-only. The SIMULATION CHECKS: the walk is now its own private crate (no
      # feature gate on `nexus-orchestration`), and `--lib ...parity` selects zero tests
      # without the targets named here. Measured 40s warm locally.
      - name: Run preset simulation and projection suites
        if: matrix.group == 'orchestration-core'
        timeout-minutes: 10
        run: |
          cargo test -p nexus-preset
          cargo test -p nexus-workflow-simulate --lib
          cargo test -p nexus-orchestration --lib preset_runtime::tests::parity
          cargo test -p nexus-orchestration --test embedded_preset_trajectory --test sample_trajectory
      - name: Run tests
        run: cargo test ${{ matrix.packages }}

  # R-V1193-P1T7-CI-CONNECT-HOST-TESTS (v1.193 P2-T14). The retirement left
  # exactly two shipped app cohorts: the ordinary `cli` default (covered by
  # the `cli-hosts` rust-tests group above) and the independent
  # `connect-host` selector, which never implies `cli`. This leg exercises the
  # Connect half in its supported verification shape: the Connect-only
  # runtime bin check (no default features) plus the named headless-runtime
  # smoke test in the cli+connect-host cohort. It is deliberately NOT a
  # `--no-default-features --features connect-host --all-targets` row: six
  # cli-cohort integration test targets import cli-gated modules, so that
  # combination does not build (P2-T13 C1). Separate leg rather than a
  # rust-tests matrix row because the command shape differs (bin check +
  # named test) and a second, differently-feature-unified dep graph must not
  # share the matrix group's cache key.
  rust-connect-host:
    name: Rust connect-host runtime
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # V249 QC3-F002: this job owns the retained-compute proof, so a host
      # without the wasm32 target is a named build failure (nexus42/build.rs)
      # instead of a silently skipped smoke half.
      NEXUS42_REQUIRE_WASM_TARGET: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # nexus-wasm-host's build.rs compiles the embedded modules from
          # source; the Connect cohort keeps the explicit spoke compute edge
          # (and its shared module cache) by design.
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          # Distinct suffix: this cohort's feature unification differs from
          # rust-tests' groups and rust-clippy-connect-host (same-key
          # concurrent writers would race — same precedent as -sqlx/-module-dx).
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-connect-host-runtime
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Check the Connect-only runtime bin
        run: cargo check -p nexus42 --no-default-features --features connect-host --bin nexus-runtime
      - name: Build the runtime smoke probe example
        # The smoke test spawns target/debug/examples/runtime_smoke_probe; the
        # test target alone does not build example targets.
        run: cargo build -p nexus42 --features connect-host --example runtime_smoke_probe
      - name: Run the headless runtime smoke test
        run: |
          if ! out=$(cargo test -p nexus42 --features connect-host --test nexus_runtime_smoke headless_runtime_prints_readiness_serves_connect_and_has_no_http_listener -- --exact 2>&1); then
            printf '%s\n' "$out"
            exit 1
