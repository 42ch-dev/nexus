          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq 'test result: ok\. 1 passed'

  # I-000340 (follow-up). The C-111 remote creator-memory cohort was a step on
  # the `cli` matrix row (I-000324), but it compiles a differently-feature-
  # unified graph: `nexus42 --features memory-remote` pulls
  # `nexus-core/memory-remote` and links the memory client, so its dep graph
  # must not share the matrix row's cache key — the same precedent recorded
  # for rust-connect-host above ("a second, differently-feature-unified dep
  # graph must not share the matrix group's cache key"). The `cli` row's
  # budget already forced one split; giving the cohort its own small leg keeps
  # both caches coherent instead of accepting extra minutes on a row that
  # cannot absorb them. Same command as before, same runner class, no
  # coverage change; no peer setup needed (the test spawns
  # CARGO_BIN_EXE_nexus42 only).
  rust-memory-remote:
    name: Rust memory-remote cohort
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          # Distinct suffix: this cohort's feature unification differs from
          # rust-tests' groups, rust-connect-host and rust-clippy-connect-host
          # (same-key concurrent writers would race — same precedent as
          # -sqlx/-module-dx).
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-memory-remote
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run memory-remote creator cohort
        run: cargo test -p nexus42 --features memory-remote --test creator_memory_remote
      - name: Run dev-graph memory-remote conformance cohort
        # C7 (I-000322) marks twelve nexus-memory-conformance test targets
        # `required-features = ["dev-graph-memory-remote"]`, so the plain
        # `cargo test ${{ matrix.packages }}` core-group step skips them. The
        # feature exists only on that package: never append it to the
        # multi-package group invocation. Clippy coverage of this combination
        # is out of scope: the feature set leaves the pre-existing
        # `nexus-core` `test_hooks` seams dead (their only users need
        # `compute`), so `--all-targets -- -D warnings` fails on dead_code
        # that predates this card.
        run: cargo test -p nexus-memory-conformance --features dev-graph-memory-remote
      - name: Run nexus-core memory-remote drift-guard tests
        # I-000338's `memory_credentials` drift guards are
        # `#[cfg(all(test, feature = "memory-remote"))]`; the core-group
        # invocation never enables nexus-core's `memory-remote`, so without
        # this step the tripwire fires only locally.
        run: cargo test -p nexus-core --features memory-remote --lib


  # QC3 W-001 / QC2 F-001 (v1.193 P2-T14). Retiring the Rust daemon crate moved
  # its domain coverage into `crates/nexus-core/tests/` (the `retained_*` owners
  # plus the extended core owners). The deleted `daemon` rust-tests group was the
  # only CI row executing that graph, and `nexus-core` was never in the matrix,
  # so those migrated assertions were enforced only by local runs. This leg runs
  # them with the feature set each target needs — the crate-level `#![cfg]` gates
  # mean a wrong feature set silently selects ZERO tests, which is not proof:
  #   * no optional features: the migrated domain owners (world/KB/pack,
  #     work/home/preset, reading/context/content/timeline, memory)
  #   * execution,compute,provider-host (Host/execution owners):
  #     retained_execution_contracts, execution_lifecycle, handle_ops,
  #     workspace_commit, capability_compute, host_actor_lifecycle
  #   * connect-client,embedded-mcp (core MCP/peer library owners):
  #     retained_peer_contracts, peer_control
  # Deliberately no `--all-targets` and no connect-host/other-cohort row
  # (P2-T13 C1). The non-actor owners stay at `--test-threads=2`; the
  # actor_services cohort runs separately at `--test-threads=4` on T5's
  # deterministic boundary and repeated concurrent-run evidence.

  # Split into four jobs (plan: CI <= 5 min). A single job ran every cohort
  # below serially and measured 11m31s warm — the longest non-CodeQL leg. The
  # invocations are independent cargo runs on different feature graphs, so they
  # parallelise without changing any assertion: each cohort keeps its original
  # target list, feature set and --test-threads value verbatim.
  rust-core-feature-cohorts:
    name: Rust core feature cohorts
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debuginfo for faster codegen/link and far smaller target/.
      # Behaviour unchanged; local dev profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # nexus-wasm-host's build.rs compiles the embedded modules from
          # source; the `compute` feature edge puts it in this graph.
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          # Per-job suffix: this job runs multiple feature graphs; keep its cache
          # separate from concurrent Rust legs that may write under another key.
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-core-feature-cohorts
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Core library feature cohorts (no dev-target unification)
        # R-V1195P4-001 (v1.196 P1-T2): `cargo test` builds activate
        # nexus-core's own dev-dependencies, and that unification supplies
        # `execution` to a lib-only graph that never selected it — so a green
        # test leg below can hide an uncompilable library cohort. These four
        # `--lib` checks pin the shape that must compile on its own. Separate
        # invocations are intentional: no multi-package selection, no
        # `--all-targets`, no `--workspace`, no cargo test.
        run: |
          cargo check -p nexus-core --lib --no-default-features --locked
          cargo check -p nexus-core --lib --no-default-features --features execution --locked
          cargo check -p nexus-core --lib --no-default-features --features connect-client --locked
          cargo check -p nexus-core --lib --no-default-features --features connect-client,embedded-mcp --locked
      - name: Core MCP/peer library owners
        run: |
          # The unfeatured crate is the whole fan-in proof for the v1.244
          # extraction: it must compile with no core/orchestration edge.
          cargo check -p nexus-connect --no-default-features --locked
          cargo test -p nexus-connect --features connect-client,embedded-mcp --test retained_peer_contracts
          cargo test -p nexus-core --features connect-client,embedded-mcp --test peer_control

