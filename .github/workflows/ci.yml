name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      codegen: ${{ steps.filter.outputs.codegen }}
      module-dx: ${{ steps.filter.outputs['module-dx'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            typescript:
              - '**/*.{ts,mts,cts}'
              - '**/*.tsx'
              - '**/*.{js,mjs,cjs}'
              - '**/*.jsx'
              - '**/*.css'
              - '**/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'schemas/**'
              - 'packages/nexus-ui/assets/**'
              - 'apps/web/**'
              - 'apps/design-studio/**'
              - 'apps/desktop-electron/**'
              - 'apps/nexus-service/**'
              - 'packages/**'
              - 'tooling/codegen/**'
              - 'tooling/design-tokens/**'
              - 'tooling/validation/**'
              - 'strategy-samples/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.oxlintrc.json'
              - '**/tsconfig.json'
              - '**/tsconfig.*.json'
              - '!**/*.md'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - '.rustfmt.toml'
              - 'rust-toolchain*'
              - 'schemas/**'
              - 'modules/**'
              - 'crates/**'
              - 'apps/nexus42/**'
              - '.sqlx/**'
              - 'strategy-samples/**'
              - 'tooling/check-*.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '!**/*.md'
            codegen:
              - 'schemas/**'
              - 'tooling/codegen/**'
              - 'packages/nexus-contracts/src/generated/**'
              - 'crates/nexus-contracts/src/generated/**'
              - 'tooling/check-codegen-callsite-coverage.sh'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            module-dx:
              - 'modules/**'
              - 'schemas/daemon-api/compute/**'
              - 'crates/nexus-wasm-host/**'
              - 'tooling/check-module-sdk-drift.sh'
              - '.github/workflows/ci.yml'
              - '!**/*.md'

  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Validate schemas
        run: pnpm run validate-schemas

  verify-codegen:
    name: Verify Codegen Output
    runs-on: ubuntu-latest
    needs: [changes, validate-schemas]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.codegen == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Free disk before the Rust toolchain + cargo cache: this job now
      # compiles the full workspace, so it needs the same ENOSPC headroom
      # policy as rust-checks / rust-tests (CARGO_INCREMENTAL: "0" above).
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-monorepo
        with:
          # V1.182 P0 (R-V1163P2QC1-002): rust is required so this job can
          # compile typify consumers immediately after regen.
          rust-toolchain: stable
          # nexus-wasm-host's build.rs compiles embedded modules from source
          # (same reason as rust-checks).
          rust-targets: wasm32-unknown-unknown
      - name: Run codegen
        run: pnpm run codegen
      - name: Run codegen tests
        run: pnpm --filter nexus-codegen test
      - name: Check generated code is up-to-date
        run: |
          # After running codegen, check if generated files match committed versions
          if ! git diff --exit-code packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/; then
            echo "❌ Generated code is outdated or not committed!"
            echo "Please run 'pnpm run codegen' locally and commit the changes."
            echo ""
            echo "Changed files:"
            git diff --name-only packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/
            exit 1
          fi
          echo "✅ Generated code is up-to-date"
      - name: Verify TypeScript generated
        run: test -d packages/nexus-contracts/src/generated && test -f packages/nexus-contracts/src/generated/index.ts
      - name: Verify Rust generated
        run: test -d crates/nexus-contracts/src/generated && test -f crates/nexus-contracts/src/generated/mod.rs
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          # Distinct suffix avoids concurrent cache writers racing with the
          # sqlx, connect-host, and test jobs.
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-codegen-callsite
          workspaces: .
          # ENOSPC headroom policy (same as rust-checks): never cache every
          # crate, never persist a partial cache from a failed run.
          cache-all-crates: false
          cache-on-failure: false
      - name: Codegen callsite coverage
        run: bash tooling/check-codegen-callsite-coverage.sh

  rust-checks:
    name: Rust fmt & clippy
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      # Disable incremental to cap target/debug/incremental growth on ephemeral
      # runners (see rust-tests / ENOSPC mitigation in plan 2026-07-15).
      CARGO_INCREMENTAL: "0"
      # Pin the fmt nightly so CI matches local rustfmt exactly. rustfmt
      # formatting rules drift across nightly versions, so an unpinned
      # `nightly` makes CI's `fmt --check` fail on code formatted by a
      # different local nightly. Bump this (and AGENTS.md) when updating.
      FMT_NIGHTLY: "nightly-2026-06-26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy
          # nexus-wasm-host's build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly rustfmt (for workspace .rustfmt.toml `ignore` on codegen output)
        run: rustup toolchain install "${FMT_NIGHTLY}" --component rustfmt --no-self-update
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Check formatting
        run: cargo +"${FMT_NIGHTLY}" fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

  verify-sqlx-offline:
    name: Verify sqlx offline metadata
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-sqlx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Verify sqlx offline metadata is up-to-date
        run: |
          # SQLX_OFFLINE=true makes cargo check use committed .sqlx/ metadata
          # If any query macro's metadata is missing or stale, this will fail
          cargo check --all --all-targets

  # V1.177 P0 (AR-99, PL-1): connect-host lint gate. Runs after Task-1 cleanup
  # (plan 2026-08-27-v1.177-p0-connect-host-clippy-gate) so connect-host clippy
  # debt cannot silently regrow: the default-graph clippy never sees this
  # opt-in graph. Separate leg instead of a rust-checks step: a second,
  # differently-feature-unified dep graph (spoke-connect/libp2p/sqlx variants)
  # in the shared target/ would double that job's peak disk against the
  # ENOSPC headroom policy above; the distinct shared-key suffix mirrors the
  # -sqlx / -module-dx precedents (same-key concurrent writers would race).
  rust-clippy-connect-host:
    name: Rust clippy connect-host
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
          # nexus-wasm-host is a nexus42 dev-dependency (--all-targets pulls
          # it in); its build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-connect-host
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run clippy (connect-host)
        run: cargo clippy -p nexus42 --features connect-host --all-targets -- -D warnings
  # v1.180 P0 (RN-OGA-1): provider stream conformance gate. Runs the neutral
  # runner + scripted fixtures against the REAL native adapters (claude-codes /
  # codex-codes / dsh-native) — a PR that drifts normalized stream lifecycle
  # fails here without credentials. Separate leg from rust-tests: the fixture
  # tests spawn python3 speakers (ubuntu-latest ships python3) and the crate
  # is a CI/test-only gate, not part of the product test matrix.
  provider-conformance:
    name: Provider stream conformance
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-provider-conformance
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run provider conformance tests
        run: cargo test -p nexus-provider-conformance

  typescript-checks:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build
      - name: Typecheck
        run: pnpm run typecheck
      # oxlint's type-aware pass (options.typeAware) resolves the linted apps'
      # workspace imports through each package's `types` field
      # (dist/index.d.ts). Without those declarations @42ch/nexus-service
      # imports resolve to error types and
      # apps/desktop-electron/src/utility-host.ts:41 collapses its union into
      # `typescript/no-redundant-type-constituents`. Build the dependency
      # chain in order — native and provider-acp are nexus-service's
      # prerequisites (`tsc` fails on TS2307 without either) — so the linted
      # program sees real declarations. Root-cause repair: no rule and no file
      # is disabled for it.
      - name: Build workspace type dependencies
        run: |
          pnpm --filter @42ch/nexus-native run build
          pnpm --filter @42ch/nexus-provider-acp run build
          pnpm --filter @42ch/nexus-service run build
      - name: Lint
        run: pnpm run lint

  web-build:
    name: Web app build & typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build
      - name: Typecheck web
        run: pnpm --filter web typecheck
      - name: Build web
        run: pnpm --filter web build
      - name: Test web
        run: pnpm --filter web test

  nexus-ui:
    name: Build & typecheck @42ch/nexus-ui
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run build
      - name: Typecheck nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run typecheck

  verify-graph-pins:
    name: Verify product dependency graph pins
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Truthful product graph matrix. The previous bespoke step grepped the
      # (since deleted) nexus-daemon-runtime manifest for `nexus-acp-host` /
      # `agent-client-protocol` and failed if either appeared; `nexus-acp-host`
      # has been an unconditional normal dependency of the CLI since V1.94
      # (7c61c033), so that assertion described a linkage the daemon never had
      # and failed the job on every run. v1.193 P2 deleted that composition
      # entirely; this job now runs the machine-checked matrix over the
      # products that exist (ordinary `cli` CLI, Connect-only runtime,
      # optional CLI Connect, core domain, core MCP/peer library, native host).
      # `cargo tree` requires a Rust toolchain.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Check graph pins
        run: bash tooling/check-graph-pins.sh

  schema-consistency-check:
    name: Schema Consistency Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # check-wire-drift.sh runs `cargo test -p nexus-contracts --test schema_drift_detection`
      # plus node-based spoke pin checks; setup-monorepo provides Rust + Node (no deps needed).
      - uses: ./.github/actions/setup-monorepo
        with:
          install-deps: "false"
      - name: Run schema consistency checks
        run: bash tooling/check-schema-drift.sh
      - name: Check wire schema drift
        run: bash tooling/check-wire-drift.sh
      # V1.174 P0 T6 (AR-74), retargeted for the v1.193 P2 product cohorts:
      # dependency graph pins — structure only (absence, single resolved
      # version, resolved feature set), never a version value: the ordinary
      # `cli` graph stays free of spoke-connect/libp2p/rmcp and the removed
      # Model A selectors are gone; the Connect graphs resolve a single
      # spoke-operations / libp2p / spoke-connect each; rmcp survives only in
      # the core connect-client/embedded-mcp library cohorts; the shipped CLI
      # graphs resolve a single agent-client-protocol and one featureless
      # graph-flow. `cargo tree` needs a Rust toolchain; setup-monorepo above
      # provides it.
      - name: Check graph pins
        run: bash tooling/check-graph-pins.sh

  # Compute module DX — SDK + modules (V1.170 P0, AR-12). Runs only when
  # module-affecting paths change (or on manual workflow_dispatch). The leg is
  # fully offline: crates.io deps come via the registry cache; the wasm build
  # and all tests run against committed sources. GitHub Actions has no native
  # job-level `paths` filter, so path gating uses dorny/paths-filter
  # (SHA-pinned per repo convention); every module step ORs its own gate with
  # `workflow_dispatch` so a manual run always executes.
  module-dx:
    name: Compute module DX — SDK + modules
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['module-dx'] == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-module-dx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            module-dx:
              - 'modules/**'
              - 'schemas/daemon-api/compute/**'
              - 'crates/nexus-wasm-host/**'
              - 'tooling/check-module-sdk-drift.sh'
      - name: Test nexus-module-sdk (golden-fixture round-trip)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-sdk/Cargo.toml
      - name: Test nexus-module-test (mini-host + fixture conformance)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-test/Cargo.toml
      - name: Check module SDK drift (mirror-gap + fixture-parity)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: bash tooling/check-module-sdk-drift.sh
      - name: Build basic-combat for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/basic-combat/Cargo.toml
      - name: Validate basic-combat manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/basic-combat
          # The mini-host conformance test parses the source manifest as
          # `ModuleManifest` (the extracted validator's contract) and runs the
          # full 4-part ABI round-trip against the freshly built artifact —
          # the `nexus42 compute validate` equivalent without a full CLI build.
          # qc3 F-003: the env-gated conformance test skips (fail-open) when
          # the env pair is unset — that path is for LOCAL DEV only. CI must
          # run it for real: assert the artifact pair exists so a future step
          # refactor cannot silently turn the gate into a visible SKIP.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/basic_combat.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — real-artifact conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — real-artifact conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_basic_combat_artifact_conformance
      - name: Build _template for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/_template/Cargo.toml
      - name: Validate _template manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/_template
          # qc3 F-002: the template scaffold (the author-copying starting
          # point) must be CI-compiled and its manifest validated through the
          # extracted validator (mini-host conformance) — a scaffold break
          # must fail the PR, not ship silently. Same fail-open SKIP contract
          # as the basic-combat conformance (qc3 F-003): assert the artifact
          # pair exists here so CI always runs the real gate.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/template_dice.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — template conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — template conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_template_artifact_conformance
      - name: Real-host byte-compat gate (basic_combat fixtures)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test -p nexus-wasm-host --test basic_combat

  ui-guardrails:
    name: UI guardrails — wrapper drift & Studio boundaries
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check promoted-wrapper forbidden imports & Studio boundaries
        run: bash tooling/check-ui-guardrails.sh

  # Heavy Rust jobs: free-disk before toolchain/cache restore, CARGO_INCREMENTAL=0,
  # scoped rust-cache (workspace crates only), and split orchestration legs so
  # peak target/ fits ubuntu-latest (~14 GiB free after preinstalled software).
  rust-tests:
    name: Rust tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: >-
              -p nexus-contracts
              -p nexus-home-layout
              -p nexus-local-db
              -p nexus-cloud-domain
          - group: orchestration-core
            packages: >-
              -p nexus-orchestration
              -p nexus-creator
              -p nexus-creator-memory
              -p nexus-cloud-sync
          - group: orchestration-knowledge
            packages: >-
              -p nexus-knowledge
              -p nexus-knowledge
              -p nexus-narrative
              -p nexus-moment-context-assembly
              -p nexus-wasm-host
          - group: cli-hosts
            packages: >-
              -p nexus42
              -p nexus-acp-host
              -p nexus-agent-host
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-${{ matrix.group }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Setup monorepo for provider-acp tests
        if: matrix.group == 'cli-hosts'
        uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build nexus-provider-acp test peer
        if: matrix.group == 'cli-hosts'
        # The peer imports `@42ch/nexus-contracts` from its built `dist`, so the
        # contracts package is built first (same order as the web job).
        run: |
          pnpm --filter @42ch/nexus-contracts run build
          pnpm --filter @42ch/nexus-provider-acp build
      - name: Run tests
        run: cargo test ${{ matrix.packages }}

  # R-V1193-P1T7-CI-CONNECT-HOST-TESTS (v1.193 P2-T14). The retirement left
  # exactly two shipped app cohorts: the ordinary `cli` default (covered by
  # the `cli-hosts` rust-tests group above) and the independent
  # `connect-host` selector, which never implies `cli`. This leg exercises the
  # Connect half in its supported verification shape: the Connect-only
  # runtime bin check (no default features) plus the named headless-runtime
  # smoke test in the cli+connect-host cohort. It is deliberately NOT a
  # `--no-default-features --features connect-host --all-targets` row: six
  # cli-cohort integration test targets import cli-gated modules, so that
  # combination does not build (P2-T13 C1). Separate leg rather than a
  # rust-tests matrix row because the command shape differs (bin check +
  # named test) and a second, differently-feature-unified dep graph must not
  # share the matrix group's cache key.
  rust-connect-host:
    name: Rust connect-host runtime
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # nexus-wasm-host's build.rs compiles the embedded modules from
          # source; the Connect cohort keeps the explicit spoke compute edge
          # (and its shared module cache) by design.
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          # Distinct suffix: this cohort's feature unification differs from
          # rust-tests' groups and rust-clippy-connect-host (same-key
          # concurrent writers would race — same precedent as -sqlx/-module-dx).
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-connect-host-runtime
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Check the Connect-only runtime bin
        run: cargo check -p nexus42 --no-default-features --features connect-host --bin nexus-runtime
      - name: Build the runtime smoke probe example
        # The smoke test spawns target/debug/examples/runtime_smoke_probe; the
        # test target alone does not build example targets.
        run: cargo build -p nexus42 --features connect-host --example runtime_smoke_probe
      - name: Run the headless runtime smoke test
        run: cargo test -p nexus42 --features connect-host --test nexus_runtime_smoke headless_runtime_prints_readiness_serves_connect_and_has_no_http_listener -- --exact
      - name: Run Connect library tests
        run: >-
          cargo test -p nexus42 --no-default-features --features connect-host --lib commands::connect::
      - name: Run Connect token CLI tests
        run: cargo test -p nexus42 --features connect-host --test connect_token_issue
      - name: Run Connect command surface contract
        run: cargo test -p nexus42 --features connect-host --test command_surface_contract v1193_connect_help_describes_served_compute_surface -- --exact


  # QC3 W-001 / QC2 F-001 (v1.193 P2-T14). Retiring the Rust daemon crate moved
  # its domain coverage into `crates/nexus-core/tests/` (the `retained_*` owners
  # plus the extended core owners). The deleted `daemon` rust-tests group was the
  # only CI row executing that graph, and `nexus-core` was never in the matrix,
  # so those migrated assertions were enforced only by local runs. This leg runs
  # them with the feature set each target needs — the crate-level `#![cfg]` gates
  # mean a wrong feature set silently selects ZERO tests, which is not proof:
  #   * no optional features: the migrated domain owners (world/KB/pack,
  #     work/home/preset, reading/context/content/timeline, memory)
  #   * execution,compute,provider-host (Host/execution owners):
  #     retained_execution_contracts, execution_lifecycle, handle_ops,
  #     workspace_commit, capability_compute, host_actor_lifecycle
  #   * connect-client,embedded-mcp (core MCP/peer library owners):
  #     retained_peer_contracts, peer_control
  # Deliberately no `--all-targets` and no connect-host/other-cohort row
  # (P2-T13 C1). The non-actor owners stay at `--test-threads=2`; the
  # actor_services cohort runs separately at `--test-threads=4` on T5's
  # deterministic boundary and repeated concurrent-run evidence.

  rust-core-domain:
    name: Rust core domain coverage
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # nexus-wasm-host's build.rs compiles the embedded modules from
          # source; the `compute` feature edge puts it in this graph.
          targets: wasm32-unknown-unknown
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          # Distinct suffix: three feature-unified graphs in one job, none of
          # which matches another leg's key (same-key concurrent writers race —
          # same precedent as -sqlx/-module-dx).
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-core-domain
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Core domain owners (no optional features)
        run: >-
          cargo test -p nexus-core
          --test world_services --test world_kb_contract --test world_pack_services
          --test work_services --test home_services --test preset_services
          --test reading_knowledge_services --test context_services
          --test content_services --test timeline_services --test memory_services
          -- --test-threads=2
      - name: Execution, Host and compute owners
        run: >-
          cargo test -p nexus-core --features provider-host,compute
          --test retained_execution_contracts --test execution_lifecycle
          --test handle_ops --test workspace_commit --test capability_compute
          --test host_actor_lifecycle
          -- --test-threads=2
      - name: Actor view owners
        run: >-
          cargo test -p nexus-core --features provider-host,compute
          --test actor_services
          -- --test-threads=4
      - name: Core MCP/peer library owners
        run: >-
          cargo test -p nexus-core --features connect-client,embedded-mcp
          --test retained_peer_contracts --test peer_control
