name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Validate schemas
        run: pnpm run validate-schemas

  verify-codegen:
    name: Verify Codegen Output
    runs-on: ubuntu-latest
    needs: validate-schemas
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Run codegen
        run: pnpm run codegen
      - name: Run codegen tests
        run: pnpm --filter nexus-codegen test
      - name: Check generated code is up-to-date
        run: |
          # After running codegen, check if generated files match committed versions
          if ! git diff --exit-code packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/; then
            echo "❌ Generated code is outdated or not committed!"
            echo "Please run 'pnpm run codegen' locally and commit the changes."
            echo ""
            echo "Changed files:"
            git diff --name-only packages/nexus-contracts/src/generated/ crates/nexus-contracts/src/generated/
            exit 1
          fi
          echo "✅ Generated code is up-to-date"
      - name: Verify TypeScript generated
        run: test -d packages/nexus-contracts/src/generated && test -f packages/nexus-contracts/src/generated/index.ts
      - name: Verify Rust generated
        run: test -d crates/nexus-contracts/src/generated && test -f crates/nexus-contracts/src/generated/mod.rs
      - name: Archive generated types
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: generated-types
          path: |
            packages/nexus-contracts/src/generated/
            crates/nexus-contracts/src/generated/

  rust-checks:
    name: Rust fmt & clippy
    runs-on: ubuntu-latest
    needs: verify-codegen
    env:
      SQLX_OFFLINE: "true"
      # Disable incremental to cap target/debug/incremental growth on ephemeral
      # runners (see rust-tests / ENOSPC mitigation in plan 2026-07-15).
      CARGO_INCREMENTAL: "0"
      # Pin the fmt nightly so CI matches local rustfmt exactly. rustfmt
      # formatting rules drift across nightly versions, so an unpinned
      # `nightly` makes CI's `fmt --check` fail on code formatted by a
      # different local nightly. Bump this (and AGENTS.md) when updating.
      FMT_NIGHTLY: "nightly-2026-06-26"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy
          # nexus-wasm-host's build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - name: Install pinned nightly rustfmt (for workspace .rustfmt.toml `ignore` on codegen output)
        run: rustup toolchain install "${FMT_NIGHTLY}" --component rustfmt --no-self-update
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Check formatting
        run: cargo +"${FMT_NIGHTLY}" fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

  verify-sqlx-offline:
    name: Verify sqlx offline metadata
    runs-on: ubuntu-latest
    needs: verify-codegen
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-sqlx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Verify sqlx offline metadata is up-to-date
        run: |
          # SQLX_OFFLINE=true makes cargo check use committed .sqlx/ metadata
          # If any query macro's metadata is missing or stale, this will fail
          cargo check --all --all-targets

  # V1.177 P0 (AR-99, PL-1): connect-host lint gate. Runs after Task-1 cleanup
  # (plan 2026-08-27-v1.177-p0-connect-host-clippy-gate) so connect-host clippy
  # debt cannot silently regrow: the default-graph clippy never sees this
  # opt-in graph. Separate leg instead of a rust-checks step: a second,
  # differently-feature-unified dep graph (spoke-connect/libp2p/sqlx variants)
  # in the shared target/ would double that job's peak disk against the
  # ENOSPC headroom policy above; the distinct shared-key suffix mirrors the
  # -sqlx / -module-dx precedents (same-key concurrent writers would race).
  rust-clippy-connect-host:
    name: Rust clippy connect-host
    runs-on: ubuntu-latest
    needs: verify-codegen
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
          # nexus-wasm-host is a nexus42 dev-dependency (--all-targets pulls
          # it in); its build.rs compiles embedded modules from source
          # (see crates/nexus-wasm-host/build.rs).
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-connect-host
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
  # v1.180 P0 (RN-OGA-1): provider stream conformance gate. Runs the neutral
  # runner + scripted fixtures against the REAL native adapters (claude-codes /
  # codex-codes / dsh-native) — a PR that drifts normalized stream lifecycle
  # fails here without credentials. Separate leg from rust-tests: the fixture
  # tests spawn python3 speakers (ubuntu-latest ships python3) and the crate
  # is a CI/test-only gate, not part of the product test matrix.
  provider-conformance:
    name: Provider stream conformance
    runs-on: ubuntu-latest
    needs: verify-codegen
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-provider-conformance
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run provider conformance tests
        run: cargo test -p nexus-provider-conformance

  typescript-checks:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: verify-codegen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint

  web-build:
    name: Web app build & typecheck
    runs-on: ubuntu-latest
    needs: verify-codegen
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png, apps/desktop/src-tauri/icons/source/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Build contracts package
        run: pnpm --filter @42ch/nexus-contracts run build
      - name: Typecheck web
        run: pnpm --filter web typecheck
      - name: Build web
        run: pnpm --filter web build
      - name: Test web
        run: pnpm --filter web test

  nexus-ui:
    name: Build & typecheck @42ch/nexus-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Git LFS — brand PNG provenance (packages/nexus-ui/assets/logos/*.png, apps/desktop/src-tauri/icons/source/*.png)
          lfs: true
      - uses: ./.github/actions/setup-monorepo
        with:
          rust-toolchain: ""
      - name: Build nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run build
      - name: Typecheck nexus-ui package
        run: pnpm --filter @42ch/nexus-ui run typecheck

  verify-no-acp-in-daemon:
    name: Verify nexus-daemon-runtime linkage matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Assert nexus-daemon-runtime does not link ACP host / SDK
        run: |
          set -e
          if rg -n '^\s*(nexus-acp-host|agent-client-protocol)\s*=' crates/nexus-daemon-runtime/Cargo.toml; then
            echo "::error::nexus-daemon-runtime/Cargo.toml must not depend on nexus-acp-host or agent-client-protocol — see .mstar/archived/knowledge/acp-client-tech-spec.md §11.3"
            exit 1
          fi
          echo "Linkage gate OK"

  schema-consistency-check:
    name: Schema Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # check-wire-drift.sh runs `cargo test -p nexus-contracts --test schema_drift_detection`
      # plus node-based spoke pin checks; setup-monorepo provides Rust + Node (no deps needed).
      - uses: ./.github/actions/setup-monorepo
        with:
          install-deps: "false"
      - name: Run schema consistency checks
        run: bash tooling/check-schema-drift.sh
      - name: Check wire schema drift
        run: bash tooling/check-wire-drift.sh
      # V1.174 P0 T6 (AR-74): dependency graph pins — default graph stays
      # free of spoke-connect/libp2p; feature-on graphs resolve exactly one
      # 0.11.1 spoke-operations / 0.56.x libp2p / 1.8.0 rmcp. `cargo tree`
      # needs a Rust toolchain; setup-monorepo above provides it.
      - name: Check graph pins
        run: bash tooling/check-graph-pins.sh

  # Compute module DX — SDK + modules (V1.170 P0, AR-12). Runs only when
  # module-affecting paths change (or on manual workflow_dispatch). The leg is
  # fully offline: crates.io deps come via the registry cache; the wasm build
  # and all tests run against committed sources. GitHub Actions has no native
  # job-level `paths` filter, so path gating uses dorny/paths-filter
  # (SHA-pinned per repo convention); every module step ORs its own gate with
  # `workflow_dispatch` so a manual run always executes.
  module-dx:
    name: Compute module DX — SDK + modules
    runs-on: ubuntu-latest
    needs: verify-codegen
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-module-dx
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            module-dx:
              - 'modules/**'
              - 'schemas/daemon-api/compute/**'
              - 'crates/nexus-wasm-host/**'
              - 'tooling/check-module-sdk-drift.sh'
      - name: Test nexus-module-sdk (golden-fixture round-trip)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-sdk/Cargo.toml
      - name: Test nexus-module-test (mini-host + fixture conformance)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test --manifest-path modules/nexus-module-test/Cargo.toml
      - name: Check module SDK drift (mirror-gap + fixture-parity)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: bash tooling/check-module-sdk-drift.sh
      - name: Build basic-combat for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/basic-combat/Cargo.toml
      - name: Validate basic-combat manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/basic-combat
          # The mini-host conformance test parses the source manifest as
          # `ModuleManifest` (the extracted validator's contract) and runs the
          # full 4-part ABI round-trip against the freshly built artifact —
          # the `nexus42 compute validate` equivalent without a full CLI build.
          # qc3 F-003: the env-gated conformance test skips (fail-open) when
          # the env pair is unset — that path is for LOCAL DEV only. CI must
          # run it for real: assert the artifact pair exists so a future step
          # refactor cannot silently turn the gate into a visible SKIP.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/basic_combat.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — real-artifact conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — real-artifact conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_basic_combat_artifact_conformance
      - name: Build _template for wasm32
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path modules/_template/Cargo.toml
      - name: Validate _template manifest + mini-host round-trip (extracted validator)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: |
          cd modules/_template
          # qc3 F-002: the template scaffold (the author-copying starting
          # point) must be CI-compiled and its manifest validated through the
          # extracted validator (mini-host conformance) — a scaffold break
          # must fail the PR, not ship silently. Same fail-open SKIP contract
          # as the basic-combat conformance (qc3 F-003): assert the artifact
          # pair exists here so CI always runs the real gate.
          WASM="${PWD}/target/wasm32-unknown-unknown/release/template_dice.wasm"
          MANIFEST="${PWD}/manifest.json"
          test -f "${WASM}" || { echo "FAIL: ${WASM} missing — template conformance cannot run"; exit 1; }
          test -f "${MANIFEST}" || { echo "FAIL: ${MANIFEST} missing — template conformance cannot run"; exit 1; }
          NEXUS_MODULE_TEST_WASM="${WASM}" NEXUS_MODULE_TEST_MANIFEST="${MANIFEST}" \
          cargo test --manifest-path ../nexus-module-test/Cargo.toml \
            --test fixture_conformance real_template_artifact_conformance
      - name: Real-host byte-compat gate (basic_combat fixtures)
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs['module-dx'] == 'true'
        run: cargo test -p nexus-wasm-host --test basic_combat

  ui-guardrails:
    name: UI guardrails — wrapper drift & Studio boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Check promoted-wrapper forbidden imports & Studio boundaries
        run: bash tooling/check-ui-guardrails.sh

  # Heavy Rust jobs: free-disk before toolchain/cache restore, CARGO_INCREMENTAL=0,
  # scoped rust-cache (workspace crates only), and split orchestration legs so
  # peak target/ fits ubuntu-latest (~14 GiB free after preinstalled software).
  rust-tests:
    name: Rust tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: verify-codegen
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: >-
              -p nexus-contracts
              -p nexus-home-layout
              -p nexus-local-db
              -p nexus-cloud-domain
          - group: orchestration-core
            packages: >-
              -p nexus-orchestration
              -p nexus-creator
              -p nexus-creator-memory
              -p nexus-cloud-sync
          - group: orchestration-knowledge
            packages: >-
              -p nexus-knowledge
              -p nexus-knowledge
              -p nexus-narrative
              -p nexus-moment-context-assembly
              -p nexus-wasm-host
          - group: daemon
            packages: >-
              -p nexus-daemon-runtime
          - group: cli-hosts
            packages: >-
              -p nexus42
              -p nexus-acp-host
              -p nexus-agent-host
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: generated-types
          path: .
      - name: Read workspace version for cargo cache key
        id: workspace-version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: nexus-rust-${{ steps.workspace-version.outputs.version }}-${{ matrix.group }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Run tests
        run: cargo test ${{ matrix.packages }}
