          workspaces: .
          cache-all-crates: false
          cache-on-failure: false
      - name: Execution and lifecycle owners
        # `approve_route` is `#![cfg(feature = "execution")]`: a cargo run that does not enable
        # the feature selects ZERO tests from it, so the target must be named here (A1).
        run: >-
          cargo test -p nexus-core --features provider-host,compute
          --test retained_execution_contracts --test execution_lifecycle
          --test handle_ops --test approve_route
