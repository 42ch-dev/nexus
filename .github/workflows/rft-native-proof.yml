name: RFT Native Package Proof

# V1.189 P3-T1 (RFT-03): four-platform native package/install/inspection proof.
#
# Architecture-contracts §9 pins are asserted per row and recorded per run:
#   Node   22.22.0 (service floor) and 24.20.0 (test cohort)
#   Rust   1.98.1
#   macOS  Xcode 16.4, MACOSX_DEPLOYMENT_TARGET=11.0 (native addon ABI floor)
#   Win    VS 2022 17.14 / MSVC v143 / Windows SDK 10.0.26100
#   Linux  glibc 2.28 sysroot + GCC >= 10.1 (manylinux_2_28 image)
#
# Honesty rules encoded here:
#   - every row executes its own binaries natively; there is no emulation,
#     cross-loading, install-only or unsigned-substitute pass;
#   - a missing runner, missing image or mismatched toolchain fails the row
#     with the measured value recorded in the evidence — never a green pass;
#   - `native-package-matrix.json` reports one of four row states and the job
#     fails on the two that mean the proof did not run: `missing` (no evidence)
#     and `failed` (the job failed), plus `pass` and `cancelled`.
#     Evidence comes first: a row that uploaded a complete, valid proof is
#     `pass`, whatever the job's later state. A runner-cancelled row job
#     (run 44798291720: darwin-arm64, zero recorded steps) is not a code defect,
#     and it stays non-blocking `cancelled` **only when the automatic retry was
#     actually dispatched** to re-prove it. Without that dispatch — a fork PR
#     (its branch is not in this repository), an invalid ref, a refused or
#     missing dispatch record — the row's evidence is absent, so it is
#     `missing` with the reason in its note and it blocks (I-000561).
#     The retry runs only the cancelled rows and produces its own verdict; no
#     evidence is merged across runs, so a verdict never mixes two commits.
#     Two shas keep that honest: `origin_sha` is the commit the cancelled rows
#     ran at (`github.sha`, i.e. the synthetic merge commit on a pull request)
#     and `dispatch_sha` is the commit the retry targets (the PR head sha there,
#     else `github.sha`). A moving `--ref` cannot dispatch a commit, so the retry
#     run records both, re-proves `dispatch_sha`, and warns when the sha it
#     actually ran differs from `dispatch_sha`; and a run whose per-row job
#     conclusions cannot be read fails the verdict rather than inferring a row
#     state from the matrix aggregate.
on:
  workflow_dispatch:
    inputs:
      # Internal: the retry dispatch below fills these. Empty = the full lane.
      rows:
        description: 'Comma-separated row slugs to run (default: the whole lane)'
        required: false
        default: ''
      retry_of:
        description: 'Run id this dispatch is the one automatic retry of'
        required: false
        default: ''
      # `origin_sha` is where the cancelled rows ran (`github.sha`: the synthetic
      # merge commit on a pull request). `dispatch_sha` is what the retry
      # targets and re-proves (the PR head sha there, else `github.sha`).
      origin_sha:
        description: 'Commit the cancelled rows ran at (origin run github.sha; the PR merge commit on a pull request)'
        required: false
        default: ''
      dispatch_sha:
        description: 'Commit the retry targets (PR head sha, else github.sha); compared with the sha the retry run actually ran'
        required: false
        default: ''
  schedule:
    # Nightly full four-platform proof on main: the PR lane runs only the
    # fastest row, so this is the drift check that covers the other rows.
    - cron: '30 2 * * *'
  push:
    branches: [main, iteration/v1.189]
    paths: &proof-paths
      - 'packages/nexus-native/**'
      - 'packages/nexus-native-*/**'
      - 'crates/nexus-core-node/**'
      - 'crates/nexus-agent-host/tests/fixtures/mock_acp_workflow.py'
      - '.github/workflows/rft-native-proof.yml'
  pull_request:
    branches: [main, iteration/v1.189]
    paths: *proof-paths

concurrency:
  # A retry run is dispatched onto the same ref, so it must not share the
  # origin run's group: cancel-in-progress would cancel the very run that is
  # dispatching it.
  group: rft-native-proof-${{ github.ref }}${{ inputs.retry_of != '' && format('-retry-{0}', inputs.retry_of) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # Cargo needs the committed sqlx metadata (same convention as ci.yml).
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.98.1"
  PNPM_VERSION: "11.25.0"
  NODE_FLOOR: "22.22.0"
  NODE_COHORT: "24.20.0"
  EVIDENCE: .mstar/iterations/v1.189/guides/evidence
  # --- immutable build inputs (architecture-contracts §9) -------------------
  # Every row used to consume at least one mutable input: a moving container
  # tag on the Linux row and an at-execution-time installer download. Both are
  # now addressed by immutable identity and the identifiers are written into
  # the evidence (`proof-build-inputs-*.json`).
  # Hosted rows: the toolchain installer is the SHA-pinned action below; the
  # runner label is the pinned image identity for that OS.
  RUST_INSTALLER_ACTION: "dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8"
  # Linux row: manylinux_2_28_x86_64:latest resolved 2026-09-13 (linux/amd64).
  # The digest is the schema-2 manifest digest and equals the SHA-256 of the
  # manifest body; the runner pulls by digest, so the tag can never be repointed.
  MANYLINUX_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
  MANYLINUX_TAG: "latest"
  MANYLINUX_RESOLVED_AT: "2026-09-13"
  MANYLINUX_IMAGE_DIGEST: "sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c"
  # rustup-init from the version-addressed archive (not the sh.rustup.rs
  # redirector, whose content changes per release). The downloaded binary is
  # verified against this digest before execution; the same value is published
  # in the artifact's own `.sha256` sidecar at that immutable URL.
  RUSTUP_INIT_VERSION: "1.28.2"
  RUSTUP_INIT_TARGET: "x86_64-unknown-linux-gnu"
  RUSTUP_INIT_SHA256: "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c"

jobs:
  rft-matrix:
    # GitHub job-level `if` cannot read the matrix context, so the lane is
    # expressed as a dynamic matrix instead of per-row skips. This step is the
    # single source of truth for which rows a run must produce: the summary
    # evaluates exactly that list, and the retry dispatch narrows it to the rows
    # a runner cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
      rows: ${{ steps.rows.outputs.rows }}
      host_rows: ${{ steps.rows.outputs.host_rows }}
    steps:
      - id: rows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROWS_INPUT: ${{ inputs.rows }}
        run: |
          set -euo pipefail
          all='[
            {"slug":"win32-x64-msvc","os":"windows-2022","short":"win","target":"x86_64-pc-windows-msvc","matrix":true},
            {"slug":"darwin-arm64","os":"macos-15","short":"macarm","target":"aarch64-apple-darwin","matrix":true},
            {"slug":"darwin-x64","os":"macos-15-intel","short":"macx64","target":"x86_64-apple-darwin","matrix":true},
            {"slug":"linux-x64-gnu","os":"ubuntu-24.04","short":"linux","target":"x86_64-unknown-linux-gnu","matrix":false}
          ]'
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # PR lane: only the fastest row. The packaging/ABI hazards this
            # workflow guards are per-row identical for generic cross-platform
            # code; the full matrix covers the other rows on main/nightly.
            keep='["darwin-arm64"]'
          elif [ -n "${ROWS_INPUT}" ]; then
            keep="$(printf '%s' "${ROWS_INPUT}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')"
          else
            keep="$(jq -c 'map(.slug)' <<< "${all}")"
          fi
          unknown="$(jq -nc --argjson keep "${keep}" --argjson all "${all}" '$keep - ($all | map(.slug))')"
          if [ "${unknown}" != "[]" ]; then
            echo "::error::unknown row slug(s) ${unknown}; known rows: $(jq -rc 'map(.slug)' <<< "${all}")"
            exit 1
          fi
          selected="$(jq -c --argjson keep "${keep}" \
            'map(select(.slug as $s | $keep | index($s))) | if length == 0 then error("no rows selected") else . end' \
            <<< "${all}")"
          {
            echo "matrix={\"include\":$(jq -c 'map(select(.matrix) | del(.matrix))' <<< "${selected}")}"
            echo "rows=$(jq -c 'map({suffix: .slug, short})' <<< "${selected}")"
            # An empty matrix include is invalid, so the matrix job is skipped
            # when the run only covers the container row (a retry of the linux row).
            echo "host_rows=$(jq -r 'any(.matrix)' <<< "${selected}")"
          } >> "$GITHUB_OUTPUT"
          echo "rows: $(jq -c 'map(.slug)' <<< "${selected}")"

  native-package-proof:
    needs: rft-matrix
    if: needs.rft-matrix.outputs.host_rows == 'true'
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rft-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none

      - name: Record immutable build inputs
        shell: bash
        env:
          ROW_SLUG: ${{ matrix.slug }}
          RUNNER_LABEL: ${{ matrix.os }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          cat > "${EVIDENCE}/proof-build-inputs-${ROW_SLUG}.json" <<JSON
          {
            "schema": "rft-p3-t1-build-inputs/v1",
            "row": "${ROW_SLUG}",
            "source_sha": "${GITHUB_SHA}",
            "runner_label": "${RUNNER_LABEL}",
            "rust": {
              "toolchain": "${RUST_TOOLCHAIN}",
              "target": "${RUST_TARGET}",
              "installer_action": "${RUST_INSTALLER_ACTION}"
            },
            "node": { "floor": "${NODE_FLOOR}", "cohort": "${NODE_COHORT}" },
            "pnpm": "${PNPM_VERSION}",
            "container": null,
            "note": "hosted row: the pinned toolchain installer action plus the pinned runner label are the immutable inputs; measured toolchain versions are recorded by inspect-binary.mjs"
          }
          JSON
          cat "${EVIDENCE}/proof-build-inputs-${ROW_SLUG}.json"

      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_FLOOR }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          # wasm32-unknown-unknown: nexus-core-node's graph pulls
          # nexus-wasm-host, whose build.rs compiles the embedded modules.
          rust-targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-rft-native-${{ matrix.slug }}
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false

      - name: Assert macOS toolchain contract (Xcode 16.4, deployment target 11.0)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "${xcode_version}"
          if [[ "${xcode_version}" != *"Xcode 16.4"* ]]; then
            echo "::error::expected Xcode 16.4 (architecture-contracts §9); runner image provides the version above"
            exit 1
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0 (native addon ABI floor)"

      - name: Assert Windows toolchain contract (VS 2022 17.14, SDK 10.0.26100)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found at $vswhere"; exit 1 }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Output "Visual Studio $vs"
          if (-not $vs.StartsWith('17.14')) {
            Write-Error "expected VS 2022 17.14 (architecture-contracts §9); runner image provides $vs"
            exit 1
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdks = @(Get-ChildItem $sdkRoot -Directory | Select-Object -ExpandProperty Name)
          Write-Output "Windows SDKs: $($sdks -join ', ')"
          if ($sdks -notcontains '10.0.26100.0') {
            Write-Error "expected Windows SDK 10.0.26100 (architecture-contracts §9); runner image provides $($sdks -join ', ')"
            exit 1
          }
      - name: Set up Python 3.12.10 for Windows ACP fixture
        id: setup-python
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Build contracts and loader facade
        run: |
          pnpm --filter @42ch/nexus-contracts run build
          pnpm --filter @42ch/nexus-native run build

      - name: Package target tarballs
        run: node packages/nexus-native/scripts/package.mjs --target ${{ matrix.target }} --out ${{ env.EVIDENCE }}/native-packages/${{ matrix.slug }}

      - name: Inspect the real artifact
        run: node packages/nexus-native/scripts/inspect-binary.mjs --target ${{ matrix.target }} --artifact packages/nexus-native-${{ matrix.slug }}/native/nexus_core_node.node --out ${{ env.EVIDENCE }}/native-binary-${{ matrix.slug }}

      - name: Install proof under Node ${{ env.NODE_FLOOR }}
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: node packages/nexus-native/scripts/proof-install.mjs --target ${{ matrix.target }} --node-version ${{ env.NODE_FLOOR }} --pack-dir ${{ env.EVIDENCE }}/native-packages/${{ matrix.slug }} --out ${{ env.EVIDENCE }}/install-${{ matrix.short }}22

      # Second Node cohort: swap the runtime only. Dependencies are already
      # installed and the Rust toolchain is not re-fetched.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_COHORT }}

      - name: Install proof under Node ${{ env.NODE_COHORT }}
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: node packages/nexus-native/scripts/proof-install.mjs --target ${{ matrix.target }} --node-version ${{ env.NODE_COHORT }} --pack-dir ${{ env.EVIDENCE }}/native-packages/${{ matrix.slug }} --out ${{ env.EVIDENCE }}/install-${{ matrix.short }}24

      - name: Upload row evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rft-native-evidence-${{ matrix.slug }}
          # Tarballs stay on the runner (large and reproducible); the evidence
          # JSONs are what the matrix summary consumes.
          path: |
            ${{ env.EVIDENCE }}/proof-build-inputs-${{ matrix.slug }}.json
            ${{ env.EVIDENCE }}/native-packages/${{ matrix.slug }}/package-receipt.json
            ${{ env.EVIDENCE }}/native-binary-${{ matrix.slug }}/binary-inspection.json
            ${{ env.EVIDENCE }}/install-${{ matrix.short }}22/install-proof.json
            ${{ env.EVIDENCE }}/install-${{ matrix.short }}24/install-proof.json
          if-no-files-found: warn

  # The glibc 2.28 floor cannot be produced by a modern host toolchain: the
  # artifact must be linked against the declared sysroot, so this row builds and
  # runs inside the manylinux_2_28 image (glibc 2.28 + gcc-toolset) and its
  # install proof executes inside that same runtime.
  linux-gnu-proof:
    name: linux-x64-gnu
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # PR lane runs darwin-arm64 only (see rft-matrix above); the glibc-2.28
    # container proof belongs to the main/nightly/dispatch lane, and a retry
    # dispatch narrows the lane to the rows it was given.
    if: github.event_name != 'pull_request' && (inputs.rows == '' || contains(inputs.rows, 'linux-x64-gnu'))
    container:
      # Pinned by immutable digest (see MANYLINUX_IMAGE_DIGEST). A tag, even a
      # version-looking one, can be repointed; a digest cannot.
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
    env:
      TARGET: x86_64-unknown-linux-gnu
      SHORT: linux
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none

      - name: Record immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          cat > "${EVIDENCE}/proof-build-inputs-linux-x64-gnu.json" <<JSON
          {
            "schema": "rft-p3-t1-build-inputs/v1",
            "row": "linux-x64-gnu",
            "source_sha": "${GITHUB_SHA}",
            "runner_label": "ubuntu-24.04",
            "rust": {
              "toolchain": "${RUST_TOOLCHAIN}",
              "target": "${TARGET}",
              "installer_url": "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${RUSTUP_INIT_TARGET}/rustup-init",
              "installer_version": "${RUSTUP_INIT_VERSION}",
              "installer_sha256": "${RUSTUP_INIT_SHA256}"
            },
            "node": { "floor": "${NODE_FLOOR}", "cohort": "${NODE_COHORT}" },
            "pnpm": "${PNPM_VERSION}",
            "container": {
              "image": "${MANYLINUX_IMAGE}",
              "tag_at_resolution": "${MANYLINUX_TAG}",
              "resolved_at": "${MANYLINUX_RESOLVED_AT}",
              "digest": "${MANYLINUX_IMAGE_DIGEST}",
              "reference": "${MANYLINUX_IMAGE}@${MANYLINUX_IMAGE_DIGEST}"
            },
            "note": "container and rustup-init are addressed by immutable identity; the artifact is built and executed against the image's glibc 2.28 runtime"
          }
          JSON
          cat "${EVIDENCE}/proof-build-inputs-linux-x64-gnu.json"

      - name: Assert glibc 2.28 sysroot and GCC >= 10.1
        shell: bash
        run: |
          set -euo pipefail
          sed -n '1,2p' /etc/os-release
          glibc_line="$(ldd --version 2>&1 | sed -n '1p')"
          cc_line="$(cc --version 2>&1 | sed -n '1p')"
          echo "${glibc_line}"
          echo "${cc_line}"
          printf '%s\n' "${glibc_line}" | grep -qE ' 2\.28(\.|$)' || {
            echo "::error::expected a glibc 2.28 sysroot (architecture-contracts §9)"
            exit 1
          }
          gcc_major="$(cc -dumpversion | cut -d. -f1)"
          [ "${gcc_major}" -ge 10 ] || {
            echo "::error::expected GCC >= 10.1 (found ${gcc_major})"
            exit 1
          }

      # rustup is the one tool this image does not ship. The installer comes
      # from the version-addressed archive (immutable URL) and is verified
      # against RUSTUP_INIT_SHA256 before anything executes it; dtolnay/
      # rust-toolchain is not usable on a bare image.
      - name: Install pinned Rust toolchain (integrity-checked rustup-init)
        shell: bash
        run: |
          set -euo pipefail
          rustup_url="https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/${RUSTUP_INIT_TARGET}/rustup-init"
          rustup_init="/tmp/rustup-init-${RUSTUP_INIT_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSf "${rustup_url}" -o "${rustup_init}"
          sidecar="$(curl --proto '=https' --tlsv1.2 -sSf "${rustup_url}.sha256" | awk '{print $1}')"
          measured="$(sha256sum "${rustup_init}" | awk '{print $1}')"
          if [ "${sidecar}" != "${RUSTUP_INIT_SHA256}" ]; then
            echo "::error::published rustup-init sidecar ${sidecar} does not match the pinned ${RUSTUP_INIT_SHA256}"
            exit 1
          fi
          if [ "${measured}" != "${RUSTUP_INIT_SHA256}" ]; then
            echo "::error::rustup-init integrity mismatch: pinned ${RUSTUP_INIT_SHA256}, measured ${measured}"
            exit 1
          fi
          chmod +x "${rustup_init}"
          "${rustup_init}" -y --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}" \
            --target x86_64-unknown-linux-gnu --target wasm32-unknown-unknown
          mkdir -p "${EVIDENCE}"
          printf '%s  rustup-init-%s\n' "${measured}" "${RUSTUP_INIT_VERSION}" \
            > "${EVIDENCE}/proof-rustup-init-${RUSTUP_INIT_VERSION}.sha256.txt"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/rustc" -Vv

      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_FLOOR }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          rust-toolchain: ""

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2
        with:
          shared-key: nexus-rust-rft-native-linux-x64-gnu
          workspaces: .
          cache-all-crates: false
          cache-on-failure: false

      - name: Build contracts and loader facade
        run: |
          pnpm --filter @42ch/nexus-contracts run build
          pnpm --filter @42ch/nexus-native run build

      - name: Package target tarballs
        run: node packages/nexus-native/scripts/package.mjs --target ${TARGET} --out ${EVIDENCE}/native-packages/linux-x64-gnu

      - name: Inspect the real artifact
        run: node packages/nexus-native/scripts/inspect-binary.mjs --target ${TARGET} --artifact packages/nexus-native-linux-x64-gnu/native/nexus_core_node.node --out ${EVIDENCE}/native-binary-linux-x64-gnu

      - name: Install proof under Node ${{ env.NODE_FLOOR }}
        run: node packages/nexus-native/scripts/proof-install.mjs --target ${TARGET} --node-version ${NODE_FLOOR} --pack-dir ${EVIDENCE}/native-packages/linux-x64-gnu --out ${EVIDENCE}/install-${SHORT}22

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_COHORT }}

      - name: Install proof under Node ${{ env.NODE_COHORT }}
        run: node packages/nexus-native/scripts/proof-install.mjs --target ${TARGET} --node-version ${NODE_COHORT} --pack-dir ${EVIDENCE}/native-packages/linux-x64-gnu --out ${EVIDENCE}/install-${SHORT}24

      - name: Upload row evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rft-native-evidence-linux-x64-gnu
          path: |
            ${{ env.EVIDENCE }}/proof-build-inputs-linux-x64-gnu.json
            ${{ env.EVIDENCE }}/proof-rustup-init-${{ env.RUSTUP_INIT_VERSION }}.sha256.txt
            ${{ env.EVIDENCE }}/native-packages/linux-x64-gnu/package-receipt.json
            ${{ env.EVIDENCE }}/native-binary-linux-x64-gnu/binary-inspection.json
            ${{ env.EVIDENCE }}/install-linux22/install-proof.json
            ${{ env.EVIDENCE }}/install-linux24/install-proof.json
          if-no-files-found: warn

  # A runner that cancels a row job (run 44798291720: darwin-arm64, zero recorded
  # steps) leaves no evidence behind, which used to require a human to rerun the
  # whole workflow. Re-dispatch only the cancelled rows instead, once: a retry
  # run carries `retry_of` and therefore never dispatches another retry. The
  # retry run produces its own verdict for those rows; nothing is merged across
  # runs, so a verdict never mixes two commits.
  retry-cancelled-rows:
    name: Retry cancelled rows (once)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rft-matrix, native-package-proof, linux-gnu-proof]
    # Only a row this lane owes can be retried: `host_rows` says whether the
    # matrix side runs at all, and a `skipped` linux row is not part of the PR
    # lane rather than a failure (I-000561 review).
    if: |-
      !cancelled() && inputs.retry_of == '' && (
        (needs.rft-matrix.outputs.host_rows == 'true' && needs.native-package-proof.result != 'success') ||
        (needs.linux-gnu-proof.result != 'success' && needs.linux-gnu-proof.result != 'skipped')
      )
    # The summary owns the verdict. A dispatch that cannot list the run's jobs or
    # is refused must not turn a runner cancellation into a red run; what this
    # job decided reaches the summary through the `rft-native-retry` artifact.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Re-dispatch the cancelled rows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # Two different commits: the rows ran at `github.sha` (on a pull request
          # that is the synthetic merge commit, which nothing can dispatch), and
          # the retry targets the PR head sha instead.
          ORIGIN_SHA: ${{ github.sha }}
          # pull_request runs live on refs/pull/<n>/merge, which cannot be
          # dispatched; the head branch is the dispatchable identity there.
          DISPATCH_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          DISPATCH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # A fork's branch does not exist in this repository, so `ref` cannot
          # name it: the dispatch is skipped and recorded instead of failing.
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # Every value below reaches this shell through `env:`, never through an
          # inline expression, and the dispatch body is built by jq (no string
          # interpolation into shell or JSON).
          known_slug='win32-x64-msvc|darwin-arm64|darwin-x64|linux-x64-gnu'
          retry_record() { # $1 attempted, $2 run id (or ""), $3 url (or ""), $4 note
            jq -nc --argjson attempted "$1" --arg run_id "$2" --arg url "$3" --arg note "$4" \
              --arg rows "${cancelled:-}" \
              '{attempted: $attempted,
                rows: ($rows | split(",") | map(select(. != ""))),
                dispatched_run_id: (if $run_id == "" then null else ($run_id | tonumber) end),
                run_url: (if $url == "" then null else $url end),
                note: $note}' > retry.json
          }
          # Per-leg conclusions, not the matrix aggregate: one cancelled leg
          # makes the aggregate `abandoned` (run 44798291720 attempt 1), which
          # names no row and cannot tell cancellation from failure.
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled") | .name' > cancelled.txt
          cancelled="$(grep -Ex "${known_slug}" cancelled.txt | paste -sd, - || true)"
          if [ -z "${cancelled}" ]; then
            retry_record false '' '' 'no row job was cancelled'
            echo "No row job was cancelled by the runner; nothing to retry."
            exit 0
          fi
          echo "Cancelled rows: ${cancelled}"
          # git's own validator: legal branch names such as `fix/a+b` or
          # `release@2` must pass. A refusal is a policy outcome, not an error.
          if ! git check-ref-format --branch "${DISPATCH_REF}" >/dev/null 2>&1; then
            retry_record false '' '' 'refused: not a valid branch name'
            echo "::warning::rows ${cancelled} were cancelled by the runner, but ${DISPATCH_REF} is not a valid branch name to dispatch; no automatic retry was attempted"
            exit 0
          fi
          if [ "${FORK_PR}" = "true" ]; then
            retry_record false '' '' 'not attempted (fork PR)'
            echo "::warning::rows ${cancelled} were cancelled by the runner; the automatic retry is NOT attempted for a pull request from a fork (${DISPATCH_REF} lives in the fork, not in ${REPO}). Re-run it from the fork with: gh workflow run rft-native-proof.yml --repo <fork> --ref ${DISPATCH_REF} -f rows=${cancelled}"
            exit 0
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # `origin_sha` says where the cancelled rows ran; `dispatch_sha` says
          # what the retry targets and re-proves. A moving `--ref` cannot dispatch
          # a commit, so the retry run reports the difference rather than claiming
          # it re-proved the origin commit.
          jq -nc --arg ref "${DISPATCH_REF}" --arg rows "${cancelled}" --arg retry_of "${RUN_ID}" \
            --arg origin_sha "${ORIGIN_SHA}" --arg dispatch_sha "${DISPATCH_SHA}" \
            '{ref: $ref, inputs: {rows: $rows, retry_of: $retry_of, origin_sha: $origin_sha, dispatch_sha: $dispatch_sha}}' \
            | gh api -X POST "repos/${REPO}/actions/workflows/rft-native-proof.yml/dispatches" --input -
          # The dispatch endpoint returns no run id, so resolve it from the runs
          # it just created. This is a record only: the verdict never depends on
          # it, and a miss leaves the dispatch itself intact.
          new_run=''
          for _ in 1 2 3 4 5; do
            # A failed listing must not abort the job: the dispatch already
            # happened, and the record below then says the id was not resolved.
            new_run="$(gh api "repos/${REPO}/actions/workflows/rft-native-proof.yml/runs?event=workflow_dispatch&per_page=20" \
              | jq -r --arg sha "${DISPATCH_SHA}" --arg after "${started_at}" \
                  '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $after) | .id' \
              | sort -n | tail -1)" || new_run=''
            if [ -n "${new_run}" ]; then break; fi
            sleep 2
          done
          if [ -n "${new_run}" ]; then
            run_url="${SERVER_URL}/${REPO}/actions/runs/${new_run}"
            retry_record true "${new_run}" "${run_url}" "dispatched (run ${new_run})"
            echo "::warning::rows ${cancelled} were cancelled by the runner — dispatched the one automatic retry: ${run_url}"
          else
            retry_record true '' '' 'dispatched (run id not resolved yet)'
            echo "::warning::rows ${cancelled} were cancelled by the runner — dispatched the one automatic retry; it is the newest workflow_dispatch run of this workflow: ${SERVER_URL}/${REPO}/actions/workflows/rft-native-proof.yml"
          fi

      - name: Upload the retry record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rft-native-retry
          path: retry.json
          if-no-files-found: ignore

  native-package-matrix-summary:
    name: Matrix summary
    runs-on: ubuntu-latest
    # `retry-cancelled-rows` is read for its record only; the verdict below never
    # depends on it (it runs with continue-on-error).
    needs: [rft-matrix, native-package-proof, linux-gnu-proof, retry-cancelled-rows]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none

      # A lane can produce zero evidence artifacts (every row cancelled by the
      # runner). download-artifact fails when the pattern matches nothing, so
      # this step must not own the verdict: the per-row states below record the
      # absence and `evidence_artifacts: none` names it in the matrix.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: rft-native-evidence-*
          merge-multiple: true
          path: rft-native-evidence

      # What the retry job decided (dispatched + run link, not attempted, or
      # nothing). This is a record, not an input to the verdict. A retry run
      # produces its own verdict for its own rows; nothing is merged across runs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: rft-native-retry
          path: retry-record

      - name: Resolve per-row job conclusions
        id: conclusions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Job names equal the row slugs (`name: matrix.slug` on the matrix job
          # and `name: linux-x64-gnu`), so the run's own jobs name each row state.
          # There is no aggregate fallback: one cancelled leg makes the matrix
          # result `abandoned` (run 44798291720 attempt 1), which names no row and
          # cannot tell cancellation from failure, so an unresolved map fails the
          # verdict instead of inventing row states.
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
               --jq '[.jobs[] | select(.conclusion != null) | {key: .name, value: .conclusion}] | from_entries' \
               > row-conclusions.json; then
            cat row-conclusions.json
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::per-row job conclusions unavailable; the verdict will fail rather than fall back to the matrix aggregate'
            echo '{}' > row-conclusions.json
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Consolidate matrix evidence
        shell: bash
        env:
          MATRIX_JOB_RESULT: ${{ needs.native-package-proof.result }}
          LINUX_JOB_RESULT: ${{ needs.linux-gnu-proof.result }}
          CONCLUSIONS_RESOLVED: ${{ steps.conclusions.outputs.resolved }}
          # The rows this run owes, from its own rft-matrix (lane or retry).
          EXPECTED_ROWS: ${{ needs.rft-matrix.outputs.rows }}
          RETRY_OF: ${{ inputs.retry_of }}
          # `origin_sha` = where the cancelled rows ran (the PR merge commit);
          # `dispatch_sha` = what the retry targets and must have re-proved.
          ORIGIN_SHA: ${{ inputs.origin_sha }}
          DISPATCH_SHA: ${{ inputs.dispatch_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          node --input-type=module -e "$(cat <<'JS'
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = 'rft-native-evidence';
          const SCHEMA = 'rft-p3-t1-native-package-matrix/v2';
          const runSha = process.env.GITHUB_SHA ?? null;
          const retryOf = process.env.RETRY_OF || '';
          // The commit the cancelled rows ran at (on a pull request: the
          // synthetic merge commit). Recorded as provenance only — nothing can
          // dispatch it, and it is never compared with this run's sha.
          const originSha = (process.env.ORIGIN_SHA || '') || null;
          // The commit the retry targets and must have re-proved (the PR head sha
          // there, else the origin's `github.sha`). This is the one compared with
          // the sha this run actually ran.
          const dispatchSha = (process.env.DISPATCH_SHA || '') || null;
          // Rows this run owes: its lane on a normal run, the cancelled rows on a
          // retry run. `rft-matrix` is the single source of that list.
          const expected = JSON.parse(process.env.EXPECTED_ROWS || '[]');
          const conclusionsPath = 'row-conclusions.json';
          const conclusions = existsSync(conclusionsPath) ? JSON.parse(readFileSync(conclusionsPath, 'utf8')) : {};
          // What the retry job reported (`rft-native-retry`). A record only: the
          // verdict below is computed from this run's own rows, never from
          // another run's matrix, so a verdict cannot mix two commits.
          const retryRecordPath = join('retry-record', 'retry.json');
          const retryInfo = existsSync(retryRecordPath) ? JSON.parse(readFileSync(retryRecordPath, 'utf8')) : null;
          // A cancelled row is non-blocking only when a retry was actually
          // dispatched to re-prove it; otherwise its evidence is absent and the
          // reason is named on the row.
          const retryDispatched = retryInfo !== null && retryInfo.attempted === true;
          const noRetryReason =
            retryOf !== ''
              ? 'this is the retry run'
              : retryInfo === null
                ? 'no retry record'
                : typeof retryInfo.note === 'string' && retryInfo.note !== ''
                  ? retryInfo.note
                  : 'no retry dispatched';
          const NO_RETRY_NOTE = 'cancelled, no retry dispatched (' + noRetryReason + ')';
          const payload = (fields) => ({
            schema: SCHEMA,
            source_sha: runSha,
            run_id: process.env.GITHUB_RUN_ID ?? null,
            utc: new Date().toISOString(),
            jobs: { native_package_proof: process.env.MATRIX_JOB_RESULT, linux_gnu_proof: process.env.LINUX_JOB_RESULT },
            pinned: {
              rust_toolchain: process.env.RUST_TOOLCHAIN,
              node_floor: process.env.NODE_FLOOR,
              node_cohort: process.env.NODE_COHORT,
              pnpm: process.env.PNPM_VERSION,
              manylinux_image: process.env.MANYLINUX_IMAGE,
              manylinux_digest: process.env.MANYLINUX_IMAGE_DIGEST,
              rustup_init_version: process.env.RUSTUP_INIT_VERSION,
              rustup_init_sha256: process.env.RUSTUP_INIT_SHA256,
            },
            ...fields,
          });
          const writeMatrix = (fields) => {
            const value = payload(fields);
            mkdirSync(process.env.EVIDENCE, { recursive: true });
            writeFileSync(join(process.env.EVIDENCE, 'native-package-matrix.json'), JSON.stringify(value, null, 2) + '\n');
            return value;
          };
          // The retry run records both commits it is about: the one it re-proved
          // and the one the cancelled rows came from. A difference is named on
          // every path, including the one that exits below.
          const warnRetrySha = () => {
            if (retryOf === '') return;
            if (dispatchSha === null) {
              console.warn(
                '::warning::P3-T1 this retry does not record the dispatch sha; the commit it re-proved (' +
                  runSha + ') cannot be compared with what the dispatch targeted',
              );
            } else if (dispatchSha !== runSha) {
              console.warn(
                '::warning::P3-T1 retry re-proved ' + runSha + '; the dispatch targeted ' + dispatchSha,
              );
            }
          };
          // The four-state model needs each row's own job conclusion. The matrix
          // aggregate cannot supply it (one cancelled leg reads `abandoned` and
          // names no row), so an unresolved map fails the verdict instead of
          // inventing a row state from an aggregate.
          if (process.env.CONCLUSIONS_RESOLVED !== 'true' || Object.keys(conclusions).length === 0) {
            writeMatrix({
              job_conclusion_source: 'unresolved',
              evidence_artifacts: existsSync(root) ? 'uploaded' : 'none',
              retry:
                retryOf === ''
                  ? null
                  : { of_run_id: Number(retryOf), origin_sha: originSha, dispatch_sha: dispatchSha, sha: runSha },
              rows: [],
              cancelled_rows: [],
              blocking_rows: [],
              decision: 'fail',
              note: 'per-row job conclusions could not be resolved from the run jobs API; the four-state verdict needs them, so no state is inferred from the matrix aggregate',
            });
            warnRetrySha();
            console.error(
              '::error::P3-T1 native package matrix is fail — cannot resolve per-row job conclusions ' +
                '(the run jobs API did not answer); the matrix aggregate cannot name a row state',
            );
            process.exit(1);
          }
          const out = [];
          for (const row of expected) {
            const files = {
              package_receipt: join(root, 'native-packages', row.suffix, 'package-receipt.json'),
              binary_inspection: join(root, 'native-binary-' + row.suffix, 'binary-inspection.json'),
              install_node_floor: join(root, 'install-' + row.short + '22', 'install-proof.json'),
              install_node_cohort: join(root, 'install-' + row.short + '24', 'install-proof.json'),
            };
            const immutableInputsPath = join(root, 'proof-build-inputs-' + row.suffix + '.json');
            const immutableInputs = existsSync(immutableInputsPath)
              ? JSON.parse(readFileSync(immutableInputsPath, 'utf8'))
              : null;
            const states = {};
            const missing = [];
            for (const [key, path] of Object.entries(files)) {
              if (existsSync(path)) {
                states[key] = JSON.parse(readFileSync(path, 'utf8')).status;
              } else {
                states[key] = 'unavailable';
                missing.push(path);
              }
            }
            // A row must carry its immutable build-input record too, or its
            // provenance is unverifiable and the row cannot be a pass.
            if (!immutableInputs) {
              states.build_inputs = 'unavailable';
              missing.push(immutableInputsPath);
            } else {
              states.build_inputs = 'recorded';
            }
            const values = Object.values(states);
            const jobConclusion = conclusions[row.suffix] ?? 'unknown';
            // Evidence first: a row that uploaded a complete, valid proof has
            // proof, so it is `pass` whatever the job's later state — a cancelled
            // job that still uploaded evidence must not be called missing.
            const evidenceComplete =
              missing.length === 0 && values.every((value) => value === 'pass' || value === 'recorded');
            // Four row states (I-000561). A cancelled job alone is non-blocking
            // only when a retry was actually dispatched to re-prove the row;
            // without a dispatch its evidence is absent, so it blocks as
            // `missing` with the reason named on the row.
            let status;
            let note;
            if (evidenceComplete) {
              status = 'pass';
            } else if (jobConclusion === 'cancelled') {
              if (retryDispatched) {
                status = 'cancelled';
              } else {
                status = 'missing';
                note = NO_RETRY_NOTE;
              }
            } else if (jobConclusion !== 'success') {
              status = 'failed';
            } else if (values.includes('fail')) {
              status = 'failed';
            } else {
              status = 'missing';
            }
            out.push({
              suffix: row.suffix,
              short: row.short,
              job_conclusion: jobConclusion,
              states,
              // Nothing for this row was uploaded: named explicitly so a reader
              // of the matrix does not have to infer it from five paths.
              no_evidence_uploaded: missing.length === Object.keys(files).length + 1,
              missing_evidence: missing,
              build_inputs: immutableInputs,
              status,
              ...(note === undefined ? {} : { note }),
            });
          }
          const cancelledRows = out.filter((row) => row.status === 'cancelled').map((row) => row.suffix);
          // Cancelled rows with no dispatch behind them: their evidence is absent
          // and they block, so they are named separately from the non-blocking
          // `cancelled` rows above.
          const undispatchedCancelRows = out
            .filter((row) => row.note === NO_RETRY_NOTE)
            .map((row) => row.suffix);
          const blockingRows = out
            .filter((row) => row.status === 'missing' || row.status === 'failed')
            .map((row) => row.suffix);
          // A retry run says which run it re-proves and which two commits are in
          // play; an origin run reports what the retry job decided (a dispatch
          // record, a refusal, or nothing). Neither claims evidence from the
          // other run.
          const retry =
            retryOf !== ''
              ? { of_run_id: Number(retryOf), origin_sha: originSha, dispatch_sha: dispatchSha, sha: runSha }
              : retryInfo === null
                ? cancelledRows.length === 0 && undispatchedCancelRows.length === 0
                  ? null
                  : 'unknown (the retry job reported nothing)'
                : retryInfo.attempted === true
                  ? {
                      status: retryInfo.note,
                      rows: retryInfo.rows,
                      ...(retryInfo.dispatched_run_id === null
                        ? {}
                        : { run_id: retryInfo.dispatched_run_id, run_url: retryInfo.run_url }),
                    }
                  : retryInfo.rows.length > 0
                    ? retryInfo.note
                    : null;
          const decision = out.length === 0 || blockingRows.length > 0 ? 'fail' : 'pass';
          writeMatrix({
            job_conclusion_source: 'run-jobs',
            evidence_artifacts: existsSync(root) ? 'uploaded' : 'none',
            retry,
            build_inputs: out.map((row) => row.build_inputs).filter(Boolean),
            rows: out,
            cancelled_rows: cancelledRows,
            undispatched_cancelled_rows: undispatchedCancelRows,
            blocking_rows: blockingRows,
            decision,
            note: 'row status: pass (its evidence is complete and valid, whatever the job state) | cancelled (the runner cancelled the job and the automatic retry was dispatched to re-prove it) | missing (no evidence: the job succeeded without producing it, or a cancelled row has no dispatch behind it) | failed (the job failed). missing and failed block P3; cancelled blocks nothing only because a dispatch exists (I-000561)',
          });
          console.log(JSON.stringify(out, null, 2));
          warnRetrySha();
          if (cancelledRows.length > 0) {
            console.warn(
              '::warning::P3-T1 row(s) cancelled by the runner: ' + cancelledRows.join(', ') +
                ' — no evidence was possible; the dispatched retry re-proves them (I-000561)',
            );
          }
          if (undispatchedCancelRows.length > 0) {
            console.warn(
              '::warning::P3-T1 cancelled row(s) with no retry dispatched: ' + undispatchedCancelRows.join(', ') +
                ' — recorded as missing and blocking (' + noRetryReason + ')',
            );
          }
          if (decision !== 'pass') {
            const reason =
              out.length === 0
                ? 'no row was evaluated'
                : undispatchedCancelRows.length > 0
                  ? undispatchedCancelRows.join(', ') + ' was cancelled with no retry dispatched (' +
                    noRetryReason + '), so its evidence is absent'
                  : blockingRows.join(', ') + ' is missing or failed evidence';
            console.error('::error::P3-T1 native package matrix is ' + decision + ' — ' + reason);
            process.exit(1);
          }
          JS
          )"

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rft-native-package-matrix
          path: .mstar/iterations/v1.189/guides/evidence/native-package-matrix.json
          if-no-files-found: warn
