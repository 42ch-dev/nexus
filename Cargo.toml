[workspace]
members = [
    "crates/nexus-acp-host",
    "crates/nexus-agent-host",
    "crates/nexus-contracts",
    "crates/nexus-creator",
    "crates/nexus-creator-memory",
    "crates/nexus-daemon-runtime",
    "crates/nexus-home-layout",
    "crates/nexus-knowledge",
    "crates/nexus-moment-context-assembly",
    "crates/nexus-narrative",
    "crates/nexus-orchestration",
    "crates/nexus-spoke-adapter",
    "crates/nexus-wasm-host",
    "apps/nexus42",
    "crates/nexus-cloud-sync",
    "crates/nexus-cloud-domain",
    "crates/nexus-local-db",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["42ch"]
license = "Apache-2.0"
repository = "https://github.com/42ch/nexus"

# --- Lint configuration ---
# All workspace crates inherit these via [lints] workspace = true.
# Enable pedantic + nursery groups; selectively allow overly noisy lints.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic group
pedantic = { level = "warn", priority = -1 }
# Nursery group
nursery = { level = "warn", priority = -1 }

# Selectively allow lints that are too noisy or opinionated for this project.
# Each allow should have a brief justification; revisit periodically.
missing_docs_in_private_items = "allow"     # pre-1.0: will enable later
allow_attributes_without_reason = "allow"   # too noisy during rapid iteration
# module_name_repetitions = "allow"         # uncomment if too noisy
# similar_names = "allow"                   # uncomment if too noisy

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
url = "2"
strum = { version = "0.26", features = ["derive"] }
pulldown-cmark = "0.12"
pulldown-cmark-frontmatter = "0.2"
serde_yaml = "0.9"
async-trait = "0.1"
tempfile = "3"
jsonrpsee = { version = "0.26", default-features = false, features = ["server-core", "client-core", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
toml = "0.8"
statig = { version = "0.3", features = ["async"] }
futures-util = "0.3"
tokio-stream = "0.1"
blake3 = "1"
# V1.58 P0 T1 (R-V156P0-M001): sha2 workspace-managed — referenced as
# `sha2.workspace = true` by crates that compute OCC content hashes.
sha2 = "0.10"
handlebars = "6"
which = "8"
regex = "1"
subtle = { version = "2", default-features = false }
# V1.50 T-A P0 T2: cron expression parsing (novel-writing staggering spec §3.1)
cron = "0.12"
# V1.50 T-A P0 T2: IANA timezone validation (spec §3.1 `--tz`)
chrono-tz = "0.10"
# V1.138 T4: required by typify-generated Rust wire types. JSON Schema
# `"format": "regex"` → `regress::Regex`; `chrono` (above) covers `"date-time"`.
# Version pinned to match the sibling spoke repo + typify 0.3 (0.10.5) for
# cross-repo consistency. Referenced as `regress.workspace = true` by
# `crates/nexus-contracts` (generated code only).
regress = "0.10"
# V1.139 T1: SPOKE foundation deps. Lockstep exact pin at 0.2.0 across both
# Rust crates and both npm packages (compass Q14). The `=` prefix forces an
# exact resolution (no caret/tilde range). Published on crates.io at 0.2.0.
# Consumers (the upcoming spoke-adapter crate + nexus-contracts generated
# types) will reference these via `spoke-schemas.workspace = true`.
spoke-schemas = "=0.4.1"
spoke-operations = "=0.4.1"

# --- Dev profile: keep local `target/` smaller ---
# Default `debug = true` (full) inflates deps/rlibs and test binaries. Line-limited
# info is enough for backtraces; turn deps off entirely (workspace members keep
# the profile.dev setting — `"*"` does not override members).
# `split-debuginfo = "unpacked"` is already the macOS Cargo default when debuginfo
# is on; set explicitly so Linux matches and .dwo/.dSYM can be swept separately.
# Does not shrink existing artifacts — rebuild (or `cargo clean` / cargo-sweep) first.
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
