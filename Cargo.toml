[workspace]
members = [
    "crates/nexus-acp-host",
    "crates/nexus-agent-host",
    "crates/nexus-contracts",
    "crates/nexus-creator",
    "crates/nexus-creator-memory",
    "crates/nexus-daemon-runtime",
    "crates/nexus-home-layout",
    "crates/nexus-knowledge",
    "crates/nexus-moment-context-assembly",
    "crates/nexus-narrative",
    "crates/nexus-orchestration",
    "crates/nexus-spoke-adapter",
    "crates/nexus-wasm-host",
    "apps/nexus42",
    "crates/nexus-cloud-sync",
    "crates/nexus-cloud-domain",
    "crates/nexus-local-db",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["42ch"]
license = "Apache-2.0"
repository = "https://github.com/42ch/nexus"

# --- Lint configuration ---
# All workspace crates inherit these via [lints] workspace = true.
# Enable pedantic + nursery groups; selectively allow overly noisy lints.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic group
pedantic = { level = "warn", priority = -1 }
# Nursery group
nursery = { level = "warn", priority = -1 }

# Selectively allow lints that are too noisy or opinionated for this project.
# Each allow should have a brief justification; revisit periodically.
missing_docs_in_private_items = "allow"     # pre-1.0: will enable later
allow_attributes_without_reason = "allow"   # too noisy during rapid iteration
# module_name_repetitions = "allow"         # uncomment if too noisy
# similar_names = "allow"                   # uncomment if too noisy

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
url = "2"
strum = { version = "0.26", features = ["derive"] }
pulldown-cmark = "0.12"
pulldown-cmark-frontmatter = "0.2"
serde_yaml = "0.9"
async-trait = "0.1"
tempfile = "3"
jsonrpsee = { version = "0.26", default-features = false, features = ["server-core", "client-core", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
toml = "0.8"
statig = { version = "0.3", features = ["async"] }
futures-util = "0.3"
tokio-stream = "0.1"
blake3 = "1"
# V1.58 P0 T1 (R-V156P0-M001): sha2 workspace-managed — referenced as
# `sha2.workspace = true` by crates that compute OCC content hashes.
sha2 = "0.10"
handlebars = "6"
which = "8"
regex = "1"
subtle = { version = "2", default-features = false }
# V1.50 T-A P0 T2: cron expression parsing (novel-writing staggering spec §3.1)
cron = "0.12"
# V1.50 T-A P0 T2: IANA timezone validation (spec §3.1 `--tz`)
chrono-tz = "0.10"
# V1.138 T4: required by typify-generated Rust wire types. JSON Schema
# `"format": "regex"` → `regress::Regex`; `chrono` (above) covers `"date-time"`.
# Version pinned to match the sibling spoke repo + typify 0.3 (0.10.5) for
# cross-repo consistency. Referenced as `regress.workspace = true` by
# `crates/nexus-contracts` (generated code only).
regress = "0.10"
# V1.139 T1: SPOKE foundation deps. Lockstep exact pin at 0.6.0 across both
# Rust crates and both npm packages (compass Q14). The `=` prefix forces an
# exact resolution (no caret/tilde range). Published on crates.io at 0.9.1.
# V1.153 P0 (FL-R E1): 0.8.2 → 0.9.1 — lockstep re-baseline on the connect
# v2 wire. 0.9.0's connect changes (dial-bound hello, envelope-auth v2
# signature fields) are internal to spoke-connect (pub(crate), owned by
# SpokeConnectNode); the nexus-used connect surface is unchanged.
# spoke-operations 0.9.1 additionally converted the adapter port traits +
# `orchestrate_*` from sync to native async — adapted signature-level in
# V1.153 P0 T2 (no operations-surface parity implied).
# V1.148: 0.6.1 → 0.8.2 — the connect family is additive: 0.7.0 added the
# connect interaction wire surface (schemas/connect/*, + libp2p spike) and
# the pack-catalog demote (ModuleMap / KE.modules description-only — catalog
# stays on the product transport envelope, not `modules.*`); 0.8.x = connect
# bindings/release (0.8.1 Maven/PyPI action pins; 0.8.2 Kotlin groupId).
# InternalError 500-class was already absorbed at 0.6.1 (V1.146). No
# structural wire change for nexus. The new connect crate is NOT added here
# — P3 adds it behind feature `connect-host`.
# V1.146: 0.6.0 → 0.6.1 — spoke adds InternalError 500-class reject code
# (PR #35). Additive; no consumer code change required.
# V1.145: 0.5.0 → 0.6.0 — Scope.extensions (HashMap<ScopeExtensionsKey, _>)
# additive + KnowledgeEntry.modules (capability-flagged, additive).
# Consumers (the upcoming spoke-adapter crate + nexus-contracts generated
# types) will reference these via `spoke-schemas.workspace = true`.
spoke-schemas = "=0.9.1"
spoke-operations = "=0.9.1"
# V1.148 P3 N-C0 (DF-72): spoke-connect — Connect Host facade (signed
# hello, allowlist, capability-token gate). V1.153 P0: 0.8.2 → 0.9.1
# (dial-bound hello + envelope-auth v2 are internal to spoke-connect;
# nexus surface unchanged). Opt-in ONLY: libp2p 0.56 is a
# transitive dep, so this entry is consumed behind feature `connect-host` on
# `apps/nexus42` and the DEFAULT daemon graph stays libp2p-free. The `mdns`
# feature of spoke-connect must NOT be enabled (explicit peering only).
spoke-connect = "=0.9.1"
# V1.148 P3 N-C0: libp2p 0.56 — identity/PeerId/Multiaddr types for the
# `nexus42 connect` CLI (ed25519 keypair + protobuf key serialization only).
# Pinned exactly to spoke-connect's transport so the feature-on graph shares
# ONE libp2p build. Consumed behind feature `connect-host` on `apps/nexus42`;
# the DEFAULT daemon graph stays libp2p-free.
libp2p = { version = "=0.56.0", features = ["ed25519"] }

# --- Dev profile: keep local `target/` smaller ---
# Default `debug = true` (full) inflates deps/rlibs and test binaries. Line-limited
# info is enough for backtraces; turn deps off entirely (workspace members keep
# the profile.dev setting — `"*"` does not override members).
# `split-debuginfo = "unpacked"` is already the macOS Cargo default when debuginfo
# is on; set explicitly so Linux matches and .dwo/.dSYM can be swept separately.
# Does not shrink existing artifacts — rebuild (or `cargo clean` / cargo-sweep) first.
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
