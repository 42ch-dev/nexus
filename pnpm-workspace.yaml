packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# pnpm 11 defaults minimumReleaseAge to 1440 (24h) with no per-package
# exemption; it blocked same-day @42ch/spoke lockstep bumps in PR #223 CI
# (2026-08-19). Lowered to 720 (12h) per user decision so first-party
# lockstep can follow spoke releases within 12h while keeping a freshness
# gate for third-party. Defenses that remain: frozen lockfile + allowBuilds + overrides.
minimumReleaseAge: 720

# pnpm 10+ reads settings (overrides, etc.) from pnpm-workspace.yaml;
# pnpm 11 stopped reading the package.json `pnpm` field entirely.
# Keep security/version overrides here so they apply under the CI pin.
overrides:
  # Security floors (2026-09-10 Dependabot remediation): fast-uri >=4.1.3
  # (GHSA-jqff-g426-hqxp / GHSA-fph4-wmhf-6fwf / GHSA-f65p-4m7j-42xc /
  # GHSA-5jgf-p345-68v8), browserslist >=4.28.7 (GHSA-73wf-gq98-2v4g /
  # GHSA-c83g-rgw3-j3cx), js-yaml >=4.3.2 (GHSA-2883-xcg3-v3hh).
  # 2026-10-01 Dependabot remediation raised fast-uri to >=4.1.5
  # (GHSA-jvvf-x445-j334 / GHSA-hrr3-gc8f-f4qj), raised brace-expansion to
  # >=5.0.12 (GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr),
  # and added markdown-it >=14.3.1 (GHSA-253c-mchw-3w2r).
  # 2026-10-25 Dependabot sweep: fast-uri >=4.2.3 (GHSA-w74x-v6f9-j3xg /
  # GHSA-xhq7-xmqj-769h / GHSA-wjr9-j795-jxcr / GHSA-333x-w4r6-6crp),
  # markdown-it >=14.3.3 (GHSA-gfr2-rv44-r23c / GHSA-vfgh-jcmw-g37q), and
  # undici 7.x scoped to @electron/get@5 (GHSA-xjj6-f33q-929c /
  # GHSA-4qv8-2p9j-2685 / GHSA-f72v-6w45-q472). undici MUST stay scoped: a
  # blanket floor would downgrade jsdom's undici 8.x.
  fast-uri: '>=4.2.3'
  # Scoped on purpose: @electron/get@5 is the only undici 7.x consumer;
  # jsdom@30 declares undici ^8.11.2 and must not be downgraded.
  '@electron/get@5>undici': '>=7.30.1 <8'
  # Major for Tailwind 3 / postcss-nested 6, which both declare ^6.1.x.
  # D6-gated: reverted if any build/test gate reds.
  postcss-selector-parser: '>=7.1.6 <8'
  browserslist: '>=4.28.7 <5'
  linkify-it: '>=5.0.2 <6'
  brace-expansion: '>=5.0.12'
  markdown-it: '>=14.3.3 <15'
  js-yaml: '>=4.3.2 <5'
  # js-yaml 5.x is NOT in GHSA-2883-xcg3-v3hh's affected ranges (`>=4.0.0 <4.3.2`
  # / `>=3.0.0 <3.15.2`; v5 rewrote default merge handling), so the >=4.3.2
  # security floor above is unchanged. Two mandatory major-16 codegen packages
  # require js-yaml v5-only exports (`Schema.withTags`, `binaryTag`):
  # json-schema-to-typescript 16.0.0 declares js-yaml `^5.2.3` and
  # @apidevtools/json-schema-ref-parser 16.0.2 declares js-yaml `^5.4.1`
  # (registry.npmjs.org manifests). Uncap the override for exactly those two
  # parents at `>=5.4.1 <6` (satisfies both upstream floors); every other
  # consumer (incl. ref-parser 11.9.3 inside jstt) keeps the global <5 cap.
  'json-schema-to-typescript>js-yaml': '>=5.4.1 <6'
  '@apidevtools/json-schema-ref-parser@16>js-yaml': '>=5.4.1 <6'
  esbuild: '^0.28.1'
  nanoid: '>=3.3.18 <4'

# pnpm >= 10 blocks dependency lifecycle scripts unless allowlisted
# (`allowBuilds`, name -> bool map). These two ran their postinstall
# scripts under pnpm 9; keep that behavior (esbuild needs its binary,
# msw's postinstall is a guarded no-op) so frozen installs stay green.
allowBuilds:
  esbuild: true
  msw: true
