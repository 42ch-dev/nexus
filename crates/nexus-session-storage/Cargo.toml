[package]
name = "nexus-session-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Session identity/status types and the storage error contract for the orchestration session store"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

graph-flow = { version = "=0.8.1", default-features = false }
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-local-db = { path = "../nexus-local-db" }
nexus-preset = { path = "../nexus-preset" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.35", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
