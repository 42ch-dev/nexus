[package]
name = "nexus-preset"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure preset grammar, validation, discovery, and source identity"
publish = false

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-workflow-ir = { path = "../nexus-workflow-ir" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
include_dir = "0.7"

[target.'cfg(unix)'.dependencies]
# Descriptor-based asset confinement: `open(O_NONBLOCK | O_CLOEXEC)` and the
# macOS `fcntl(F_GETPATH)` descriptor-path query, both behind safe wrappers —
# this crate keeps the workspace `unsafe_code = "forbid"`.
nix = { version = "0.32.0", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The descriptor's final path comes from the workspace's audited native bridge.
nexus-config-metadata = { path = "../nexus-config-metadata" }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
