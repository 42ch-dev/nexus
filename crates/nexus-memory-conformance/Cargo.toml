[package]
name = "nexus-memory-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent durable SPOKE memory provider fixture for N3 conformance (test crate, not a server)."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoke-connect = { workspace = true, features = ["remote-adapter"] }
spoke-operations = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# I-000322 test-graph switch: the nexus-core features the conformance
# vertical drives are requested HERE, explicitly, instead of entering the
# default/workspace all-targets graph through the dev-dependency. CI and
# targeted runs pass `--features dev-graph-memory-remote`; the default graph
# carries no `memory-remote` edge into nexus-core (Track C owns the ci.yml
# enumeration that must request this feature).
dev-graph-memory-remote = [
    "nexus-core/memory-remote",
    "nexus-core/provider-host",
    "nexus-core/execution",
    "nexus-core/test-hooks",
]

[dev-dependencies]
base64 = "0.22"
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_jcs = "0.2"
tempfile = { workspace = true }
# v1.229 N3 Task 1 (R1): the real public Core open/close surface the remote
# vertical slice drives over a signed loopback session. The conformance crate
# depends on Core, never the reverse; the Core features under test are
# requested by the package feature `dev-graph-memory-remote` above (I-000322),
# so the default/workspace all-targets graph no longer unifies them in
# unconditionally.
nexus-core = { path = "../nexus-core" }
# The disposable user home the open resolves (workspace dir, state DB and the
# provider's own file root) through the production layout instead of a
# hardcoded copy of it.
nexus-home-layout = { path = "../nexus-home-layout" }
# v1.229 N3 Task 2 (R2): the real public `create_world` / `create_character`
# request types own the owned-World, two-active-binding fixture the D18 removal
# gate is proved against. Test-only; already a Core graph dependency.
nexus-contracts = { path = "../nexus-contracts" }
# v1.229 N3 Task 2 fix 1 (R2, amendment 3): the existing admitted Host
# composition (`open_host`/`attach_host` + `create_session`/`execute`) that owns
# the real `subject_archived`/`family` consumer, driven with the deterministic
# local agent-host fixture. Test-only edges; the memory port stays the real
# signed provider.
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-provider-ports = { path = "../nexus-provider-ports" }

# I-000322: every target that drives the real Core surface requires the
# test-graph feature. Without it the target is skipped instead of compiling
# against a feature-less Core, so the default/workspace all-targets graph
# carries no `memory-remote` edge into nexus-core. `provider_bootstrap` and
# `server_loopback` stay out: they exercise the fixture alone.
[[test]]
name = "c_admission_lifecycle"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "c_capability_refusals"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "c_capture_candidates"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "c_grants_errors"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "c_local_legacy"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "c_records_recall_profiles"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "remote_core_recall_profiles"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "remote_core_records_promote"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "remote_core_subjects_candidates"
required-features = ["dev-graph-memory-remote"]

[[test]]
name = "remote_open"
required-features = ["dev-graph-memory-remote"]
