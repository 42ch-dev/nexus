[package]
name = "nexus-memory-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent durable SPOKE memory provider fixture for N3 conformance (test crate, not a server)."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoke-connect = { workspace = true, features = ["remote-adapter"] }
spoke-operations = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
base64 = "0.22"
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_jcs = "0.2"
tempfile = { workspace = true }
# v1.229 N3 Task 1 (R1): the real public Core open/close surface the remote
# vertical slice drives over a signed loopback session. The conformance crate
# depends on Core, never the reverse; `memory-remote` is the feature under test.
nexus-core = { path = "../nexus-core", features = [
    "memory-remote",
    "provider-host",
    # v1.229 N3 Task 2 fix 1 (R2, amendment 4): a Character host session needs
    # the admitted creative-root pin (`host.rs::character_session_cwd`), so the
    # real `subject_archived`/`family` consumer is reachable only with this
    # existing feature. Test-only; the production/default graph is unchanged.
    "execution",
    # v1.229 N3 Task 8 (C8, amendment 1): the C-matrix rows C-023, C-024 and
    # C-028 must be proved on the real local provider too, and its only
    # operator seams for the commit-boundary loss, the pre-COMMIT abort and the
    # retention clock are the existing `test-hooks` seams. Test-only and
    # compiled out of the production build; no new hook, package or feature.
    "test-hooks",
] }
# The disposable user home the open resolves (workspace dir, state DB and the
# provider's own file root) through the production layout instead of a
# hardcoded copy of it.
nexus-home-layout = { path = "../nexus-home-layout" }
# v1.229 N3 Task 2 (R2): the real public `create_world` / `create_character`
# request types own the owned-World, two-active-binding fixture the D18 removal
# gate is proved against. Test-only; already a Core graph dependency.
nexus-contracts = { path = "../nexus-contracts" }
# v1.229 N3 Task 2 fix 1 (R2, amendment 3): the existing admitted Host
# composition (`open_host`/`attach_host` + `create_session`/`execute`) that owns
# the real `subject_archived`/`family` consumer, driven with the deterministic
# local agent-host fixture. Test-only edges; the memory port stays the real
# signed provider.
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-provider-ports = { path = "../nexus-provider-ports" }
