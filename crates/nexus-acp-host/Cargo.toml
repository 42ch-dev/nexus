[package]
name = "nexus-acp-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ACP client host library (registry + transport + adapter) — provider-host cohort linkage."

[lints]
workspace = true

[dependencies]
# 2026-09-10 dependency sweep (#281): 0.11.1 → 2.1.0. Pinned `=3.2.0`;
# stable protocol v1 only (`schema::v1`, `ProtocolVersion::V1`).
# The v3 SDK enables no features by default (`default = []`): its native
# transports (`process`, `stdio`) and JSON-Schema generation (`schemars`)
# are opt-in, and Nexus enables none of them — it owns child-process
# lifecycle with Tokio + `ByteStreams` and owns its wire schemas in
# `schemas/`. No `unstable_*` feature is enabled.
agent-client-protocol = "=3.3.0"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
async-broadcast = "0.7"
toml = "1.1"
toml_edit = "0.25"
nexus-contracts = { path = "../nexus-contracts" }
# Unix signal handling for graceful shutdown (only on Unix platforms)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# v1.193 P2-T13: the `connect-client` feature retired with the Model A
# `nexus_mcp_stdio_server` factory (deleted in P1-T6). The generic ACP
# `mcp_servers` descriptors stay feature-free in `src/client.rs`/`skills.rs`.

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
