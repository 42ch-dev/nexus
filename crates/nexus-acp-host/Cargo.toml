[package]
name = "nexus-acp-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ACP client host library (registry + transport + adapter) — worker-only linkage."

[lints]
workspace = true

[dependencies]
agent-client-protocol = "=0.11.1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
async-broadcast = "0.7"
toml = "0.8"
toml_edit = "0.22"
nexus-contracts = { path = "../nexus-contracts" }
which = "7"
# Unix signal handling for graceful shutdown (only on Unix platforms)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

# V1.174 P1 T1 (AR-75 C-1): marker feature gating the first-class nexus
# MCP stdio wiring (`src/mcp.rs`). No extra dependencies — the surface
# only builds SDK `McpServer::Stdio` from `agent-client-protocol`, which
# the shipped graph already carries. The `nexus42` crate forwards its own
# `connect-client` feature onto this one.
[features]
connect-client = []

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
# R-V1148P0-001 / R-V1151P2-004: the fork/PATH-dependent scan-probe tests are
# marked `#[serial]` so they never fork concurrently within this test binary
# (same pin as nexus-daemon-runtime / nexus-orchestration).
serial_test = "3"
