[package]
name = "nexus-moment-context-assembly"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-moment context assembly for ACP sessions (Stage-0 local, optional cloud-stage)"

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-narrative = { path = "../nexus-narrative" }
nexus-knowledge = { path = "../nexus-knowledge" }
# NXM-7: the E10 memory inputs are the upstream contract DTO
# (`spoke_schemas::RetainedRecord`) reached through this crate's single
# spoke-adapter import boundary; the legacy memory-file parser is no longer a
# dependency of this crate.
nexus-spoke-adapter = { path = "../nexus-spoke-adapter", default-features = false }
# The DTO's `updated_at` recency key is `DateTime<Utc>`.
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Cloud-stage optional dependency
nexus-cloud-sync = { path = "../nexus-cloud-sync", optional = true }

[features]
default = []
cloud-stage = ["dep:nexus-cloud-sync"]
