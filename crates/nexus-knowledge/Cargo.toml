[package]
name = "nexus-knowledge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
# V1.145 P1a: the WorldKbEntry↔KnowledgeEntry conversion seam + lifecycle
# delegation moved OUT of this crate into `nexus-spoke-adapter` (orphan rule
# → free functions + a local trait there). This reversed the former
# `nexus-knowledge → nexus-spoke-adapter` edge to
# `nexus-spoke-adapter → nexus-knowledge` (spec §8 dep-graph reversal), so
# this crate no longer depends on `nexus-spoke-adapter`. `spoke-schemas`
# stays because `world_kb/mod.rs` re-exports the spoke `KnowledgeEntry` wire
# type for consumers (e.g. nexus-orchestration) that read it through this crate.
spoke-schemas.workspace = true
async-trait.workspace = true
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# tracing was a dep of the former nexus-kb; relocated world_kb modules use it.
tracing.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# V1.139 P1 T6 — spoke-operations parity tests moved to `nexus-spoke-adapter`
# in V1.145 P1a (they exercise the conversion seam + lifecycle trait that now
# live there). This crate's own tests no longer reference spoke-adapter.
nexus-contracts = { path = "../nexus-contracts" }
