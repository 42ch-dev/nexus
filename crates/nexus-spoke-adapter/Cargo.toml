[package]
name = "nexus-spoke-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-aggregation boundary between nexus domain concerns and spoke standard objects — extensions.nexus accessors, lifecycle delegation, conversion seam, production NexusAdapter + 6 port impls"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde.workspace = true
serde_json.workspace = true
# V1.145 P1a — the WorldKbEntry↔KnowledgeEntry conversion seam + the
# `WorldKbEntrySpokeExt` lifecycle trait moved here from `nexus-knowledge`
# (orphan rule: both WorldKbEntry and KnowledgeEntry are foreign to
# `nexus-knowledge`'s `From` impls, so the seam became free functions /
# a local trait in this crate). This reverses the former
# `nexus-knowledge → nexus-spoke-adapter` edge to
# `nexus-spoke-adapter → nexus-knowledge` (spec §8 dep-graph reversal).
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-contracts = { path = "../nexus-contracts" }
chrono.workspace = true
# V1.145 P1b — the production `NexusAdapter` (V1.146 rename) + 6 port impls rehomed
# here from `nexus-local-db/src/spoke_adapter/` (spec §7.4 / §8 dep-graph
# reversal). The adapter consumes local-db's storage primitives
# (`SqliteKbStore`, `open_pool`, `run_migrations`, CAS helpers) and bridges
# spoke's sync port traits to async SQLite I/O. This edge replaces the
# former `nexus-local-db → nexus-spoke-adapter` dep (now removed).
nexus-local-db = { path = "../nexus-local-db" }
# V1.146 P2 T2 — ComputablePort impl bridges spoke compute requests to nexus's
# stateless WASM host via the session store (Decision 2 mapping table).
nexus-wasm-host = { path = "../nexus-wasm-host" }
# V1.148 P3 N-C0 — the HostCapabilityManifest honesty surface: the shared
# manifest builder resolves the installation device-id (`~/.nexus42/device-id`)
# through the path-layout SSOT when no host_id is injected.
nexus-home-layout = { path = "../nexus-home-layout" }
dirs = { workspace = true }
sqlx.workspace = true
tokio.workspace = true
# V1.149 P0 T1 — `modules.activation` `match: "regex"` flavor (architect lock Q6;
# workspace pin, same as `nexus-contracts` generated code).
regress = { workspace = true }

[dev-dependencies]
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde_json.workspace = true
tempfile = "3"
# Integration tests (spoke_parity) reference nexus domain types directly.
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-contracts = { path = "../nexus-contracts" }
