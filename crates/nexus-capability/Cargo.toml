[package]
name = "nexus-capability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Private capability port and error contract: Capability trait, provider ports, ToolPolicy, session cancellation resolver."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
nexus-contracts = { path = "../nexus-contracts" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net"] }
sqlx = { workspace = true }
chrono = { workspace = true }
futures-util = "0.3"
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tracing = { workspace = true }
nexus-preset = { path = "../nexus-preset" }
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-spoke-adapter = { path = "../nexus-spoke-adapter" }
nexus-local-db = { path = "../nexus-local-db" }
nexus-narrative = { path = "../nexus-narrative" }
nexus-creator-memory = { path = "../nexus-creator-memory" }
nexus-wasm-host = { path = "../nexus-wasm-host" }
nexus-compute-policy = { path = "../nexus-compute-policy" }
uuid = { workspace = true }
handlebars = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = "4"
