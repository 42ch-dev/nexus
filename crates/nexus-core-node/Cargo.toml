[package]
name = "nexus-core-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API cdylib for nexus core + provider port (v1.189 P2-T1)"

[lints.rust]
unsafe_code = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
# `execution` (P3 engine/schedule authority) + `provider-host` (the hosted
# production factory's Host-plane half, v1.195 P0-T5) without `compute`: the
# WASM edge stays a daemon-cohort capability per architecture §Cohorts.
nexus-core = { path = "../nexus-core", features = ["execution", "provider-host"] }
nexus-contracts = { path = "../nexus-contracts" }
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-provider-ports = { path = "../nexus-provider-ports" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
dashmap = "6"
uuid = { workspace = true }

sqlx = { workspace = true }
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-local-db = { path = "../nexus-local-db" }
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-creator-memory = { path = "../nexus-creator-memory" }

[build-dependencies]
napi-build = { workspace = true }
sha2 = { workspace = true }
nexus-local-db = { path = "../nexus-local-db" }

[[bin]]
name = "native-wire-fixture-seed"
path = "src/bin/native_wire_fixture_seed.rs"

[dev-dependencies]
tempfile = "3"
