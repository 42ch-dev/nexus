[package]
name = "nexus-core-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API cdylib for nexus core + provider port (v1.189 P2-T1)"

[lints.rust]
unsafe_code = "allow"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
nexus-core = { path = "../nexus-core" }
nexus-contracts = { path = "../nexus-contracts" }
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-provider-ports = { path = "../nexus-provider-ports" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = "1"
async-trait = { workspace = true }

sqlx = { workspace = true }
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-local-db = { path = "../nexus-local-db" }

[build-dependencies]
napi-build = { workspace = true }

[[bin]]
name = "native-wire-fixture-seed"
path = "src/bin/native_wire_fixture_seed.rs"
