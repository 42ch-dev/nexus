[package]
name = "nexus-contracts"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Distribution-only exclusion: the repository keeps and CI runs this schema
# audit (tooling/check-wire-drift.sh); the packaged archive omits the test
# because it reads the repository `schemas/` tree, which is not distributed.
exclude = ["tests/schema_drift_detection.rs"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# V1.138 T4: typify-generated types under `src/generated/` reference these.
# `"format": "date-time"` → `chrono::DateTime`; `"format": "regex"` → `regress::Regex`.
chrono.workspace = true
regress.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_yaml.workspace = true
