[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral World KB core service (v1.189 P1-T2)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# v1.190 architecture §Cohorts — optional edges. The default/domain cohort
# pulls none of these; each `dep:` edge stays inert until its feature is
# requested. `compute` is never enabled by default/domain/Connect-host.
provider-host = ["dep:nexus-agent-host", "dep:nexus-acp-host", "dep:nexus-provider-ports", "dep:futures-util"]
# v1.207 P3-T1 (spec §B.1): the stable durable operation id layer alone. It
# needs only the hashing edge, and the Connect host — which links neither
# `execution` nor `compute` — resolves ids through it, so it is its own
# smallest feature rather than an execution-only edge.
operation-id = ["dep:sha2", "dep:hex"]
execution = [
    "dep:nexus-orchestration",
    # The Simulate route is served at this execution edge only: the walk runs in-process,
    # constructs no executor or provider, and stays out of the default/domain cohort.
    "nexus-orchestration/simulate",
    "dep:nexus-workflow-ir",
    "dep:nexus-provider-ports",
    "dep:graph-flow",
    "dep:tokio-util",
    "operation-id",
    # The durable workspace commit authority moved out of the daemon: the
    # intent/digest/recovery protocol hashes content (via `operation-id`'s
    # sha2/hex), decodes base64 manifest bodies and uses renameat/linkat for
    # the atomic file apply. The rest are execution-only edges.
    "dep:base64",
    "dep:nix",
]
# The crash/rendezvous seams the workspace-commit recovery proofs drive. They
# are compiled out of a production build and enabled by this package's own
# dev-dependency self-reference, exactly as the daemon did before the move.
# `nexus-local-db` carries the binding-removal write-contention report the D15
# ordering proof waits on, so its seam rides the same switch.
test-hooks = ["nexus-local-db/test-hooks"]
compute = ["execution", "dep:nexus-wasm-host", "nexus-spoke-adapter/compute"]
# Connect-host product cohort (v1.207 P2): the WS accept loop, per-session
# monitoring and the peer-tools event lane the shipped `nexus-runtime` /
# `nexus42 connect start` boot. This is the Connect-host surface only — it
# carries NO rmcp: the reverse-invoke/operator MCP bridge is not a
# Connect-host capability, so the product graph stays rmcp-free
# (architecture §Cohorts; `tooling/check-graph-pins.sh` asserts rmcp ABSENT
# from the nexus42 connect-host graph). `execution` is an explicit
# prerequisite: this cohort's public peer API is execution-owned (peer-tool
# types, capability and async-trait) and the accept loop holds an
# orchestration capability registry.
connect-host = [
    "execution",
    "dep:spoke-connect",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:getrandom",
]
# Reverse-invoke/peer-control edge (v1.190 P4-T3): the full peer/MCP session
# library = the `connect-host` transport cohort PLUS the rmcp bridge; the
# spoke remote adapter types the WS transport implements. The rmcp bridge is
# a direct edge here, and the embedded server (Model B) additionally needs
# `embedded-mcp`. The shipped Connect-host product does NOT enable this
# cohort (it links no rmcp); only the app-level MCP/peer library does.
connect-client = [
    "connect-host",
    # mcp_bridge's rmcp server surface compiles with connect-client; only
    # the embedded server (Model B) additionally needs embedded-mcp.
    "dep:rmcp",
]
# Model B's sink/stream session channels (futures_channel::mpsc) ride the
# same rmcp transport module; the shell compiles only under embedded-mcp.
embedded-mcp = ["connect-client", "dep:rmcp", "dep:futures-channel"]
# v1.229 N3 Task 1: the remote memory client (n3-provider-binding.md §6). The
# smallest cohort that can dial a provider — the signed Connect client, the WS
# transport and the public peer-id accessor. It enables NO accept/session/
# peer-control/rmcp/execution edge: `connect/mod.rs` compiles only
# `ws_transport` under this feature, and `memory_remote` is the only module
# that consumes it. Default/domain builds keep zero Connect edges.
memory-remote = [
    "dep:spoke-connect",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:ed25519-dalek",
]

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-preset = { path = "../nexus-preset" }
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-local-db = { path = "../nexus-local-db" }
# v1.190 P2-T0 (architecture §8): the core's local-outbox reuse is a normal
# domain dependency on the existing nexus-cloud-sync `legacy-sync`
# implementation (guarded, engine/Host-free). No new outbox implementation.
nexus-cloud-sync = { path = "../nexus-cloud-sync", features = ["legacy-sync"] }
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-spoke-adapter = { path = "../nexus-spoke-adapter", default-features = false }
nexus-narrative = { path = "../nexus-narrative" }
nexus-creator-memory = { path = "../nexus-creator-memory" }
nexus-moment-context-assembly = { path = "../nexus-moment-context-assembly" }
nexus-orchestration = { path = "../nexus-orchestration", optional = true }
# Simulate route input type: the candidate IR the walk reads. Enabled with `execution` only.
nexus-workflow-ir = { path = "../nexus-workflow-ir", optional = true }
# v1.190 P4-T3 connect-client cohort edges: the WS transport speaks the
# spoke remote-adapter Transport; tungstenite is the bounded WS wire.
spoke-connect = { workspace = true, features = ["remote-adapter"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
# identity.rs seeds the per-peer device identity from the OS CSPRNG.
getrandom = { version = "0.4", optional = true }
# v1.229 N3 Task 1 (n3-provider-binding.md §5.1/D18): the remote client derives
# the loaded credential's Ed25519 PUBLIC peer identity — the same keypair its
# signed hello presents — from the seed both this accessor and the dial consume.
# `memory-remote` only; the default/domain graph gains no crypto edge.
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
# Model B session transport channels (embedded-mcp edge only).
futures-channel = { version = "0.3", optional = true }
nexus-provider-ports = { path = "../nexus-provider-ports", optional = true }
# graph-flow is the engine's session backend: the execution layer names
# `SessionStorage` directly (the engine trait surface does not re-export it).
graph-flow = { version = "=0.8.1", default-features = false, optional = true }
tokio-util = { workspace = true, optional = true }
nexus-agent-host = { path = "../nexus-agent-host", optional = true }
nexus-acp-host = { path = "../nexus-acp-host", optional = true }
# v1.190 P4-T2: the Host authority composes the selected provider port and
# drains Host event streams (both provider-host cohort edges).
futures-util = { workspace = true, optional = true }
nexus-wasm-host = { path = "../nexus-wasm-host", optional = true }
# `server` is the smallest role covering mcp_bridge's ServerHandler
# surface (RoleServer/RequestContext); the client role is not needed.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client"], optional = true }
# async-trait implements the execution cohort's port traits and the module's
# test doubles, and — since v1.227 NXM-1 — `spoke_operations::MemoryPort`,
# whose `#[async_trait]` declaration must be re-expanded on the impl side.
# The memory provider is part of the default cohort, so this edge is no
# longer optional.
async-trait = { workspace = true }
# v1.227 NXM-1 (spoke-memory §7): the provider implements the upstream
# `MemoryPort` boundary and reuses its generated wire types (reachable through
# `spoke_operations::spoke_schemas`) plus the pure validators/digest helpers,
# so the adapter stays the only spoke edge a *consumer* needs while the
# boundary itself is named once here.
spoke-operations.workspace = true
# The durable workspace commit authority (v1.190 P3-T2) moved out of the
# daemon with its module set. These edges are `execution`-only:
#   sha2   — content-addressed OCC hashes for the snapshot/intent digest
#   hex    — lowercase-hex rendering of those digests
#   base64 — manifest `contentBase64` body decode
#   nix    — renameat/linkat + flock for the atomic file apply and the
#            workspace-authority lease. Unix-only, so it is declared under
#            `cfg(unix)` and its `dep:nix` edge only resolves there.
hex = { version = "0.4", optional = true }
base64 = { version = "0.23", optional = true }
sha2 = { workspace = true, optional = true }
serde.workspace = true
# §3.2 endpoint discipline: the raw endpoint is validated with the same
# `http::Uri` grammar `tokio_tungstenite::connect_async` consumes, instead of
# a second parser with a different normalization. Already in the workspace
# lock through the WS transport.
http = "1"
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
toml.workspace = true
uuid.workspace = true
serde_yaml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative atomic mutation (openat/renameat/linkat/unlinkat) and the
# advisory workspace-authority lease. Every use site is `cfg(unix)`-gated, so
# the edge is scoped to Unix rather than linked on every target.
nix = { version = "0.31.3", features = ["fs"], optional = true }
# §3.1 credential-file opening: `O_NOFOLLOW | O_NONBLOCK` flags make the
# symlink/special-file refusal atomic with the open. Constants only; `libc`
# is already resolved in the workspace lock through `nix`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# §3.1 credential-file privacy gate (I313/D43): the loader inspects the
# already-open credential handle's DACL through the workspace's audited
# native-access-policy bridge — the only crate whose `unsafe` exception covers
# these OS calls — so this crate keeps its inherited `unsafe_code` forbid.
nexus-config-metadata = { path = "../nexus-config-metadata" }

[dev-dependencies]
# Enable the gated execution test seams for this package's own tests without
# exposing them in the production build.
# `compute` is included so the capability/compute integration target can
# reach the gated WASM path; the target itself is `#![cfg(feature = ...)]`,
# so a user of this package is unaffected.
# The integration targets cover every cohort this crate owns, so the test
# seam must enable all of them: `provider-host` (HostHandle/actor sessions),
# `connect-client` (peer-control/connect tables) and `execution`+`compute`
# (execution lifecycle, capability/compute). Without the first two the
# `host_actor_lifecycle` / `peer_control` targets cannot resolve their public
# surface.
nexus-core = { path = ".", features = [
    "execution",
    "compute",
    "test-hooks",
    "provider-host",
    "connect-client",
] }
serial_test = "4"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Only `parking_lot` needs a dev-dep: the relocated execution regression module
# builds one scripted engine fixture with interior mutability, and parking_lot
# is not otherwise a `nexus-core` dependency. The integration targets' other
# imports (`nexus-provider-ports`, `nexus-local-db`, `async-trait`) come from
# `[dependencies]`.
parking_lot = "0.13"
# The capability/compute target builds a real WASM module and a real user
# capability scan, so it needs the engine, the WAT compiler and the capability
# scanner's dependencies.
nexus-wasm-host = { path = "../nexus-wasm-host" }
nexus-orchestration = { path = "../nexus-orchestration" }
nexus-knowledge = { path = "../nexus-knowledge" }
# The WAT compiler named above: the capability/compute target compiles the
# runaway module its sandbox-limit cases trap on (the same way
# `nexus-wasm-host`'s own sandbox tests build their loop fixture).
wat = "1"
# v1.193 P2-T10: the peer-transport and Model B retained contract target
# builds fixed-seed Ed25519 keypairs (dialer identity + the `peer_keys.json`
# public-key map the accept loop's hello verification reads) — the same
# derivation path spoke-connect's own core uses, and the dev-dep the retired
# daemon-runtime peer fixtures carried. Dev-only: the shipped graph is
# untouched (the crate is already in the lockfile via spoke-connect).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
chrono.workspace = true
serde_json.workspace = true
# p4 t3 fix wave 1: the World KB authored-module allocation regression check
# counts the current thread's allocations. The workspace lints forbid
# `unsafe_code`, so a counting `GlobalAlloc` cannot be hand-rolled in this
# crate; this dev-dep ships one (MIT/Apache-2.0, no transitive dependencies)
# and is test-only — the shipped graph is untouched.
allocation-counter = "0.8"
# The C-110 writer-fence anchor drives one connection with the protocol scalar
# functions installed but no registration row — the exact "outside the guard"
# writer shape — so it needs the audited FFI boundary directly.
nexus-storage-guard = { path = "../nexus-storage-guard" }
