[package]
name = "nexus-local-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
uuid = { workspace = true }
blake3 = { workspace = true }
tracing = { workspace = true }
nexus-contracts = { path = "../nexus-contracts" }
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-narrative = { path = "../nexus-narrative" }
nexus-knowledge = { path = "../nexus-knowledge" }
# V1.145 P1b — standard spoke-library usage: `narrative_gateway::get_timeline_ordered`
# calls the spoke `order_timeline_events_by_ids` ordering helper directly. `spoke-operations`
# is a leaf dependency (no cycle) — standard library usage like depending on `serde`, not a
# spoke-adapter aggregation concern. Routing that ordering back through the spoke-adapter
# boundary is a V1.146 refactor (needs the narrative read in a spoke-adapter-dependent layer).
# See spec §7.4 "Read-path ScopeQuery adoption".
spoke-operations = { workspace = true }
async-trait.workspace = true
futures-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { workspace = true }
