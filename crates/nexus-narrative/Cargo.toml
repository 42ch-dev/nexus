[package]
name = "nexus-narrative"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-knowledge = { path = "../nexus-knowledge" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
strum.workspace = true
# V1.143 P0 T1: spoke standard `TimelineEvent` is the wire boundary type for
# the L5 temporal axis. The two `From` impls in `timeline_event.rs` are the
# sole conversion seam (spec spoke-adapter-architecture.md §7.1).
spoke-schemas.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# V1.145 P1b — the timeline-helper adoption test references spoke wire types
# (`TimelineEvent`, `SpokeRejectCode`) re-exported through the adapter
# boundary. The runtime dep on spoke-adapter was removed when the edge was
# reversed (spoke-adapter → local-db); the test keeps it as a dev-dep.
nexus-spoke-adapter = { path = "../nexus-spoke-adapter" }
