[package]
name = "nexus-narrative"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-knowledge = { path = "../nexus-knowledge" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
strum.workspace = true
# V1.143 P0 T1: spoke standard `TimelineEvent` is the wire boundary type for
# the L5 temporal axis. The two `From` impls in `timeline_event.rs` are the
# sole conversion seam (spec spoke-adapter-architecture.md §7.1).
spoke-schemas.workspace = true
# V1.145 P1b — standard spoke-library usage: `InMemoryNarrativeGateway::get_timeline_ordered`
# calls the spoke `order_timeline_events_by_ids` beat-assist helper. `spoke-operations` is a
# leaf dependency (no cycle), used the same way a crate depends on `serde`. Earlier this came
# via `nexus-spoke-adapter`, but adding `nexus-spoke-adapter → nexus-local-db` (the P1b adapter
# rehome) would have created a `local-db → narrative → spoke-adapter → local-db` cycle, so the
# dep edge was reversed and narrative now takes `spoke-operations` directly. Routing the helper
# back through the spoke-adapter boundary is a V1.146 refactor (needs narrative ordering to live
# in a spoke-adapter-dependent layer). See spec §7.4 "Read-path ScopeQuery adoption".
spoke-operations = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# V1.145 P1b — the timeline-helper adoption test references spoke wire types
# (`TimelineEvent`, `SpokeRejectCode`) re-exported through the adapter
# boundary. The runtime dep on spoke-adapter was removed when the edge was
# reversed (spoke-adapter → local-db); the test keeps it as a dev-dep.
nexus-spoke-adapter = { path = "../nexus-spoke-adapter" }
