[package]
name = "nexus-narrative"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nexus-contracts = { path = "../nexus-contracts" }
nexus-knowledge = { path = "../nexus-knowledge" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
strum.workspace = true
# V1.143 P0 T1: spoke standard `TimelineEvent` is the wire boundary type for
# the L5 temporal axis. The two `From` impls in `timeline_event.rs` are the
# sole conversion seam (spec spoke-adapter-architecture.md §7.1).
spoke-schemas.workspace = true
# V1.145 P1b — TEMPORARY P4 dep: `InMemoryNarrativeGateway::get_timeline_ordered`
# calls the spoke `order_timeline_events_by_ids` beat-assist helper. Previously
# this came via `nexus-spoke-adapter`, but adding `nexus-spoke-adapter →
# nexus-local-db` (the P1b adapter rehome) created a transitive cycle
# (local-db → narrative → spoke-adapter → local-db). Routing the helper
# through `spoke-operations` directly breaks the cycle. Once P4 routes
# `get_timeline_ordered` through the adapter's `ScopeQueryPort`, this dep
# moves back to `nexus-spoke-adapter` (the single spoke boundary). Tracked:
# spec §7.4 P4 read-path adoption.
spoke-operations = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# V1.145 P1b — the timeline-helper adoption test references spoke wire types
# (`TimelineEvent`, `SpokeRejectCode`) re-exported through the adapter
# boundary. Runtime dep on spoke-adapter was removed to break the
# local-db → narrative → spoke-adapter → local-db cycle; the test keeps it
# as a dev-dep.
nexus-spoke-adapter = { path = "../nexus-spoke-adapter" }
