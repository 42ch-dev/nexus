[package]
name = "nexus-home-layout"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared ADR-014 path layout helpers (~/.nexus42/creators/.../workspaces/...)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# V1.148 P3 N-C0: device-id get/create moved here from nexus-cloud-sync so the
# path SSOT (this crate owns `device_id_path`) also owns the value read/write.
uuid = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
# I-000113: the shared `config.toml` lock lives here (also used by nexus-core).
chrono = { workspace = true }
tracing = { workspace = true }
# I-000299 (D36): the audited native bridge that carries the replaced
# document's access policy onto the atomic replacement.
nexus-config-metadata = { path = "../nexus-config-metadata" }

[dev-dependencies]
tempfile = "3"
