[package]
name = "nexus-daemon-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexus Daemon Runtime — lifecycle, subsystems, and local API"

[lints]
workspace = true

[dependencies]
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-contracts = { path = "../nexus-contracts" }
nexus-creator = { path = "../nexus-creator" }
nexus-local-db = { path = "../nexus-local-db" }
nexus-orchestration = { path = "../nexus-orchestration" }
# V1.61 P-last T1: daemon-wide singleton WasmEngine + module cache, injected
# into `narrative.compute` via `CapabilityRegistry::with_runtime_deps_and_wasm`.
nexus-wasm-host = { path = "../nexus-wasm-host" }
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-acp-host = { path = "../nexus-acp-host" }
nexus-creator-memory = { path = "../nexus-creator-memory" }
nexus-narrative = { path = "../nexus-narrative" }
nexus-kb = { path = "../nexus-kb" }
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-moment-context-assembly = { path = "../nexus-moment-context-assembly" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
statig = { workspace = true }
tempfile = "3"
async-trait = "0.1"
tokio-util = { workspace = true }
subtle = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
regex = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
nix = { version = "0.28", features = ["fs"] }
rust-embed = { version = "8.11.0", default-features = false, features = ["mime-guess"] }
mime_guess = "2.0.5"
# V1.92 P-1 T1 — TLS transport security (self-signed Ed25519 cert via rcgen,
# axum-server bind_rustls drop-in for non-loopback listeners).
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rcgen = "0.13"
rustls-pemfile = "2"
# V1.92 P0: parse persisted certificate SANs to detect bind-host mismatch.
x509-parser = "0.17"

[dev-dependencies]
axum-test = "15"
graph-flow = "=0.2.3"
nexus-orchestration = { path = "../nexus-orchestration" }
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-rustls = "0.26"

[[bench]]
name = "dispatch_latency"
harness = false

[features]
test-support = []
