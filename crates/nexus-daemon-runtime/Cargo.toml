[package]
name = "nexus-daemon-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexus Daemon Runtime — lifecycle, subsystems, and local API"

[lints]
workspace = true

[dependencies]
nexus-home-layout = { path = "../nexus-home-layout" }
nexus-contracts = { path = "../nexus-contracts" }
nexus-creator = { path = "../nexus-creator" }
nexus-local-db = { path = "../nexus-local-db" }
nexus-orchestration = { path = "../nexus-orchestration" }
# V1.61 P-last T1: daemon-wide singleton WasmEngine + module cache, injected
# into `narrative.compute` via `CapabilityRegistry::with_runtime_deps_and_wasm`.
nexus-wasm-host = { path = "../nexus-wasm-host" }
nexus-agent-host = { path = "../nexus-agent-host" }
nexus-acp-host = { path = "../nexus-acp-host" }
nexus-creator-memory = { path = "../nexus-creator-memory" }
nexus-narrative = { path = "../nexus-narrative" }
nexus-knowledge = { path = "../nexus-knowledge" }
nexus-moment-context-assembly = { path = "../nexus-moment-context-assembly" }
# V1.142 P2: first production orchestrator cutover. `promote_adopt` routes
# through `orchestrate_promote(&NexusAdapter, PromoteRequest)`; the
# spoke wire types (`KnowledgeEntry`, `PromoteRequest`, `PromoteResponse`,
# `SpokeResult`, `SpokeRejectCode`) come from this crate (spec §7 — single
# boundary that crosses into spoke standard objects).
nexus-spoke-adapter = { path = "../nexus-spoke-adapter" }
graph-flow = "=0.2.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
statig = { workspace = true }
tempfile = "3"
async-trait = "0.1"
tokio-util = { workspace = true }
subtle = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
regex = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
nix = { version = "0.28", features = ["fs"] }
# V1.153 P2 (DF-73): the embedded `apps/web` SPA is compile-time-gated behind
# the `web-embed` feature (default ON; OFF for the slim `nexus-runtime`
# artifact — see the P2 spec § Subsystem profile). `rust-embed` + the
# `static_assets` mod + the api SPA fallback are all gated on it.
rust-embed = { version = "8.11.0", default-features = false, features = ["mime-guess"], optional = true }
mime_guess = "2.0.5"
# V1.92 P-1 T1 — TLS transport security (self-signed Ed25519 cert via rcgen,
# axum-server bind_rustls drop-in for non-loopback listeners).
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rcgen = "0.13"
rustls-pemfile = "2"
# V1.92 P0: parse persisted certificate SANs to detect bind-host mismatch.
x509-parser = "0.17"
# V1.127 P1 greploop: probe native CLI presence at boot before register_provider.
which = { workspace = true }
# V1.174 P0 T1 (AR-57/AR-61): peer-tools WS transport + conformance suite.
# ALL optional and wired to the `connect-client` feature — the default
# daemon graph must stay libp2p-free AND tungstenite-free. spoke-connect is
# pulled with `remote-adapter` (⇒ spoke-operations 0.11.1); its base deps
# always include libp2p =0.56.0 (non-optional upstream), so the feature-on
# graph gains libp2p exactly once via this crate (single-version lockstep,
# AR-61 #2 — `cargo tree --features connect-client,connect-host -i libp2p`
# must resolve to exactly one 0.56.x entry).
spoke-connect = { workspace = true, features = ["remote-adapter"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
# V1.174 P0 T2 (AR-67): spoke manifest types for the daemon's Connect hello
# (`spoke_schemas::HostCapabilityManifest`) — already in the DEFAULT graph
# via nexus-spoke-adapter (prior art, AR-73); optional keeps the feature-off
# graph unchanged.
spoke-schemas = { workspace = true, optional = true }
# V1.174 P0 T2 (AR-67): persistent Ed25519 identity seed generation.
# getrandom 0.2 is the already-locked default-graph CSPRNG stack (uuid et
# al.); optional keeps the feature-off graph unchanged.
getrandom = { version = "0.2", optional = true }
# V1.174 P0 T3 (AR-68): pure tool manifest/ABI helpers for the PeerToolTable
# admission chain (`validate_manifest_tools`, `parse_tool_capability_id`,
# `validate_tool_arguments`) AND for the user-capability catalog grammar
# check (QC-fix S-d — the local `matches_tools_grammar` mirror was removed
# in favor of the spoke helper). Already in the default graph via
# nexus-spoke-adapter (prior art, AR-73) — non-optional changes nothing in
# the shipped graph, verified by `tooling/check-graph-pins.sh`.
spoke-operations = { workspace = true }

[dev-dependencies]
axum-test = "15"
graph-flow = "=0.2.3"
nexus-orchestration = { path = "../nexus-orchestration" }
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-rustls = "0.26"
# `wat` compiles WebAssembly text → binary for integration tests that exercise
# sandbox-limit paths (mirrors nexus-wasm-host's own test convention).
wat = "1"
# V1.174 P0 T1: fixed-seed Ed25519 keypairs for the conformance + golden-path
# fixtures (same derivation path spoke-connect's core uses).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
parking_lot = "0.12"
# V1.174 P0 T1: spoke types for the golden-path fixtures (manifest building,
# `SpokeResult`/`spoke_ok` in the tool handler). Both crates are already in
# the default graph via nexus-spoke-adapter — no graph change.
spoke-operations = { workspace = true }

[[bench]]
name = "dispatch_latency"
harness = false

[features]
test-support = []
# V1.174 P0 (AR-61): peer-tools client stack — WS `Transport` (T1),
# accept loop + session manager (T2), manifest ingestion (T3), outbound
# authz (T4), honesty lockstep tests (T5). Everything behind it compiles
# away without the feature; the default daemon graph stays libp2p-free and
# tungstenite-free.
connect-client = [
    "dep:spoke-connect",
    "dep:tokio-tungstenite",
    "dep:spoke-schemas",
    "dep:getrandom",
]
# V1.153 P2 (DF-73): embedded Web UI (rust-embed SPA bytes) — default ON so
# the creator-facing daemon is unchanged; OFF (`--no-default-features`)
# compiles the SPA serving stack out of the `nexus-runtime` artifact.
web-embed = ["dep:rust-embed"]
default = ["web-embed"]
