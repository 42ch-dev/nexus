[package]
name = "nexus-connect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Peer Connect protocol: WS transport, accept loop, sessions, MCP bridge and the peer tool registry"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# The protocol-neutral peer tool registry alone (`peer_tools.rs` logs its
# admission refusals). `nexus-core`'s `execution` cohort owns the capability
# dispatch that consults it, so this is the one feature an execution-only
# consumer needs.
peer-tools = ["dep:nexus-spoke-adapter", "dep:tracing"]
# The one product WS transport the remote memory client shares with the peer
# stack (n3-provider-binding.md §6).
transport = ["dep:spoke-connect", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# The Connect-host product cohort: the accept loop, per-session monitoring,
# the peer-control lane and the event lane. Carries NO rmcp — the shipped
# Connect host stays rmcp-free.
connect-host = [
    "peer-tools",
    "transport",
    "dep:nexus-contracts",
    "dep:nexus-home-layout",
    "dep:nexus-orchestration",
    "dep:chrono",
    "dep:getrandom",
    "dep:serde",
    "dep:uuid",
]
# The reverse-invoke/operator MCP bridge on top of the Connect-host cohort.
connect-client = ["connect-host", "dep:rmcp"]
# Model B's embedded MCP server shell (sink/stream session channels).
embedded-mcp = ["connect-client", "dep:futures-channel", "dep:rmcp"]
# The remote memory client: the WS transport alone.
memory-remote = ["transport"]

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# The registry's descriptor/argument validators and its wire refusal code.
# Its whole use surface is behind `peer-tools`, so an unfeatured
# `nexus-connect` graph stays a single crate — `nexus-spoke-adapter` reaches
# `nexus-local-db`, which the peer protocol does not need.
nexus-spoke-adapter = { path = "../nexus-spoke-adapter", default-features = false, optional = true }
# Connect-host cohort inputs.
nexus-contracts = { path = "../nexus-contracts", optional = true }
nexus-home-layout = { path = "../nexus-home-layout", optional = true }
# The shared capability registry holder and its digest-poll watcher: the
# reserved-namespace derivation reads LIVE user-capability names from it.
nexus-orchestration = { path = "../nexus-orchestration", optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# identity.rs seeds the per-peer device identity from the OS CSPRNG.
getrandom = { version = "0.4", optional = true }
# transport cohort: the spoke remote-adapter Transport over the bounded WS wire.
spoke-connect = { workspace = true, features = ["remote-adapter"], optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
# Reverse-invoke/operator bridge (`connect-client`) and the embedded Model B
# server shell (`embedded-mcp`).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client"], optional = true }
futures-channel = { version = "0.3", optional = true }

[dev-dependencies]
tempfile.workspace = true
# The accept-lane fixtures build fixed-seed Ed25519 keypairs.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# The retained contract target's `#[tokio::test]` runtime and its sockets.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Lock guards in the socket-driven cases are held across an asserted step on
# purpose (the target's own justification comment).
parking_lot = "0.13"
# The process-global registry cases must not interleave with each other.
serial_test = "4"
