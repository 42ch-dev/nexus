# basic-combat — Nexus compute module (sample / reference implementation)
#
# This is a STANDALONE crate (compass Q2/Q10): it is NOT a member of the nexus
# workspace. Build it from this directory with:
#
#   cargo build --release --target wasm32-unknown-unknown
#
# The compiled .wasm is then copied into
# `crates/nexus-wasm-host/embedded-modules/basic-combat/basic-combat.wasm`
# (see ../../modules/README.md for the full procedure).
[package]
name = "basic-combat"
version = "1.0.0"
edition = "2021"
authors = ["42ch"]
license = "Apache-2.0"
description = "Sample Nexus WASM compute module: simple ATK−DEF combat resolution."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# The official module SDK owns every ABI-facing symbol: `nexus_entry!` generates
# the `alloc`/`init`/`compute` exports and wires the global allocator (dlmalloc,
# wasm-target-only) — this crate no longer declares any `#[no_mangle]` code.
# Path form for in-repo development (AR-1: published releases use
# `nexus-module-sdk = "0.1"`).
nexus-module-sdk = { path = "../nexus-module-sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Standalone workspace root so `cargo build` here does not traverse up into the
# nexus workspace.
[workspace]
