[package]
name = "nexus42"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexus CLI — creative world-building command-line interface"

[lints]
workspace = true

[lib]
name = "nexus42"
path = "src/lib.rs"

[[bin]]
name = "nexus42"
path = "src/main.rs"

[dependencies]
nexus-contracts = { path = "../../crates/nexus-contracts" }
nexus-orchestration = { path = "../../crates/nexus-orchestration" }
nexus-moment-context-assembly = { path = "../../crates/nexus-moment-context-assembly", features = ["cloud-stage"] }
nexus-creator-memory = { path = "../../crates/nexus-creator-memory" }
nexus-creator = { path = "../../crates/nexus-creator" }
nexus-cloud-sync = { path = "../../crates/nexus-cloud-sync", features = ["legacy-sync"] }
nexus-home-layout = { path = "../../crates/nexus-home-layout" }
nexus-local-db = { path = "../../crates/nexus-local-db" }
nexus-acp-host = { path = "../../crates/nexus-acp-host" }
nexus-daemon-runtime = { path = "../../crates/nexus-daemon-runtime" }
nexus-narrative = { path = "../../crates/nexus-narrative" }
nexus-knowledge = { path = "../../crates/nexus-knowledge" }
# V1.145 P2 — MCA WorldKB read routes through the spoke-adapter boundary
# (`SpokeBackedKbStore`), injected at the `assemble_moment` wiring site.
nexus-spoke-adapter = { path = "../../crates/nexus-spoke-adapter" }
# V1.148 P3 N-C0 (DF-72): Connect Host facade, opt-in via feature
# `connect-host` below. spoke-connect pulls libp2p 0.56 transitively — the
# default build (and `daemon start`) must stay libp2p-free, so this dep is
# `optional` and only `connect start` links it. `mdns` is never enabled.
spoke-connect = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"
toml_edit = "0.22"
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
# ACP SDK consumed via nexus-acp-host (worker-only linkage — see spec §11.3)
# agent-client-protocol = "=0.10.4"  — REMOVED: consumed through nexus-acp-host
# tokio-util, async-trait, async-broadcast — consumed through nexus-acp-host
# nix — also used directly by daemon.rs for process management
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

dialoguer = "0.11"
tempfile = "3"
regex = "1"
base64 = "0.22"
# V1.50 T-A P0 T2: cron validation + IANA TZ parsing (novel-writing staggering)
cron = { workspace = true }
chrono-tz = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"
# `serial_test` serializes tests that mutate process-global state (env vars).
# Without it, the summary_config_from_env_* tests race on NEXUS_CONTEXT_MAX_FILE_SIZE
# under cargo's default parallel runner and intermittently fail on CI.
serial_test = "3"

# V1.148 P3 N-C0 (DF-72): opt-in Connect Host surface. Feature OFF by default
# — the default daemon graph stays libp2p-free (`cargo tree -p nexus42 -i
# libp2p` empty). With the feature ON, `spoke-connect` links into the binary,
# but only `nexus42 connect start` opens a Connect listener; `daemon start`
# never does. `spoke-connect/mdns` is deliberately NOT enabled.
[features]
connect-host = ["dep:spoke-connect"]
