[package]
name = "nexus42"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexus CLI — creative world-building command-line interface"

[lints]
workspace = true

[lib]
name = "nexus42"
path = "src/lib.rs"

[[bin]]
name = "nexus42"
path = "src/main.rs"
# v1.193 P2-T13: the ordinary product is the `cli` cohort (the crate
# default). The Connect-only `nexus-runtime` bin below stays independent —
# `connect-host` never implies `cli`.
required-features = ["cli"]

# V1.153 P2 (DF-73): standalone headless Connect runtime — same crate's
# config/home-layout modules; no daemon runtime is linked and no embedded
# SPA bytes exist in the graph (v1.193 P2-T13 deleted both). Requires
# `connect-host` (the distributed artifact is built with
# `--no-default-features --features connect-host`; see the P2 spec §
# Subsystem profile).
[[bin]]
name = "nexus-runtime"
path = "src/bin/nexus-runtime.rs"
required-features = ["connect-host"]

# V1.148 P4 (DF-72 N-C0): real-process dogfood dialer — a spoke-connect
# reference peer that dials a running `nexus42 connect start` host from
# OUTSIDE the host process. Feature-gated so the default graph stays
# libp2p-free; built only with `--features connect-host`.
[[example]]
name = "connect_dialer"
path = "examples/connect_dialer.rs"
required-features = ["connect-host"]

# V1.153 P2 T1 (DF-73): spawned-process smoke probe for the headless
# `nexus-runtime` bin — same reference-peer shape, machine-readable output
# for `tests/nexus_runtime_smoke.rs`. Same feature gate: the default test
# graph stays libp2p-free.
[[example]]
name = "runtime_smoke_probe"
path = "examples/runtime_smoke_probe.rs"
required-features = ["connect-host"]

# Project-contained raw invoke bridge for the Trpg-legend standalone probe.
# It reuses spoke-connect's Rust transport and exposes only parent-process
# NDJSON over stdin/stdout; it is not a network service or Nexus product API.
[[example]]
name = "trpg_raw_bridge"
path = "examples/trpg_raw_bridge.rs"
required-features = ["connect-host"]

# V1.174 P1 T4 (AR-77): the three-process `e2e_peer_mcp.rs` harness was
# removed with Model A (v1.193 P1-T6) — its explicit `[[test]]` stanza is
# gone so the intermediate checkout is independently testable. The
# `connect-client` marker feature it needed is gone too (v1.193 P2-T13).

# Creates one world in the standalone probe's disposable workspace through
# Nexus' own schema and narrative-write API before the runtime starts.
[[example]]
name = "trpg_probe_bootstrap"
path = "examples/trpg_probe_bootstrap.rs"
required-features = ["connect-host"]

[dependencies]
nexus-contracts = { path = "../../crates/nexus-contracts" }
nexus-home-layout = { path = "../../crates/nexus-home-layout" }
# §2.1 basic allowlist: available to BOTH cohorts as a normal dependency —
# the `basic-cli` feature must not be a dependency switch (it is `[]`).
nexus-core = { path = "../../crates/nexus-core" }
nexus-preset = { path = "../../crates/nexus-preset" }
nexus-orchestration = { path = "../../crates/nexus-orchestration", optional = true }
nexus-moment-context-assembly = { path = "../../crates/nexus-moment-context-assembly", optional = true, features = ["cloud-stage"] }
nexus-creator-memory = { path = "../../crates/nexus-creator-memory", optional = true }
nexus-creator = { path = "../../crates/nexus-creator", optional = true }
nexus-cloud-sync = { path = "../../crates/nexus-cloud-sync", optional = true, features = ["legacy-sync"] }
nexus-local-db = { path = "../../crates/nexus-local-db", optional = true }
nexus-acp-host = { path = "../../crates/nexus-acp-host", optional = true }
nexus-agent-host = { path = "../../crates/nexus-agent-host", optional = true }
nexus-narrative = { path = "../../crates/nexus-narrative", optional = true }
nexus-knowledge = { path = "../../crates/nexus-knowledge", optional = true }
# v1.193 P2-T13 (technical contracts §3): the adapter's `compute` edge is
# NOT a default of the ordinary CLI cohort — `connect-host` enables
# `nexus-spoke-adapter/compute` explicitly (the peer compute op + shared
# WASM cache are retained Connect behavior).
nexus-spoke-adapter = { path = "../../crates/nexus-spoke-adapter", default-features = false, optional = true }
nexus-module-manifest = { path = "../../modules/nexus-module-manifest", optional = true }
# V1.148 P3 N-C0 (DF-72): Connect Host facade, opt-in via feature
# `connect-host` below. spoke-connect pulls libp2p 0.56 transitively — the
# default build must stay libp2p-free, so this dep is
# `optional` and only `connect start` links it. spoke-connect exposes no
# `mdns` feature (removed upstream in 0.9.2); hickory/libp2p-mdns stay
# lockfile-only via libp2p 0.56 optional deps, never compiled.
spoke-connect = { workspace = true, optional = true }
# V1.153 P1 N-C1: the connect wire `ErrorEnvelope`
# (`spoke_schemas::connect::connect_invoke_response::ErrorEnvelope`) the
# invoke handler returns. Same 0.10.0 pin; optional + feature-gated with
# `connect-host` (spoke-schemas is a lightweight schema crate, but the
# connect path is the only consumer).
spoke-schemas = { workspace = true, optional = true }
# libp2p identity/PeerId/Multiaddr types for the `connect start` CLI (key
# generation + protobuf key persistence + allowlist/listen parsing). Same
# 0.56 pin as spoke-connect's transport; optional + feature-gated with
# `connect-host` so the default graph stays libp2p-free.
libp2p = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "1.1"
toml_edit = { version = "0.25", optional = true }
reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "sqlite"] }
dirs = { workspace = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
dialoguer = { version = "0.12", optional = true }
tempfile = { version = "3", optional = true }
regex = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
cron = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
# ACP SDK consumed via nexus-acp-host (worker-only linkage — see spec §11.3)
# agent-client-protocol = "=0.10.4"  — REMOVED: consumed through nexus-acp-host
# tokio-util, async-trait, async-broadcast — consumed through nexus-acp-host
# nix was used directly by the deleted daemon.rs process management; no
# direct caller remains since v1.193 P2-T13 (kept optional, unlinked by the
# retained cohorts).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"], optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"
# `serial_test` serializes tests that mutate process-global state (env vars).
# Without it, the summary_config_from_env_* tests race on NEXUS_CONTEXT_MAX_FILE_SIZE
# under cargo's default parallel runner and intermittently fail on CI.
serial_test = "4"
# V1.153 P2 T1: spawned-binary smoke test (`tests/nexus_runtime_smoke.rs`).
# The Connect dialing lives in the `runtime_smoke_probe` EXAMPLE (regular
# connect-host deps — the default test graph stays libp2p-free); the test
# itself only spawns processes and asserts output.
tokio = { workspace = true }
tempfile = "3"
# V1.154 P2 T1: the Connect compute interop tests install the embedded
# `basic-combat` module into the hermetic home's `~/.nexus42/modules/`
# store (spec §2.1 — host-local module resolution). The Connect cohort
# reaches it through `nexus-spoke-adapter/compute`; this direct dev-dep
# makes its embedded-module registry callable from the in-crate tests.
nexus-wasm-host = { path = "../../crates/nexus-wasm-host" }
# V1.174 P1 T0 (AR-75 C-1): scripted in-process ACP agent probe
# (`tests/mcp_acp_probe.rs`) — the SDK's Agent/Client roles + Channel
# duplex run the full newSession.mcp_servers round trip without a live
# LLM. Same =2.1.0 pin already in the shipped graph via nexus-acp-host
# (stable v1 API only; no unstable protocol features); dev-only,
# tests-only (graph pins use --edges normal, dev-deps excluded).
agent-client-protocol = "=2.1.0"

# v1.193 P2-T13: the final feature lattice is the two real product
# cohorts from technical contracts §3. `cli` is the ordinary one-shot
# authoring/operator/cloud product (the crate default); `connect-host` is
# the independent Connect cohort — it enables only the shared
# config/errors/home/local-db/Connect modules, NEVER implies `cli`, and
# carries the explicit `nexus-spoke-adapter/compute` edge (peer compute +
# shared WASM cache are retained production behavior; dropping compute for
# a smaller graph is prohibited). `cli,connect-host` is the optional CLI
# Connect build: the same parser plus the `connect` group.
#
# The retired lattice (`basic-cli`, `legacy-cli`, `web-embed`,
# `connect-client`, `embedded-mcp`) is gone with the daemon composition.
[features]
default = ["cli"]
cli = [
  "dep:nexus-orchestration",
  "dep:nexus-moment-context-assembly",
  "dep:nexus-creator-memory",
  "dep:nexus-creator",
  "dep:nexus-cloud-sync",
  "dep:nexus-local-db",
  "dep:nexus-acp-host",
  "dep:nexus-agent-host",
  "dep:nexus-narrative",
  "dep:nexus-knowledge",
  "dep:nexus-spoke-adapter",
  "dep:nexus-module-manifest",
  "dep:clap_complete",
  "dep:toml_edit",
  "dep:reqwest",
  "dep:sqlx",
  "dep:uuid",
  "dep:chrono",
  "dep:sha2",
  "dep:hex",
  "dep:dialoguer",
  "dep:tempfile",
  "dep:regex",
  "dep:base64",
  "dep:cron",
  "dep:chrono-tz",
  "dep:nix",
]
connect-host = [
  "dep:chrono",
  "dep:nexus-knowledge",
  "dep:nexus-local-db",
  "dep:nexus-spoke-adapter",
  "nexus-spoke-adapter/compute",
  "dep:sqlx",
  "dep:spoke-connect",
  "dep:spoke-schemas",
  "dep:libp2p",
]
