[package]
name = "nexus42"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexus CLI — creative world-building command-line interface"

[lints]
workspace = true

[lib]
name = "nexus42"
path = "src/lib.rs"

[[bin]]
name = "nexus42"
path = "src/main.rs"

# V1.153 P2 (DF-73): standalone headless Connect runtime — same crate's
# config/home-layout/boot code, `run_daemon` never called. Requires
# `connect-host` (the distributed artifact is built with
# `--no-default-features --features connect-host`, web-embed OFF → no
# embedded SPA bytes; see the P2 spec § Subsystem profile).
[[bin]]
name = "nexus-runtime"
path = "src/bin/nexus-runtime.rs"
required-features = ["connect-host"]

# V1.148 P4 (DF-72 N-C0): real-process dogfood dialer — a spoke-connect
# reference peer that dials a running `nexus42 connect start` host from
# OUTSIDE the host process. Feature-gated so the default graph stays
# libp2p-free; built only with `--features connect-host`.
[[example]]
name = "connect_dialer"
path = "examples/connect_dialer.rs"
required-features = ["connect-host"]

# V1.153 P2 T1 (DF-73): spawned-process smoke probe for the headless
# `nexus-runtime` bin — same reference-peer shape, machine-readable output
# for `tests/nexus_runtime_smoke.rs`. Same feature gate: the default test
# graph stays libp2p-free.
[[example]]
name = "runtime_smoke_probe"
path = "examples/runtime_smoke_probe.rs"
required-features = ["connect-host"]

# Project-contained raw invoke bridge for the Trpg-legend standalone probe.
# It reuses spoke-connect's Rust transport and exposes only parent-process
# NDJSON over stdin/stdout; it is not a network service or Nexus product API.
[[example]]
name = "trpg_raw_bridge"
path = "examples/trpg_raw_bridge.rs"
required-features = ["connect-host"]

# V1.174 P1 T4 (AR-77): three-process E2E harness (`tests/e2e_peer_mcp.rs`) —
# real WS socket pair (spoke RemoteAdapter → daemon accept loop) + real axum
# HTTP daemon + real spawned `nexus42 mcp serve` child. Feature-gated so the
# default-feature CI never compiles it.
[[test]]
name = "e2e_peer_mcp"
path = "tests/e2e_peer_mcp.rs"
required-features = ["connect-client"]

# Creates one world in the standalone probe's disposable workspace through
# Nexus' own schema and narrative-write API before the runtime starts.
[[example]]
name = "trpg_probe_bootstrap"
path = "examples/trpg_probe_bootstrap.rs"
required-features = ["connect-host"]

[dependencies]
nexus-contracts = { path = "../../crates/nexus-contracts" }
nexus-orchestration = { path = "../../crates/nexus-orchestration" }
nexus-moment-context-assembly = { path = "../../crates/nexus-moment-context-assembly", features = ["cloud-stage"] }
nexus-creator-memory = { path = "../../crates/nexus-creator-memory" }
nexus-creator = { path = "../../crates/nexus-creator" }
nexus-cloud-sync = { path = "../../crates/nexus-cloud-sync", features = ["legacy-sync"] }
nexus-home-layout = { path = "../../crates/nexus-home-layout" }
nexus-local-db = { path = "../../crates/nexus-local-db" }
nexus-acp-host = { path = "../../crates/nexus-acp-host" }
# V1.153 P2 (DF-73): `default-features = false` + explicit `web-embed`
# forwarding (see [features]) — the slim `nexus-runtime` artifact
# (`--no-default-features --features connect-host`) compiles the embedded
# SPA out while the default `nexus42` build keeps it ON.
nexus-daemon-runtime = { path = "../../crates/nexus-daemon-runtime", default-features = false }
nexus-narrative = { path = "../../crates/nexus-narrative" }
nexus-knowledge = { path = "../../crates/nexus-knowledge" }
# V1.145 P2 — MCA WorldKB read routes through the spoke-adapter boundary
# (`SpokeBackedKbStore`), injected at the `assemble_moment` wiring site.
nexus-spoke-adapter = { path = "../../crates/nexus-spoke-adapter" }
# V1.170 P0 (AR-9): shared compute-module manifest contract + wasm_sha256
# injection for the `nexus42 compute` group. Non-workspace path dep — legal
# because the root workspace `exclude`s the crate (AR-1). No `connect-host`
# feature: the compute group never pulls libp2p into the default graph.
nexus-module-manifest = { path = "../../modules/nexus-module-manifest" }
# V1.148 P3 N-C0 (DF-72): Connect Host facade, opt-in via feature
# `connect-host` below. spoke-connect pulls libp2p 0.56 transitively — the
# default build (and `daemon start`) must stay libp2p-free, so this dep is
# `optional` and only `connect start` links it. spoke-connect exposes no
# `mdns` feature (removed upstream in 0.9.2); hickory/libp2p-mdns stay
# lockfile-only via libp2p 0.56 optional deps, never compiled.
spoke-connect = { workspace = true, optional = true }
# V1.153 P1 N-C1: the connect wire `ErrorEnvelope`
# (`spoke_schemas::connect::connect_invoke_response::ErrorEnvelope`) the
# invoke handler returns. Same 0.10.0 pin; optional + feature-gated with
# `connect-host` (spoke-schemas is a lightweight schema crate, but the
# connect path is the only consumer).
spoke-schemas = { workspace = true, optional = true }
# libp2p identity/PeerId/Multiaddr types for the `connect start` CLI (key
# generation + protobuf key persistence + allowlist/listen parsing). Same
# 0.56 pin as spoke-connect's transport; optional + feature-gated with
# `connect-host` so the default graph stays libp2p-free.
libp2p = { workspace = true, optional = true }
# V1.174 P0 T5 (AR-70): MCP server via rmcp 1.8.0 — `nexus42 mcp serve`
# is a stateless stdio bridge child (AR-71 Model A). Pinned exactly
# `=1.8.0` with `default-features = false` and ONLY `server` +
# `transport-io` (no client / streamable-HTTP / child-process features in
# the shipped graph). The crate hosting the rmcp server module is a direct
# optional dep behind `connect-client` (the shipped graph already carries
# rmcp 1.8.0 via agent-client-protocol =0.11.1 → prior art; the pin keeps
# exactly one version).
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "transport-io"], optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"
toml_edit = "0.22"
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
# V1.153 P2 T2: these six were previously declared after `nix` inside
# `[target.'cfg(unix)'.dependencies]` (missing section header), which broke
# every Windows build with E0433 "cannot find crate" in lib code using them
# on all platforms (works/cron.rs cron validation, auth/user_auth.rs base64,
# creator/memory.rs tempfile, rules_runtime.rs dialoguer). Moved here.
dialoguer = "0.11"
tempfile = "3"
regex = "1"
base64 = "0.22"
# V1.50 T-A P0 T2: cron validation + IANA TZ parsing (novel-writing staggering)
cron = { workspace = true }
chrono-tz = { workspace = true }
# ACP SDK consumed via nexus-acp-host (worker-only linkage — see spec §11.3)
# agent-client-protocol = "=0.10.4"  — REMOVED: consumed through nexus-acp-host
# tokio-util, async-trait, async-broadcast — consumed through nexus-acp-host
# nix — also used directly by daemon.rs for process management
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"
# V1.180 P2 T1 (DR-06 ops E2E): the shared LiveDaemon fixture wires a real
# orchestration engine (graph_flow::SessionStorage) and the preset-run e2e
# inspects persisted session context — graph-flow 0.2.3 is already in the
# lockfile via nexus-orchestration; dev-dep only (tests/common + tests/).
graph-flow = "=0.2.3"
# `serial_test` serializes tests that mutate process-global state (env vars).
# Without it, the summary_config_from_env_* tests race on NEXUS_CONTEXT_MAX_FILE_SIZE
# under cargo's default parallel runner and intermittently fail on CI.
serial_test = "3"
# V1.153 P2 T1: spawned-binary smoke test (`tests/nexus_runtime_smoke.rs`).
# The Connect dialing lives in the `runtime_smoke_probe` EXAMPLE (regular
# connect-host deps — the default test graph stays libp2p-free); the test
# itself only spawns processes and asserts output.
tokio = { workspace = true }
tempfile = "3"
# V1.154 P2 T1: the Connect compute interop tests install the embedded
# `basic-combat` module into the hermetic home's `~/.nexus42/modules/`
# store (spec §2.1 — host-local module resolution). nexus-wasm-host is
# already in the default graph via nexus-spoke-adapter; the dev-dep makes
# its embedded-module registry callable from the tests.
nexus-wasm-host = { path = "../../crates/nexus-wasm-host" }
# V1.174 P0 T6 (AR-74): E2E MCP harness (`tests/mcp_serve_e2e.rs`) — rmcp
# CLIENT (dev-only, tests-only) + the async-rw transport for the stdio
# tuple. The shipped graph keeps exactly one rmcp 1.8.0 (`server` +
# `transport-io` via the optional `connect-client` dep); the `--edges
# normal` graph pins in tooling/check-graph-pins.sh never count dev-deps.
rmcp = { version = "=1.8.0", default-features = false, features = ["client", "transport-async-rw"] }
# V1.174 P1 T0 (AR-75 C-1): scripted in-process ACP agent probe
# (`tests/mcp_acp_probe.rs`) — the SDK's Agent/Client roles + Channel
# duplex run the full newSession.mcp_servers round trip without a live
# LLM. Same =0.11.1 pin already in the shipped graph via nexus-acp-host;
# dev-only, tests-only (graph pins use --edges normal, dev-deps excluded).
agent-client-protocol = "=0.11.1"
# V1.174 P1 T4 (AR-77): three-process E2E harness (`tests/e2e_peer_mcp.rs`) —
# the integrator leg (spoke `RemoteAdapter` over a REAL tokio-tungstenite WS
# pair), the daemon leg (in-process accept loop + real axum HTTP listener),
# and the spawned `nexus42 mcp serve` child. Every crate is already in the
# lockfile via nexus-daemon-runtime's `connect-client` feature; dev-deps are
# tests-only and the `--edges normal` graph pins in
# tooling/check-graph-pins.sh never count them.
axum = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = { workspace = true }
spoke-connect = { workspace = true, features = ["remote-adapter"] }
spoke-operations = { workspace = true }
spoke-schemas = { workspace = true }
tokio-tungstenite = { workspace = true }

# V1.148 P3 N-C0 (DF-72): opt-in Connect Host surface. Feature OFF by default
# — the default daemon graph stays libp2p-free (`cargo tree -p nexus42 -i
# libp2p` empty). With the feature ON, `spoke-connect` links into the binary,
# but only `nexus42 connect start` opens a Connect listener; `daemon start`
# never does. spoke-connect 0.9.2 exposes no `mdns` feature (removed
# upstream); hickory/libp2p-mdns stay lockfile-only via libp2p 0.56 optional
# deps, never compiled.
[features]
connect-host = ["dep:spoke-connect", "dep:spoke-schemas", "dep:libp2p"]
# V1.174 P0 (AR-61 #1): forwarded gate for the peer-tools client stack on
# nexus-daemon-runtime. OFF by default — the default nexus42 graph stays
# libp2p-free; `--features connect-client` links the peer-tools transport +
# session subsystem into the daemon build.
connect-client = ["nexus-daemon-runtime/connect-client", "nexus-acp-host/connect-client", "dep:rmcp"]
# V1.179 P0 T1 (DF-88): forwarded gate for the embedded MCP server (Model B)
# on nexus-daemon-runtime. Nested under connect-client: `--features
# connect-client` compiles the shared bridge core but NOT the embedded
# server; `--features connect-client,embedded-mcp` compiles both.
embedded-mcp = ["connect-client", "nexus-daemon-runtime/embedded-mcp"]
# V1.153 P2 (DF-73): forwarded gate for the embedded Web UI — ON by default
# (the `nexus42` bin is unchanged); OFF for the `nexus-runtime` artifact via
# `--no-default-features --features connect-host` (compile-time exclusion of
# `apps/web/dist` bytes + the SPA fallback route, per the P2 spec
# § Subsystem profile).
web-embed = ["nexus-daemon-runtime/web-embed"]
default = ["web-embed"]
