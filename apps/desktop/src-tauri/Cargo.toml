[package]
name = "nexus-desktop"
version = "0.1.0"
edition = "2021"
description = "Nexus Tauri v2 desktop shell (macOS-first, unsigned dev build)."
authors = ["42ch"]
license = "Apache-2.0"
publish = false

# NOTE: This crate is intentionally a STANDALONE Tauri-managed crate.
# It is NOT a member of the root Cargo workspace (compass §5 #9).
# `cargo check` / `cargo build` must be run from this directory, not the repo
# root, so Tauri's build script + generated context resolve correctly.
# The empty `[workspace]` table below makes this directory its own workspace
# root, preventing cargo from auto-including it in the parent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# OS keychain/credential-manager access for V1.92 P1 remote connection config.
# keyring 4 (default `v1` feature): Entry::new forces one-time native store
# initialization; a failed init is cached for the process and Entry::new
# returns NoDefaultStore — connection_config.rs routes that through the same
# app-data fallback as operation failures. Identity is unchanged (service
# `nexus42`, user `connection_config`, no explicit target), so v2-stored
# credentials remain readable.
keyring = "4"
# Home-directory + config resolution for the workspace-root path guard (§5 #8).
# Mirrors the daemon's workspace_root source (`apps/nexus42/src/config.rs`):
# `~/.nexus42/config.toml` → `workspace_path`.
dirs = "5"
toml = "0.8"
toml_edit = "0.25"
# The standalone opener engine (same crate tauri-plugin-opener wraps). Used by
# the custom `open_with`/`reveal_in_finder` commands AFTER the runtime path
# guard accepts the path — calling it directly avoids coupling to the plugin's
# Rust extension-trait API surface and is the canonical macOS mechanism.
opener = "0.8.5"
# The Tauri dialog plugin (Rust crate only — no JS package is added). Used by
# the custom `pick_directory` command so the SPA can open a native folder picker
# through the existing transport boundary.
tauri-plugin-dialog = "2"
# Async runtime primitives for the sidecar lifecycle monitor (shared state + timers).
tokio = { version = "1.35", features = ["sync", "time", "net", "rt", "macros"] }
# Lightweight loopback health probe; reuses the same HTTP endpoint as the SPA.
# reqwest 0.13: default-features off — the probe is loopback HTTP/JSON only, so
# TLS/query/form machinery is not selected.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Observability for the sidecar lifecycle (backoff jitter, state transitions).
tracing = "0.1"
# Deterministic jitter for sidecar restart backoff (QC3-S5). Fast, no-std-friendly
# PRNG already present in the Tauri dependency tree.
fastrand = "2"
# UUID v4 for creator ID generation in setup bootstrap (V1.100 P0).
# Matches the generation pattern in nexus-creator/src/local_identity.rs:211-221.
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Unix signal handling for graceful sidecar shutdown (SIGTERM). V1.66 is macOS-only.
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
# Path-guard unit tests build temp workspace trees.
tempfile = "3"
# Enable Tauri test utilities (mock_app / mock_runtime) for sidecar lifecycle
# unit tests. Features unify with the normal dependency, so this only exposes
# the `tauri::test` module; it does not change runtime behavior.
tauri = { version = "2", features = ["test"] }
