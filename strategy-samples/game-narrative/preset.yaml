preset:
  id: game-narrative
  version: 1
  kind: creator
  description: 'Game narrative import: game-event (trigger) and interval-sweep (scheduled) lanes extracting worldview/character KnowledgeEntry drafts + Relation hints'
  requires_capabilities:
  - acp.prompt
  - creator.inject_prompt
  - judge.llm
  run_intents:
  - knowledge_ingest
  initial: routing
  terminal: done
  initial_action:
    kind: seed_direct
states:
- id: routing
  description: 'Lane selector. The expression engine resolves `_context.<path>` against a FLAT context JSON map (`build_context_json`), so a dotted key like `preset.input.mode` can never be read: `_context.preset.input.mode` resolves `map.get("preset")` -> null (context keys are stored literally, and the grammar has no bracket syntax). The only runtime-populated discriminator an expression can see is `_context._judge_result`, written by an `llm_judge` exit BEFORE branch evaluation — so lane selection is a tiny judge: GO (result true) -> scheduled interval sweep, NOGO (result false) -> game-event trigger lane. The judge prompt (templates/lane-route.md) reads the payload via {{preset.input.mode}}: template rendering nests dotted keys, unlike expression resolution.'
  exit_when:
    kind: llm_judge
    template_file: templates/lane-route.md
    judge_capability: judge.llm
  next:
    branches:
    - when: _context._judge_result == true
      target: scheduled_sweep
    default: trigger_extract
- id: trigger_extract
  description: 'Trigger lane: a game event arrives from the game runtime and becomes an extraction/assembly task. The trigger graph is sequenced with depends_on (trigger_parse -> extract_worldview -> extract_characters); each node template is self-contained and reads `preset.input` per the embedded-preset convention, and output_binding exports extract_characters.text.'
  enter:
  - kind: inner_graph
    name: trigger_graph
  exit_when:
    kind: graph_complete
  next: done
- id: scheduled_sweep
  description: 'Scheduled lane: an interval/cron-style sweep that inventories new or changed worldview/character documents since the last run, judges whether anything new exists, and only then extracts. Scan + judge happen BEFORE extraction, mirroring the embedded `research` preset''s scanning -> extracting split: this state only runs the inventory prompt (creator.inject_prompt queues it into the creator session), then the exit judge decides. Cadence: the judge re-evaluates at most once per interval (`min_interval: PT1H`); a NOGO parks this scan state (WaitForInput) and the next interval resumes it, so the cheap scan re-runs — never the LLM extraction work.'
  enter:
  - kind: capability
    name: creator.inject_prompt
    args:
      prompt_file: templates/scheduled-sweep.md
  exit_when:
    kind: llm_judge
    template_file: templates/scheduled-sweep-exit.md
    judge_capability: judge.llm
    min_interval: PT1H
  next: sweep_extract
- id: sweep_extract
  description: 'Scheduled lane extraction: worldview/character KnowledgeEntry drafts + Relation hints, running only after the `scheduled_sweep` judge says GO — the scan and judge happen there, so this graph is extraction only (extract_worldview -> extract_characters with depends_on). Each node template is self-contained and reads `preset.input` per the embedded-preset convention, and output_binding exports extract_characters.text.'
  enter:
  - kind: inner_graph
    name: sweep_graph
  exit_when:
    kind: graph_complete
  next: done
- id: done
  terminal: true
inner_graphs:
  sweep_graph:
    nodes:
    - id: extract_worldview
      kind: acp_prompt
      template_file: templates/import-worldview.md
      tool_policy: auto_grant_read_only
    - id: extract_characters
      kind: acp_prompt
      depends_on:
      - extract_worldview
      template_file: templates/import-character-sheet.md
      tool_policy: auto_grant_read_only
    output_binding: extract_characters.text
  trigger_graph:
    nodes:
    - id: trigger_parse
      kind: acp_prompt
      template_file: templates/trigger-game-event.md
      tool_policy: auto_grant_read_only
    - id: extract_worldview
      kind: acp_prompt
      depends_on:
      - trigger_parse
      template_file: templates/import-worldview.md
      tool_policy: auto_grant_read_only
    - id: extract_characters
      kind: acp_prompt
      depends_on:
      - extract_worldview
      template_file: templates/import-character-sheet.md
      tool_policy: auto_grant_read_only
    output_binding: extract_characters.text
signals:
- name: game_event
  on_receive:
    action: force_transition
    target: trigger_extract
